<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>儿童练字帖生成器</title>
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", sans-serif;
    background: #f5f5f5;
    color: #333;
  }

  /* ========== 控制面板 ========== */
  .control-panel {
    background: #fff;
    padding: 14px 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: flex-end;
  }
  .control-panel h1 {
    font-size: 17px;
    color: #e74c3c;
    width: 100%;
    margin-bottom: 2px;
  }
  .ctrl-group {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .ctrl-group label {
    font-size: 12px;
    color: #666;
  }
  .ctrl-group textarea {
    width: 260px;
    height: 52px;
    padding: 6px 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 14px;
    resize: vertical;
  }
  .ctrl-group select {
    padding: 5px 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 13px;
    min-width: 90px;
  }
  .ctrl-group input[type="number"] {
    padding: 5px 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 13px;
    width: 70px;
  }
  .btn {
    padding: 7px 18px;
    border: none;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
    font-weight: bold;
  }
  .btn-primary { background: #e74c3c; color: #fff; }
  .btn-primary:hover { background: #c0392b; }
  .btn-secondary { background: #3498db; color: #fff; }
  .btn-secondary:hover { background: #2980b9; }
  .checkbox-group {
    display: flex;
    align-items: center;
    gap: 5px;
    padding-bottom: 7px;
  }
  .checkbox-group input { width: 15px; height: 15px; }
  .checkbox-group label { font-size: 12px; color: #666; }

  /* ========== 练字帖区域 ========== */
  .worksheet {
    max-width: 210mm;
    margin: 16px auto;
    background: #fff;
    padding: 12mm 10mm;
    box-shadow: 0 0 10px rgba(0,0,0,0.05);
  }
  .worksheet-title {
    text-align: center;
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 4px;
    color: #333;
  }
  .worksheet-info {
    text-align: center;
    font-size: 11px;
    color: #999;
    margin-bottom: 12px;
  }
  .name-line {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #666;
    margin-bottom: 12px;
    border-bottom: 1px dashed #ddd;
    padding-bottom: 6px;
  }
  .name-line span { border-bottom: 1px solid #999; padding: 0 24px 0 4px; }

  /* 每个字的区块 */
  .char-block {
    margin-bottom: 14px;
    page-break-inside: avoid;
  }

  /* 标签行：包含字信息 + 笔顺展示 */
  .char-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
    min-height: 16mm;
  }
  .char-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    min-width: 38mm;
  }
  .char-meta .char-name {
    font-size: 14px;
    color: #e74c3c;
    font-weight: bold;
  }
  .char-meta .pinyin {
    font-size: 13px;
    color: #333;
    font-weight: bold;
  }
  .char-meta .stroke-count {
    font-size: 10px;
    color: #fff;
    background: #e74c3c;
    padding: 1px 7px;
    border-radius: 9px;
  }

  /* 笔顺展示区 */
  .stroke-showcase {
    display: flex;
    align-items: center;
    gap: 1px;
    flex: 1;
    min-width: 0;
    overflow: hidden;
  }
  .stroke-cell {
    position: relative;
    border: 0.8px solid #e74c3c;
    flex-shrink: 0;
    background: #fff;
  }
  .stroke-cell::before {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    left: 50%;
    border-left: 0.5px dashed #e74c3c;
    opacity: 0.4;
    pointer-events: none;
  }
  .stroke-cell::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    top: 50%;
    border-top: 0.5px dashed #e74c3c;
    opacity: 0.4;
    pointer-events: none;
  }
  .stroke-cell svg {
    display: block;
  }
  .stroke-arrow {
    color: #e74c3c;
    font-size: 14px;
    flex-shrink: 0;
    margin: 0 2px;
  }

  /* 田字格行 */
  .grid-row {
    display: flex;
    gap: 0;
  }
  .grid-row + .grid-row {
    margin-top: -1px; /* 重叠边框 */
  }

  /* 田字格单元 */
  .tian-cell {
    position: relative;
    border: 1px solid #e74c3c;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: #fff;
  }
  .tian-cell::before {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    left: 50%;
    border-left: 1px dashed #e74c3c;
    opacity: 0.5;
    pointer-events: none;
  }
  .tian-cell::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    top: 50%;
    border-top: 1px dashed #e74c3c;
    opacity: 0.5;
    pointer-events: none;
  }
  .tian-cell .char-text {
    position: relative;
    z-index: 2;
    line-height: 1;
    user-select: none;
  }
  .tian-cell.model .char-text { color: #000; font-weight: bold; }
  .tian-cell.trace .char-text { color: #d0d0d0; }
  .tian-cell.blank { background: #fff; }

  /* 组词标签 */
  .word-tag {
    position: absolute;
    top: 1px;
    left: 2px;
    font-size: 7px;
    color: #e74c3c;
    z-index: 3;
    background: #fff;
    padding: 0 2px;
    max-width: 35mm;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.2;
  }

  /* ========== 打印样式 ========== */
  @media print {
    body { background: #fff; }
    .control-panel { display: none !important; }
    .worksheet {
      box-shadow: none;
      margin: 0;
      padding: 6mm 8mm;
      max-width: none;
      width: 100%;
    }
    .char-block {
      page-break-inside: avoid;
      margin-bottom: 10px;
    }
    @page {
      size: A4;
      margin: 6mm 8mm;
    }
  }
</style>
</head>
<body>

<!-- ========== 控制面板 ========== -->
<div class="control-panel">
  <h1>儿童练字帖生成器</h1>

  <div class="ctrl-group">
    <label>练习汉字</label>
    <textarea id="inputChars" placeholder="请输入要练习的汉字">金木水火土人口手</textarea>
  </div>

  <div class="ctrl-group">
    <label>字体</label>
    <select id="fontSelect">
      <option value="KaiTi, STKaiti, 楷体, serif" selected>楷体</option>
      <option value="SimSun, 宋体, serif">宋体</option>
      <option value="SimHei, 黑体, sans-serif">黑体</option>
      <option value="FangSong, 仿宋, serif">仿宋</option>
      <option value="LiSu, 隶书, serif">隶书</option>
      <option value="YouYuan, 幼圆, sans-serif">幼圆</option>
    </select>
  </div>

  <div class="ctrl-group">
    <label>字号(pt，可手动输入)</label>
    <div style="display:flex;gap:4px;align-items:center;">
      <input type="number" id="sizeInput" value="18" min="8" max="60" style="width:70px;padding:5px 8px;border:1px solid #ccc;border-radius:4px;font-size:13px;">
      <select id="sizeQuick" onchange="document.getElementById('sizeInput').value=this.value" style="padding:5px 6px;border:1px solid #ccc;border-radius:4px;font-size:12px;">
        <option value="">快捷</option>
        <option value="42">初号42</option>
        <option value="36">小初36</option>
        <option value="26">一号26</option>
        <option value="22">二号22</option>
        <option value="18">小二18</option>
        <option value="16">三号16</option>
        <option value="14">四号14</option>
        <option value="12">小四12</option>
      </select>
    </div>
  </div>

  <div class="ctrl-group">
    <label>单字描红数</label>
    <input type="number" id="traceInput" value="3" min="0" max="10">
  </div>

  <div class="checkbox-group">
    <input type="checkbox" id="showStroke" checked>
    <label for="showStroke">显示笔顺</label>
  </div>

  <div class="checkbox-group">
    <input type="checkbox" id="showPinyin" checked>
    <label for="showPinyin">显示拼音</label>
  </div>

  <div class="checkbox-group">
    <input type="checkbox" id="showWords" checked>
    <label for="showWords">显示组词</label>
  </div>

  <button class="btn btn-primary" onclick="generateWorksheet()">生成练字帖</button>
  <button class="btn btn-secondary" onclick="window.print()">打印 / 导出PDF</button>
  <button class="btn" style="background:#27ae60;color:#fff" onclick="fetchOnlineWords()">搜狗获取组词</button>

  <!-- 手动添加组词 -->
  <div class="ctrl-group" style="flex-direction:row;align-items:flex-end;gap:6px;">
    <div style="display:flex;flex-direction:column;gap:3px;">
      <label>手动补组词（字:词1,词2）</label>
      <input type="text" id="manualWordInput" placeholder="如：睿:睿智,睿哲" style="width:200px;padding:5px 8px;border:1px solid #ccc;border-radius:4px;font-size:13px;">
    </div>
    <button class="btn" style="background:#f39c12;color:#fff;padding:5px 12px;" onclick="addManualWord()">添加</button>
  </div>

  <div id="proxyStatus" style="width:100%;font-size:11px;margin-top:4px;"></div>
  <div id="wordStatus" style="width:100%;font-size:11px;color:#999;margin-top:2px;"></div>
</div>

<!-- ========== 练字帖 ========== -->
<div class="worksheet" id="worksheet">
  <div class="worksheet-title">汉 字 练 字 帖</div>
  <div class="worksheet-info">上方为笔顺演示 · 灰色字为描红练习 · 每字含组词练习</div>
  <div class="name-line">
    <span>姓名：__________</span>
    <span>日期：__________</span>
    <span>用时：__________</span>
  </div>
  <div id="charContainer"></div>
</div>

function getWords(ch) {
  if (wordCache[ch] && wordCache[ch].length >= 2) return wordCache[ch];
  if (SOGOU_WORDS[ch] && SOGOU_WORDS[ch].length >= 2) return SOGOU_WORDS[ch];
  return wordsMap[ch] || [];
}

// 获取组词来源标记
function getWordSource(ch) {
  if (wordCache[ch] && wordCache[ch].length >= 2) {
    return wordCache[ch]._source || '缓存';
  }
  if (SOGOU_WORDS[ch] && SOGOU_WORDS[ch].length >= 2) return '搜狗';
  if (wordsMap[ch]) return '内置';
  return '无';
}

// 手动添加组词：格式 "字:词1,词2"
function addManualWord() {
  const input = document.getElementById('manualWordInput');
  const val = input.value.trim();
  if (!val) { alert('请输入，格式如：睿:睿智,睿哲'); return; }
  const parts = val.split(':');
  if (parts.length < 2) { alert('格式错误，请用 字:词1,词2 格式'); return; }
  const ch = parts[0].trim()[0];
  const words = parts[1].split(/[,，]/).map(w => w.trim()).filter(w => w.length >= 2);
  if (!ch || words.length < 1) { alert('请至少输入一个2字词'); return; }
  if (!wordCache[ch]) wordCache[ch] = [];
  for (const w of words) {
    if (!wordCache[ch].includes(w)) wordCache[ch].push(w);
  }
  wordCache[ch]._source = '手动';
  saveWordCache();
  input.value = '';
  updateWordStatus();
  alert(`已为「${ch}」添加组词：${wordCache[ch].join('、')}`);
}

// 搜狗汉语在线获取组词：优先本地代理，回退CORS代理
const LOCAL_PROXY = 'http://127.0.0.1:8899/proxy?url=';
const CORS_PROXIES = [
  url => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url),
  url => 'https://corsproxy.io/?url=' + encodeURIComponent(url),
  url => 'https://cors.eu.org/' + url
];

// 检测本地代理是否可用
let localProxyAvailable = false;
(async function checkLocalProxy() {
  try {
    const resp = await fetch('http://127.0.0.1:8899/health', { signal: AbortSignal.timeout(2000) });
    if (resp.ok) {
      localProxyAvailable = true;
      console.log('本地组词代理已连接');
    }
  } catch(e) {
    console.log('本地代理未启动，将使用在线CORS代理');
  }
  updateProxyStatus();
})();

// 更新本地代理状态显示
function updateProxyStatus() {
  const el = document.getElementById('proxyStatus');
  if (!el) return;
  if (localProxyAvailable) {
    el.innerHTML = '<span style="color:#27ae60">● 本地代理已连接</span>';
  } else {
    el.innerHTML = '<span style="color:#e67e22">○ 本地代理未启动（在线获取可能不稳定）</span>';
  }
}

function parseSogouHtml(html) {
  const m = html.match(/window\.__INITIAL_STATE__\s*=\s*(\{[\s\S]*?\});\s*\(function/);
  if (!m) return null;
  const state = JSON.parse(m[1]);
  const detail = state.detail;
  if (!detail || typeof detail !== 'object') return null;
  const resultData = detail.resultData;
  if (!resultData || typeof resultData !== 'object') return null;
  // 提取拼音
  const pinyinList = resultData.pinyin;
  const pinyin = (pinyinList && pinyinList.length) ? pinyinList[0] : '';
  const zuciData = resultData.zuci;
  if (!zuciData || !zuciData.length) return {pinyin: pinyin, words: []};

  let allWords = [];
  for (const group of zuciData) {
    if (!group || typeof group !== 'object') continue;
    const zuci_list = group.zuci;
    if (!zuci_list || !zuci_list.length) continue;
    for (const w of zuci_list) {
      if (w && typeof w === 'object' && w.text && w.text.length === 2) {
        allWords.push(w);
      } else if (typeof w === 'string' && w.length === 2) {
        allWords.push({text: w, hot: 0, shiyi: ''});
      }
    }
  }
  allWords.sort((a, b) => (b.hot || 0) - (a.hot || 0));
  const seen = new Set();
  const unique = [];
  for (const w of allWords) {
    if (!seen.has(w.text)) {
      seen.add(w.text);
      unique.push(w);
    }
  }
  if (unique.length >= 2) return {pinyin: pinyin, words: unique.slice(0, 4)};
  return {pinyin: pinyin, words: []};
}

async function fetchSogouWords(ch) {
  const targetUrl = 'https://hanyu.sogou.com/result?query=' + encodeURIComponent(ch);

  // 1. 优先使用本地代理
  if (localProxyAvailable) {
    try {
      const resp = await fetch(LOCAL_PROXY + encodeURIComponent(targetUrl), { signal: AbortSignal.timeout(15000) });
      if (resp.ok) {
        const html = await resp.text();
        const result = parseSogouHtml(html);
        if (result && result.words && result.words.length >= 2) return result;
      }
    } catch(e) {
      console.log('本地代理失败:', e.message);
      localProxyAvailable = false;
      updateProxyStatus();
    }
  }

  // 2. 回退到CORS代理
  for (const proxy of CORS_PROXIES) {
    try {
      const resp = await fetch(proxy(targetUrl), { signal: AbortSignal.timeout(15000) });
      if (!resp.ok) continue;
      const html = await resp.text();
      const result = parseSogouHtml(html);
      if (result && result.words && result.words.length >= 2) return result;
    } catch(e) {
      console.log('CORS代理失败:', e.message);
    }
  }
  return null;
}

// 拼音和释义缓存
let pinyinCache = {};
let shiyiCache = {};
try {
  pinyinCache = JSON.parse(localStorage.getItem('lianzi_pinyin_cache') || '{}');
  shiyiCache = JSON.parse(localStorage.getItem('lianzi_shiyi_cache') || '{}');
} catch(e) {}

function savePinyinCache() {
  try { localStorage.setItem('lianzi_pinyin_cache', JSON.stringify(pinyinCache)); } catch(e) {}
}
function saveShiyiCache() {
  try { localStorage.setItem('lianzi_shiyi_cache', JSON.stringify(shiyiCache)); } catch(e) {}
}

async function fetchOnlineWords() {
  const statusEl = document.getElementById('wordStatus');
  const chars = document.getElementById('inputChars').value.replace(/\s/g, '').split('');
  // 需要获取的字：缺组词 或 缺拼音
  const needChars = [...new Set(chars)].filter(ch => {
    const hasWords = wordCache[ch] && wordCache[ch].length >= 2;
    const hasSogouWords = SOGOU_WORDS[ch] && SOGOU_WORDS[ch].length >= 2;
    const hasBuiltinWords = wordsMap[ch] && wordsMap[ch].length >= 2;
    const hasPinyin = pinyinMap[ch] || pinyinCache[ch];
    return (!hasWords && !hasSogouWords && !hasBuiltinWords) || !hasPinyin;
  });

  if (needChars.length === 0) {
    statusEl.innerHTML = '<span style="color:#27ae60">所有字已有拼音和组词数据，无需在线获取。</span>';
    return;
  }

  if (!localProxyAvailable) {
    statusEl.innerHTML = '<span style="color:#e67e22">提示：本地代理未启动，在线获取可能较慢或失败。请先运行 proxy_server.py</span>';
  }

  statusEl.innerHTML = `<span style="color:#f39c12">正在从搜狗汉语获取拼音+组词+释义（${needChars.length}个字），请稍候...</span>`;

  let gotCount = 0;
  const failed = [];

  for (let i = 0; i < needChars.length; i++) {
    const ch = needChars[i];
    statusEl.innerHTML = `<span style="color:#f39c12">正在获取「${ch}」（${i+1}/${needChars.length}）...</span>`;
    const result = await fetchSogouWords(ch);
    if (result && result.words && result.words.length >= 2) {
      // 保存组词
      wordCache[ch] = result.words.map(w => w.text);
      wordCache[ch]._source = '搜狗';
      // 保存拼音
      if (result.pinyin) pinyinCache[ch] = result.pinyin;
      // 保存释义
      for (const w of result.words) {
        if (w.shiyi) shiyiCache[w.text] = w.shiyi;
      }
      gotCount++;
      saveWordCache();
      savePinyinCache();
      saveShiyiCache();
    } else {
      failed.push(ch);
    }
  }

  let msg = `<span style="color:#27ae60">搜狗汉语获取完成！成功 ${gotCount} 个字（含拼音+组词+释义）</span>`;
  if (failed.length > 0) {
    msg += ` <span style="color:#e67e22">未找到：${failed.join('、')}，请手动添加。</span>`;
  }
  statusEl.innerHTML = msg;
  updateWordStatus();
}

// 更新组词状态显示
function updateWordStatus() {
  const chars = document.getElementById('inputChars').value.replace(/\s/g, '').split('');
  const unique = [...new Set(chars)];
  const parts = unique.map(ch => {
    const src = getWordSource(ch);
    const color = (src === '搜狗' || src === '在线') ? '#27ae60' : (src === '手动' ? '#f39c12' : (src === '内置' ? '#3498db' : '#e74c3c'));
    return `<span style="color:${color}">${ch}(${src})</span>`;
  });
  const statusEl = document.getElementById('wordStatus');
  if (!statusEl.innerHTML.includes('正在') && !statusEl.innerHTML.includes('失败') && !statusEl.innerHTML.includes('成功')) {
    statusEl.innerHTML = '组词状态：' + parts.join(' ');
  }
}

function getPinyin(ch) { return pinyinCache[ch] || pinyinMap[ch] || ''; }

// 逐笔渲染笔顺展示
async function renderStrokeShowcase(container, ch, cellSizeMm) {
  if (typeof HanziWriter === 'undefined') return;

  const pixelSize = cellSizeMm * 3.78;

  try {
    // 先创建一个临时实例获取笔画数
    const tempDiv = document.createElement('div');
    tempDiv.style.display = 'none';
    document.body.appendChild(tempDiv);

    let strokeCount = 0;
    const tempWriter = HanziWriter.create(tempDiv, ch, {
      width: 10, height: 10, padding: 0,
      showOutline: false, showCharacter: false,
      onLoadCharDataSuccess: function(data) {
        strokeCount = data.strokes ? data.strokes.length : 0;
      }
    });

    // 等待加载
    await new Promise(r => setTimeout(r, 100));
    document.body.removeChild(tempDiv);

    if (strokeCount === 0) return;

    // 创建逐笔小格
    for (let i = 0; i < strokeCount; i++) {
      const cell = document.createElement('div');
      cell.className = 'stroke-cell';
      cell.style.width = cellSizeMm + 'mm';
      cell.style.height = cellSizeMm + 'mm';
      cell.id = `stroke-sc-${ch}-${i}`;
      container.appendChild(cell);
    }

    // 箭头
    const arrow = document.createElement('span');
    arrow.className = 'stroke-arrow';
    arrow.textContent = '→';
    container.appendChild(arrow);

    // 最后完整字格（最后一笔红色）
    const finalCell = document.createElement('div');
    finalCell.className = 'stroke-cell';
    finalCell.style.width = cellSizeMm + 'mm';
    finalCell.style.height = cellSizeMm + 'mm';
    finalCell.id = `stroke-sc-${ch}-final`;
    container.appendChild(finalCell);

    // 逐格渲染
    for (let i = 0; i < strokeCount; i++) {
      const w = HanziWriter.create(`stroke-sc-${ch}-${i}`, ch, {
        width: pixelSize, height: pixelSize,
        padding: pixelSize * 0.06,
        showOutline: true, showCharacter: false,
        strokeColor: '#1a1a1a',
        outlineColor: '#e8e8e8',
        drawingColor: '#1a1a1a',
        strokeAnimationSpeed: 3,
        delayBetweenStrokes: 0
      });

      // 播放前 i+1 笔
      for (let j = 0; j <= i; j++) {
        await new Promise(resolve => {
          w.animateStroke(j, { onComplete: resolve });
        });
      }
    }

    // 最终完整字，最后一笔红色
    const wf = HanziWriter.create(`stroke-sc-${ch}-final`, ch, {
      width: pixelSize, height: pixelSize,
      padding: pixelSize * 0.06,
      showOutline: true, showCharacter: false,
      strokeColor: '#1a1a1a',
      outlineColor: '#e8e8e8',
      drawingColor: '#1a1a1a',
      highlightColor: '#e74c3c',
      strokeAnimationSpeed: 3,
      delayBetweenStrokes: 0
    });

    for (let j = 0; j < strokeCount; j++) {
      await new Promise(resolve => {
        wf.animateStroke(j, { onComplete: resolve });
      });
    }
    // 最后一笔高亮红色
    wf.highlightStroke(strokeCount - 1);
  } catch(e) {
    console.log('笔顺展示失败:', ch, e);
  }
}

function generateWorksheet() {
  updateWordStatus();
  const chars = document.getElementById('inputChars').value.replace(/\s/g, '').split('');
  const fontFamily = document.getElementById('fontSelect').value;
  const fontSize = parseInt(document.getElementById('sizeInput').value);
  const traceCount = parseInt(document.getElementById('traceInput').value);
  const showStroke = document.getElementById('showStroke').checked;
  const showPinyin = document.getElementById('showPinyin').checked;
  const showWords = document.getElementById('showWords').checked;

  // 田字格大小固定：A4内容宽度÷10格（字号独立调整，不影响格子大小）
  const cellSizeMm = 18.5;

  const container = document.getElementById('charContainer');
  container.innerHTML = '';

  // 去重
  const seen = new Set();
  const uniqueChars = [];
  for (const ch of chars) {
    if (!seen.has(ch) && ch.trim()) {
      seen.add(ch);
      uniqueChars.push(ch);
    }
  }

  uniqueChars.forEach((ch, idx) => {
    const block = document.createElement('div');
    block.className = 'char-block';

    // ===== 标签行：字信息 + 笔顺展示 =====
    const header = document.createElement('div');
    header.className = 'char-header';

    const meta = document.createElement('div');
    meta.className = 'char-meta';
    let metaHtml = `<span class="char-name">「${ch}」</span>`;
    if (showPinyin) {
      const py = getPinyin(ch);
      if (py) metaHtml += `<span class="pinyin">${py}</span>`;
    }
    metaHtml += `<span class="stroke-count" id="sc-${idx}">…画</span>`;
    meta.innerHTML = metaHtml;
    header.appendChild(meta);

    // 笔顺展示区
    if (showStroke) {
      const showcase = document.createElement('div');
      showcase.className = 'stroke-showcase';
      showcase.id = `showcase-${idx}`;
      header.appendChild(showcase);
    }

    block.appendChild(header);

    // ===== 单字练习（描红数最多10个，超过9个自动占2排） =====
    const traceNum = Math.min(10, Math.max(0, traceCount));
    // 第1排：范字(1) + 描红(min(9, traceNum))
    const row1 = document.createElement('div');
    row1.className = 'grid-row';
    const traceRow1 = Math.min(9, traceNum);
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div');
      cell.className = 'tian-cell';
      cell.style.width = cellSizeMm + 'mm';
      cell.style.height = cellSizeMm + 'mm';

      if (c === 0) {
        cell.classList.add('model');
        cell.innerHTML = `<span class="char-text" style="font-family:${fontFamily};font-size:${fontSize}pt">${ch}</span>`;
      } else if (c <= traceRow1) {
        cell.classList.add('trace');
        cell.innerHTML = `<span class="char-text" style="font-family:${fontFamily};font-size:${fontSize}pt">${ch}</span>`;
      } else {
        cell.classList.add('blank');
      }
      row1.appendChild(cell);
    }
    block.appendChild(row1);

    // 第2排（如果描红数>9）：剩余描红 + 空白
    if (traceNum > 9) {
      const row1b = document.createElement('div');
      row1b.className = 'grid-row';
      const traceRow2 = traceNum - 9;
      for (let c = 0; c < COLS; c++) {
        const cell = document.createElement('div');
        cell.className = 'tian-cell';
        cell.style.width = cellSizeMm + 'mm';
        cell.style.height = cellSizeMm + 'mm';
        if (c < traceRow2) {
          cell.classList.add('trace');
          cell.innerHTML = `<span class="char-text" style="font-family:${fontFamily};font-size:${fontSize}pt">${ch}</span>`;
        } else {
          cell.classList.add('blank');
        }
        row1b.appendChild(cell);
      }
      block.appendChild(row1b);
    }

    // ===== 第2、3排：组词练习 =====
    if (showWords) {
      const words = getWords(ch);
      const wordRows = words.slice(0, 2); // 最多2组组词

      wordRows.forEach((word, wi) => {
        const row = document.createElement('div');
        row.className = 'grid-row';

        // 布局：灰色范本(2格深灰) + 空(1) + 描红1(2浅灰) + 空(1) + 描红2(2浅灰) + 空(2) = 10格
        const wordChars = word.split('');
        for (let c = 0; c < COLS; c++) {
          const cell = document.createElement('div');
          cell.className = 'tian-cell';
          cell.style.width = cellSizeMm + 'mm';
          cell.style.height = cellSizeMm + 'mm';

          let displayChar = '';
          let colorClass = ''; // 'model-dark' 深灰范本, 'trace' 浅灰描红

          if (c < 2) {
            // 范本组词（深灰色，作为展示）
            displayChar = wordChars[c] || '';
            colorClass = 'model-dark';
          } else if (c === 2 || c === 5 || c >= 8) {
            // 空格：c=2(范本后), c=5(练习1后), c=8,9(末尾空白)
          } else if (c >= 3 && c <= 4) {
            // 描红练习1
            displayChar = wordChars[c - 3] || '';
            colorClass = 'trace';
          } else if (c >= 6 && c <= 7) {
            // 描红练习2
            displayChar = wordChars[c - 6] || '';
            colorClass = 'trace';
          }

          if (displayChar) {
            if (colorClass === 'model-dark') {
              cell.innerHTML = `<span class="char-text" style="font-family:${fontFamily};font-size:${fontSize}pt;color:#888">${displayChar}</span>`;
            } else {
              cell.classList.add('trace');
              cell.innerHTML = `<span class="char-text" style="font-family:${fontFamily};font-size:${fontSize}pt">${displayChar}</span>`;
            }
          } else {
            cell.classList.add('blank');
          }

          // 第一格标注组词
          if (c === 0) {
            const tag = document.createElement('span');
            tag.className = 'word-tag';
            const shiyi = (shiyiCache && shiyiCache[word]) ? shiyiCache[word] : ((typeof WORD_SHIYI !== 'undefined' && WORD_SHIYI[word]) ? WORD_SHIYI[word] : '');
            tag.textContent = shiyi ? word + '：' + shiyi : word;
            tag.title = shiyi || word;
            cell.appendChild(tag);
          }

          row.appendChild(cell);
        }
        block.appendChild(row);
      });
    }

    container.appendChild(block);

    // 获取笔画数并渲染笔顺
    if (showStroke && typeof HanziWriter !== 'undefined') {
      const scEl = document.getElementById(`sc-${idx}`);
      // 用hanzi-writer获取笔画数
      const probeDiv = document.createElement('div');
      probeDiv.style.display = 'none';
      document.body.appendChild(probeDiv);
      try {
        HanziWriter.create(probeDiv, ch, {
          width: 10, height: 10, padding: 0,
          showOutline: false, showCharacter: false,
          onLoadCharDataSuccess: function(data) {
            const cnt = data.strokes ? data.strokes.length : 0;
            if (scEl) scEl.textContent = cnt + '画';
            document.body.removeChild(probeDiv);

            // 渲染笔顺展示
            const showcase = document.getElementById(`showcase-${idx}`);
            if (showcase && cnt > 0) {
              // 计算笔顺小格大小：A4可用宽度约130mm，单元数=笔画数+箭头+最终格
              const availMm = 128;
              const unitCount = cnt + 2; // 逐笔格 + 箭头占位 + 最终格
              const cellMm = Math.min(13, Math.max(7, (availMm - unitCount * 1.5) / unitCount));
              renderStrokeShowcase(showcase, ch, cellMm);
            }
          }
        });
      } catch(e) {
        if (scEl) scEl.textContent = '';
        document.body.removeChild(probeDiv);
      }
    } else {
      const scEl = document.getElementById(`sc-${idx}`);
      if (scEl) scEl.textContent = '';
    }
  });
}

window.addEventListener('load', function() {
  if (typeof HanziWriter !== 'undefined') {
    generateWorksheet();
  } else {
    setTimeout(generateWorksheet, 800);
  }
});

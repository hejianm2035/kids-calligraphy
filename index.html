<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>汉字练字帖生成器</title>
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", sans-serif;
    background: #f5f5f5;
    color: #333;
  }

  /* ========== 控制面板 ========== */
  .control-panel {
    background: #fff;
    padding: 14px 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: flex-end;
  }
  .control-panel h1 {
    font-size: 17px;
    color: #e74c3c;
    width: 100%;
    margin-bottom: 2px;
  }
  .ctrl-group {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .ctrl-group label {
    font-size: 12px;
    color: #666;
  }
  .ctrl-group textarea {
    width: 260px;
    height: 52px;
    padding: 6px 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 14px;
    resize: vertical;
  }
  .ctrl-group select {
    padding: 5px 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 13px;
    min-width: 90px;
  }
  .ctrl-group input[type="number"] {
    padding: 5px 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 13px;
    width: 70px;
  }
  .btn {
    padding: 7px 18px;
    border: none;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
    font-weight: bold;
  }
  .btn-primary { background: #e74c3c; color: #fff; }
  .btn-primary:hover { background: #c0392b; }
  .btn-secondary { background: #3498db; color: #fff; }
  .btn-secondary:hover { background: #2980b9; }
  .checkbox-group {
    display: flex;
    align-items: center;
    gap: 5px;
    padding-bottom: 7px;
  }
  .checkbox-group input { width: 15px; height: 15px; }
  .checkbox-group label { font-size: 12px; color: #666; }

  /* ========== 练字帖区域 ========== */
  .worksheet {
    max-width: 210mm;
    margin: 16px auto;
    background: #fff;
    padding: 12mm 10mm;
    box-shadow: 0 0 10px rgba(0,0,0,0.05);
  }
  .worksheet-title {
    text-align: center;
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 4px;
    color: #333;
  }
  .worksheet-info {
    text-align: center;
    font-size: 11px;
    color: #999;
    margin-bottom: 12px;
  }
  .name-line {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #666;
    margin-bottom: 12px;
    border-bottom: 1px dashed #ddd;
    padding-bottom: 6px;
  }
  .name-line span { border-bottom: 1px solid #999; padding: 0 24px 0 4px; }

  /* 每个字的区块 */
  .char-block {
    margin-bottom: 14px;
    page-break-inside: avoid;
  }

  /* 标签行：包含字信息 + 笔顺展示 */
  .char-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
    min-height: 16mm;
  }
  .char-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    min-width: 38mm;
  }
  .char-meta .char-name {
    font-size: 14px;
    color: #e74c3c;
    font-weight: bold;
  }
  .char-meta .pinyin {
    font-size: 13px;
    color: #333;
    font-weight: bold;
  }
  .char-meta .stroke-count {
    font-size: 10px;
    color: #fff;
    background: #e74c3c;
    padding: 1px 7px;
    border-radius: 9px;
  }

  /* 笔顺展示区 */
  .stroke-showcase {
    display: flex;
    align-items: center;
    gap: 1px;
    flex: 1;
    min-width: 0;
    overflow: hidden;
  }
  .stroke-cell {
    position: relative;
    border: 0.8px solid #e74c3c;
    flex-shrink: 0;
    background: #fff;
  }
  .stroke-cell::before {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    left: 50%;
    border-left: 0.5px dashed #e74c3c;
    opacity: 0.4;
    pointer-events: none;
  }
  .stroke-cell::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    top: 50%;
    border-top: 0.5px dashed #e74c3c;
    opacity: 0.4;
    pointer-events: none;
  }
  .stroke-cell svg {
    display: block;
  }
  .stroke-arrow {
    color: #e74c3c;
    font-size: 14px;
    flex-shrink: 0;
    margin: 0 2px;
  }

  /* 田字格行 */
  .grid-row {
    display: flex;
    gap: 0;
  }
  .grid-row + .grid-row {
    margin-top: -1px; /* 重叠边框 */
  }

  /* 田字格单元 */
  .tian-cell {
    position: relative;
    border: 1px solid #e74c3c;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: #fff;
  }
  .tian-cell::before {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    left: 50%;
    border-left: 1px dashed #e74c3c;
    opacity: 0.5;
    pointer-events: none;
  }
  .tian-cell::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    top: 50%;
    border-top: 1px dashed #e74c3c;
    opacity: 0.5;
    pointer-events: none;
  }
  .tian-cell .char-text {
    position: relative;
    z-index: 2;
    line-height: 1;
    user-select: none;
  }
  .tian-cell.model .char-text { color: #000; font-weight: bold; }
  .tian-cell.trace .char-text { color: #d0d0d0; }
  .tian-cell.blank { background: #fff; }

  /* 组词标签 */
  .word-tag {
    position: absolute;
    top: 1px;
    left: 2px;
    font-size: 7px;
    color: #e74c3c;
    z-index: 3;
    background: #fff;
    padding: 0 2px;
    max-width: 35mm;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.2;
  }

  /* ========== 打印样式 ========== */
  @media print {
    body { background: #fff; }
    .control-panel { display: none !important; }
    .worksheet {
      box-shadow: none;
      margin: 0;
      padding: 6mm 8mm;
      max-width: none;
      width: 100%;
    }
    .char-block {
      page-break-inside: avoid;
      margin-bottom: 10px;
    }
    @page {
      size: A4;
      margin: 6mm 8mm;
    }
    .sheet-footer {
      position: fixed;
      right: 8mm;
      bottom: 4mm;
      font-size: 10pt;
      color: #e74c3c;
      font-weight: bold;
    }
  }
  .sheet-footer {
    position: absolute;
    right: 10px;
    bottom: 10px;
    font-size: 12px;
    color: #e74c3c;
    font-weight: bold;
  }
  .worksheet {
    position: relative;
  }
</style>
</head>
<body>

<!-- ========== 控制面板 ========== -->
<div class="control-panel">
  <h1>汉字练字帖生成器</h1>

  <div class="ctrl-group">
    <label>练习汉字</label>
    <textarea id="inputChars" placeholder="请输入要练习的字，建议3个汉字为一张A4打印">金木水火土人口手</textarea>
  </div>

  <div class="ctrl-group">
    <label>字体</label>
    <select id="fontSelect">
      <option value="KaiTi, STKaiti, 楷体, serif" selected>楷体</option>
      <option value="SimSun, 宋体, serif">宋体</option>
      <option value="SimHei, 黑体, sans-serif">黑体</option>
      <option value="FangSong, 仿宋, serif">仿宋</option>
      <option value="LiSu, 隶书, serif">隶书</option>
      <option value="YouYuan, 幼圆, sans-serif">幼圆</option>
    </select>
  </div>

  <div class="ctrl-group">
    <label>字号(pt，可手动输入)</label>
    <div style="display:flex;gap:4px;align-items:center;">
      <input type="number" id="sizeInput" value="28" min="8" max="60" style="width:70px;padding:5px 8px;border:1px solid #ccc;border-radius:4px;font-size:13px;">
      <select id="sizeQuick" onchange="document.getElementById('sizeInput').value=this.value" style="padding:5px 6px;border:1px solid #ccc;border-radius:4px;font-size:12px;">
        <option value="">快捷</option>
        <option value="42">初号42</option>
        <option value="36">小初36</option>
        <option value="26">一号26</option>
        <option value="22">二号22</option>
        <option value="18">小二18</option>
        <option value="16">三号16</option>
        <option value="14">四号14</option>
        <option value="12">小四12</option>
      </select>
    </div>
  </div>

  <div class="ctrl-group">
    <label>单字描红数</label>
    <input type="number" id="traceInput" value="3" min="0" max="10">
  </div>

  <div class="checkbox-group">
    <input type="checkbox" id="showStroke" checked>
    <label for="showStroke">显示笔顺</label>
  </div>

  <div class="checkbox-group">
    <input type="checkbox" id="showPinyin" checked>
    <label for="showPinyin">显示拼音</label>
  </div>

  <div class="checkbox-group">
    <input type="checkbox" id="showWords" checked>
    <label for="showWords">显示组词</label>
  </div>

  <button class="btn btn-primary" onclick="generateWorksheet()">生成练字帖</button>
  <button class="btn btn-secondary" onclick="window.print()">打印 / 导出PDF</button>
  <button class="btn" style="background:#27ae60;color:#fff" onclick="fetchOnlineWords()">搜狗获取组词</button>

  <!-- 手动添加组词 -->
  <div class="ctrl-group" style="flex-direction:row;align-items:flex-end;gap:6px;">
    <div style="display:flex;flex-direction:column;gap:3px;">
      <label>手动补组词（字:词1,词2）</label>
      <input type="text" id="manualWordInput" placeholder="如：睿:睿智,睿哲" style="width:200px;padding:5px 8px;border:1px solid #ccc;border-radius:4px;font-size:13px;">
    </div>
    <button class="btn" style="background:#f39c12;color:#fff;padding:5px 12px;" onclick="addManualWord()">添加</button>
  </div>

  <div id="proxyStatus" style="width:100%;font-size:11px;margin-top:4px;"></div>
  <div id="wordStatus" style="width:100%;font-size:11px;color:#999;margin-top:2px;"></div>
</div>

<!-- ========== 练字帖 ========== -->
<div class="worksheet" id="worksheet">
  <div class="worksheet-title">汉 字 练 字 帖</div>
  <div class="worksheet-info">上方为笔顺演示 · 灰色字为描红练习 · 每字含组词练习</div>
  <div class="name-line">
    <span>姓名：__________</span>
    <span>日期：__________</span>
    <span>用时：__________</span>
  </div>
  <div id="charContainer"></div>
  <div class="sheet-footer">苗圃幼儿园提供</div>
</div>

const WORD_SHIYI = {"一个":["1.表数量。单个。用于人和各种事物。如：一个人；一个书柜；一个学校；一个理想；一个星期；一个地方。"],"一些":["1.表示不定的数量：这些活儿你做不完，分～给我。\n2.（～儿）表示数量少：只有这～儿了，怕不够吧?\n3.表示不止一种或一次：他曾担任过～重要的职务。\n4.放在形容词、动词或动词性词组后，表示略微的意思：好～。当心～。想开～。"],"一会儿":["1.数量词。指很短的时间：～的工夫。咱们歇～。\n2.数量词。指在很短的时间之内：～厂里还要开会。你妈妈～就回来了。～地上就积起了三四寸厚的雪。\n3.分别用在两个反义词的前面，表示两种情况交替：天气～晴～阴。他～出，～进，忙个不停。"],"一刀两断":["比喻坚决断绝关系。"],"一刀切":["比喻对复杂的事物不作具体分析，而是用一个标准（一个方法、一个政策等）来对待：对什么事情都不能～。"],"一同":["（副）表示同时间同地点做某事：～上大学～去北京。"],"一向":["1.过去的某一段时期：前～雨水多（指较早的一段时期）。这～工程的进度很快（指最近的一段时期）。\n2.a）表示从过去到现在：～俭朴。～好客。b）表示从上次见面到现在：你～好哇!"],"一字不落":["整篇文章都仔细逐字逐句地阅读。"],"一定":["1.属性词。规定的；确定的：要按～的程序进行操作。\n2.属性词。固定不变；必然：文章的深浅跟篇幅的长短，并没有～的关系。\n3.表示坚决或确定；必定：～要努力工作。这半天还不回来，～是没赶上车。\n4.属性词。特定的：～的文化是～社会的政治和经济的反映。\n5.属性词。相当的：我们的工作已经取得了～的成绩。这篇论文具有～水平。"],"一己":["自身；个人：～之私。"],"一度":["1.数量词。一次；一阵：一年～的春节又到了。经过～紧张的战斗，洪水终于被战胜了。\n2.表示过去发生过；有过一次：他～休学。"],"一心一意":["心思、意念专一。"],"一条":["1.谓相连相通。\n2.表数量。用于分列的项目或计量条状的东西。\n3.犹一股。"],"一步":["1.行走时两脚间的距离。\n2.谓步伐一致。\n3.指某一地步、境地或事务的某一段。\n4.长度名。历代不一，如周以八尺为一步，秦以六尺为一步，后亦以五尺为一步。\n5.中医运气学说以六十日又八十七刻半为“一步”。"],"一片":["1.数量词。用于平而薄的东西。汉 荀悦《汉纪·武帝纪五》：“﹝ 李陵 ﹞令军士人持三升糒、一片冰。”《后汉书·周燮等传序》：“﹝ 閔仲叔 ﹞老病家贫，不能得肉，日买猪肝一片。”元 张养浩《游香山》诗：“宝刹千间穷土木，残碑一片失 辽 金。”\n2.数量词。用于地面、水面。宋 王安石《出郊》诗：“川原一片緑交加，深树冥冥不见花。”《荡寇志》第八六回：“只见 永清 的后面一层人霍地分开，前面乃是一片白地。”毛泽东《浪淘沙·北戴河》词：“秦皇岛 外打鱼船。一片汪洋都不见，知向谁边？”杨朔《中国人民的心》：“岭脚下有一片大水塘，叫 龙潭池。”\n3.数量词。用于呈片状或连接成片的景物。北周 庾信《至仁山铭》：“瑞雪一片，仙童两人。”唐 王之涣《凉州词》之一：“黄河 远上白云间，一片孤城万仞山。”宋 陆游《春日游镜湖乡人请赋山阴风物遂作四绝句》之二：“东风忽送笙歌近，一片楼臺泛水来。”\n4.数量词。用于弥漫散布的景色、气象。北周 庾信《游山》诗：“涧底百重花，山根一片雨。”唐 李白《子夜吴歌》之三：“长安 一片月，万户擣衣声。”宋 方岳《山居》诗：“我爱山居好，林梢一片晴。”周而复《上海的早晨》第一部三：“远方的天边有一片红光在昏暗的夜色中跳动，那是 南京路 一带霓虹灯光的照耀。”\n5.数量词。用于集聚在一起的声音。宋 朱淑贞《元夜》诗之一：“一片笑声连鼓吹，六街灯火丽昇平。”《水浒传》第三三回：“花荣 一片声叫道：‘我得何罪？’”《儿女英雄传》第三一回：“慌慌张张爬到墙上，踹的那瓦一片山响。”刘宾雁《在桥梁工地上》：“水下，破碎机加快了凿岩速度，响声连成一片。”\n6.数量词。用于人的心情、心地、心意。宋 潘希白《大有·九日》词：“一片 宋玉 情怀，十分 卫郎 清瘦。”元 马致远《岳阳楼》第一折：“则你那浮生空自忙。他一片黑心肠，在这功名之上。”《西游记》第八五回：“但要一片志诚，雷音 只在眼下。”顾笑言《你现在想什么》十三：“老伴还真没有辜负了 乌长青 的一片心愿。”\n7.数量词。用于文字、语言。明 王守仁《传习录》卷下：“然亦多是推衍文义，自做一片文字。”《儿女英雄传》第十九回：“十三妹 听了 邓九公 要拉那先生幚着劝解，又不知惹出他那一片什么谈吐来。”马烽 西戎《吕梁英雄传》第二回：“桦林霸 随手研墨蘸笔，铺开一张大纸，写了一片字交给 康顺风。”\n8.整片；整体。《陆象山语录》卷上：“又下工夫十年，方浑然一片。”明 王守仁《传习录》卷下：“静坐用功，颇觉此心收敛，遇事又断了，旋起箇念头去事上省察，事过又寻旧功，还觉有内外，打不作一片。”毛泽东《坚持艰苦奋斗，密切联系群众》：“在战时，要密切联系群众，要官兵打成一片，军民打成一片。”"],"一直":["1.表示顺着一个方向不变：～走，不拐弯。～往东，就到了。\n2.表示动作始终不间断或状态始终不变：雨～下了一天一夜。他干活儿～很卖力。\n3.强调所指的范围：全村从老人～到小孩都非常热情。"],"一边":["1.指东西的一面，事情的一方面。\n2.同样；一般。\n3.一个动作与另一个动作同时进行。"],"一连":["表示动作连续不断或情况连续发生：～下了三天雨。今天～参加了好几个会。"],"七上八下":["也说七上八落。形容心神不定。"],"万一":["1.万分之一，表示极小的一部分：笔墨不能形容其～。\n2.指可能性极小的意外变化：多带几件衣服，以防～。\n3.表示可能性极小的假设（用于不如意的事）：～下雨也不要紧，我带着伞呢。"],"万全":["非常周到，没有任何漏洞；非常安全：～之策。计出～。"],"万里无云":["湛湛蓝天，没有一丝云彩。形容天气晴朗。"],"丈夫":["成年男子。"],"三更":["第三更，约在半夜十二时左右。"],"三言两语":["指很少的几句话：这个问题很复杂，不是～说得清楚的。"],"上交":["1.交给上级单位。\n2.地位低的人同地位高的人交往。"],"上山":["1.到山上去；到山区去：～砍柴。～下乡。\n2.婉辞，指人死亡，埋入坟地。\n3.指蚕上蔟：再过一两天，蚕就要～了。"],"上演":["（戏剧、舞蹈等）演出：这个月～了三台新戏。"],"上火":["1.中医把大便干燥或鼻腔黏膜、口腔黏膜、结膜等发炎的症状叫上火：他～了，眼睛红红的。\n2.发怒。"],"上衣":["上身穿的衣服。"],"上面":["1.位置较高的地方。2.次序靠前的部分。3.指上级。4.指物体的上部或表面。5.方面。6.指家族中上一辈先于自己出生的同辈。"],"下吧":["同“下巴”。元 马致远《岳阳楼》第二折：“好大口也，弔了下吧。”"],"下次":["紧接着本次后的一次。"],"不久":["指距离某个时期或某件事情时间不远：水库～就能完工。我们插完秧～，就下了一场雨。"],"不会":["1.不领会；不知道。唐 元稹《进田弘正碑文状》：“臣若苟务文章，广徵经典，非唯将吏不会，亦恐 弘正 未详。”宋 周邦彦《南乡子》词：“不会沉吟思底事，凝眸，两点春山满镜愁。”\n2.不可能。明 康湋川《粉蝶儿·寄寿康对山太史》套曲：“也不索门栽五柳，也不索湖泛扁舟，利和名自不会挂心头。”毛泽东《青年团的工作要照顾青年的特点》：“这样做，基本方向是不会错的。”\n3.谓不以时朝见天子。太平天囯 洪仁玕《资政新篇》：“或如 唐太宗 之责 尉迟恭 以 汉高 故事，或如 汉文 之责 吴 不会而赐杖以愧之，亦保全之一道也。”"],"不但":["用在表示递进的复句的上半句里，下半句里通常有连词“而且、并且”或副词“也、还”等相呼应：～以身作则，而且乐于助人。这条生产线～在国内，即使在国际上也是一流的。这样做～解决不了问题，还会增加新的困难。"],"不可名状":["无法用语言来形容。名：说出。状：描述。"],"不同":["1.不相同；不一样。南朝 梁 刘勰《文心雕龙·定势》：“所习不同，所务各异，言势殊也。”前蜀 韦庄《关河道中作》诗：“往来千里路长在，聚散十年人不同。”毛泽东《在省市自治区党委书记会议上的讲话》二：“他们想问题做事情的方法，他们的历史习惯，跟我们不同。”\n2.不同意。《宋书·张邵传》：“太尉长史 何勗 不同，欲席捲奔 鬱洲，自海道还都。”《南齐书·鄱阳王锵传》：“殿下但乘油壁车入宫，出天子置朝堂，二王夹辅号令，粲 等闭城门上仗，谁敢不同？”\n3.不和。《后汉书·孔融传》：“﹝ 融 ﹞与中丞 赵舍 不同，託病归家。”"],"不在":["1.指不在家或不在某处：您找我哥哥呀，他～。他～办公室，可能是联系工作去了。\n2.婉辞，指死亡（常带“了”）：我奶奶去年就～了。"],"不如":["表示前面提到的人或事物比不上后面所说的：走路～骑车快。论手巧，大家都～他。"],"不安":["1.不安定；不安宁：忐忑～。坐立～。动荡～。\n2.客套话，表示歉意和感激：总给您添麻烦，真是～。"],"不对":["1.不正确；错误：数目～。他没有什么～的地方。"],"不已":["继续不停：鸡鸣～。赞叹～。"],"不期而遇":["没有约定而意外地相遇。"],"不用":["表示事实上没有必要：～介绍了，我们认识。大家都是自己人，～客气。"],"不相上下":["分不出高低，形容数量、程度差不多：本领～。年岁～。"],"不紧不慢":["形容心情平静，行动从容。"],"不约而同":["事先没有约定，彼此的言论或行动却完全一致。"],"不要":["表示禁止和劝阻：～大声喧哗。～麻痹大意。"],"不该":["不应当，不应该。"],"与人为善":["跟别人一同做好事。《孟子·公孙丑上》：“取诸人以为善，是与人为善者也，故君子莫大乎与人为善。” 后指善意地帮助别人：批评同志要采取～的态度。"],"与其":["连词。比较两方面的利害得失，选取一方面，舍弃另一方面。“与其”表示舍弃的一面，肯定的一面前常用“不如”“宁可”“毋宁”等词呼应：在做某一项工作时，～看得容易些，不如看得困难些。"],"且住":["暂止。"],"世人":["世界上的人；一般的人。"],"世界":["1.佛教指宇宙。2.地球上所有地方。3.自然界和人类社会的一切事物的总和。4.某个活动范围或领域。"],"世纪":["计年单位。一百年为一个世纪。如从公元1—100年为一世纪；1901—2000年为二十世纪。"],"东方":["1.太阳升起的那个大方向；面朝北时的右方。\n2.指亚洲（习惯上也包括埃及）\n3.具有东方特点的事物（如民族、文艺或风俗）\n4.--复姓如：东方朔（西汉人，知识丰富，生性恢谐。长于文辞，有不少关于他的传说）"],"丢三落四":["形容马虎或记忆力不好而好（hào）忘事。"],"两个":["两个钱的省称。指一些钱财。康濯《太阳初升的时候·买牛记》：“最近大秋刚罢，组长估摸着今年虽说雨水缺，他组里大家的收成也都够七成，加上副业甚么的，他们四家还都积攒了两个，多少有点底垫了；于是他拿了个主意：想让大伙碰股买头牛。”"],"两头":["两方面。"],"两边":["1.物体的两个边儿：这张纸～长短不齐。\n2.两个方向或地方：这间屋子～有窗户，光线很好。老大娘常常～走动，看望两个外孙女儿。\n3.双方；两方面：～都说好了，明儿下午赛球。"],"个人":["1.一个人（跟“集体”相对）：～利益服从集体利益。集体领导同～负责相结合。\n2.自称，我（在正式场合发表意见时用）：～认为这个办法是非常合理的。"],"个头":["1.指人的身材。刘白羽《一个温暖的雪夜》：“奇特在他年轻，个头挺矮，天那样严寒，他却不戴皮帽。”峻青《吕有库》：“这个青年英雄的名字叫 吕有库，今年二十一岁，个头不高胖敦敦地。”\n2.指动物身体的大小。赵树理《张来兴》：“鱼是整条煎的，都是三四斤重的中等个头。”\n3.指物体的大小。如：赵县 产的雪花梨，个头特别大。"],"个子":["1.指人的身材，也指动物身体的大小：高～。矮～。这只猫～大。\n2.指某些捆在一起的条状农作物：谷～。麦～。高粱～。"],"中医":["1.中国传统的医学。\n2.用中国传统医学的理论和方法治病的医生。"],"中华":["古称黄河流域一带为中华，是汉民族最初兴起的地方。后用以指称中国。"],"中国":["中华人民共和国的简称。1949年10月1日成立。成立后的中国，通常称新中国；成立前的中国，通常称旧中国。中国是世界上历史最悠久的国家之一。"],"中文":["中国的语言文字，特指汉族的语言文字。"],"中间":["1.里面。2.中心。3.事物两头之间或两个事物之间的位置。"],"丰功伟绩":["伟大的功绩。也说丰功伟业。"],"丰收":["收成好（跟“歉收”相对）：～年。粮食～。文艺创作获得～。"],"为了":["表示原因，一般用“因为”不用“为了”。"],"么呢":["文登方言，意为“什么”。如：“做么呢？”即“做什么？”的意思。"],"之前":["多指时间，少指处所。"],"之后":["单独用在句子开头，表示在上文所说的事情以后：～，他们又提出了具体的计划。"],"乌黑":["状态词。深黑色：～的头发。她那一双大眼睛～发亮。"],"乐观":["精神愉快，对事物的发展充满信心（跟“悲观”相对）：～情绪。不要盲目～。"],"也好":["也罢（语气较轻）：不去纠缠～，何必为这点儿小事闹得满城风雨呢?。领导干部～，普通工作人员～，都是人民的勤务员。"],"也罢":["1.表示容忍或只得如此，有“算了”或“也就算了”的意思：这种事情不知道～，知道了反倒难为情。～，你一定要走，我送你上车。\n2.两个或几个连用，表示在任何情况下都是这样：你去～，不去～，反正我是不去。"],"也许":["表示不很肯定：你仔细找一找，～能找到。"],"习以为常":["常做某种事情或常见某种现象，成了习惯，就觉得很平常了。"],"乡亲":["1.同乡的人。\n2.对农村中当地人民的称呼：～们。"],"书写":["写：～标语。～工具。"],"书包":["布或皮革等制成的袋子，主要供学生上学时装书籍、文具用。"],"书香门第":["指上辈有读书人的家庭。"],"买卖":["1.指商店。\n2.东西；家伙；货色。\n3.行者暗笑道：原来是这个买卖!--《西游记》"],"买家":["买主。"],"买菜":["即苦荬菜。又称荬菜、苦菜。"],"了却":["了结：～一桩心事。"],"争取":["1.力求获得：～时间。～主动。～彻底的胜利。\n2.力求实现：～提前完成计划。"],"争夺":["争着夺取：～市场。～阵地。～出线权。"],"争论":["各执己见，互相辩论：～不休。"],"争辩":["争论；辩论：据理～。"],"事业":["1.人所从事的，具有一定目标、规模和系统而对社会发展有影响的经常活动：革命～。科学文化～。～心。\n2.特指没有生产收入，由国家经费开支，不进行经济核算的事业（区别于“企业”）：～费。～单位。"],"事在人为":["指事情是靠人去做的，在一定的客观条件下，成功与否决定于人的主观努力。"],"事情":["1.人类生活中的一切活动和所遇到的一切社会现象：～多，忙不过来。\n2.事故；差错：不能马虎，出了～就麻烦了。\n3.职业；工作：在公司里找了一个～。"],"于今":["1.到现在：故乡一别，～十载。\n2.如今：这城市建设得非常快，～已看不出原来的面貌。"],"于是":["连词。表示后一事接着前一事，有时表示因果关系：经过学习，大家懂得了搞好绿化工作的重要性，～掀起了植树造林新高潮。"],"云者":["语气词连用。用在句中表停顿。"],"亚军":["体育运动等比赛中获第二名的优胜者。"],"亚太":["全称为亚洲及太平洋地区，又称亚太地区、亚太区。亚太是太平洋地区周边国家（包括岛屿）的总称，属于地缘政治和地缘经济术语。"],"亚洲":["全称亚细亚洲。位于东半球的东北部，西北以乌拉尔山脉、乌拉尔河、里海、大高加索山脉、土耳其海峡与欧洲分界，西南隔苏伊士运河、红海与非洲相望，东南有一系列与大洋洲接近的群岛环绕，东北隔白令海峡与北美洲相望。东临太平洋，南临印度洋，北临北冰洋。面积约4 400万平方千米，人口36.34亿（1999年）。有世界最高的山峰和最低的洼地。地跨寒、温、热三带。是世界面积最大、人口最多、地形和气候最复杂的一洲。"],"亚热带":["热带和温带之间的过渡地带。与热带相比，有显著的季节变化，气温比温带高，植物在冬季仍能缓慢生长。也叫副热带。"],"亚麻":["1.一年生草本植物，茎细长，叶子互生，披针形或条形，花浅蓝色，结蒴果，球形。纤维用亚麻的茎皮含纤维很多，可以做纺织原料。\n2.纤维用亚麻的茎皮纤维。"],"些许":["一点儿；少许：～小事。"],"交友":["结交朋友：～要慎重。"],"交头接耳":["彼此在耳朵边低声说话。"],"交界":["两地相连，有共同的疆界：云南省南部跟越南、老挝和缅甸～。"],"交给":["给与；付给。"],"产品":["生产出来的物品：农～。畜～。～出厂前都要经过检验。"],"产生":["由已有事物中生出新的事物；出现：同事之间关系处理不好就会～矛盾。在中华民族悠久的历史中，～了许许多多可歌可泣的英雄人物。"],"亲人":["1.直系亲属或配偶：他家里除母亲以外，没有别的～。\n2.比喻关系亲密、感情深厚的人。"],"亲如手足":["像兄弟一样的亲密。多形容朋友的情谊深厚。"],"亲朋":["亲戚朋友：～好友。"],"亲近":["1.（双方）亲密；关系密切：这两个小同学很～。\n2.（一方对另一方）亲密地接近：他热情诚恳，大家都愿意～他。"],"人们":["指许多人：天冷了，～都穿上了冬装。"],"人家":["1.指自己或某人以外的人；别人：～人家都不怕，就你怕|～是人，我也是人，我就学不会？2.指某个人或某些人，意思跟“他”或“他们”相近：你把东西快给～送回去吧。3.指“我”：原来是你呀，差点儿没把～吓死！"],"人心不古":["古：指古代的社会风尚。旧时指人心奸诈、刻薄，没有古人淳厚。"],"人才":["1.也作人材。\n2.有品德有才能的人；有某种特长的人：～辈出。\n3.指容貌：一表～。他～出众。"],"人称":["某些语言中动词跟名词或代词相应的语法范畴。代词所指的是说话的人叫第一人称，如“我、我们”；所指的是听话的人叫第二人称，如“你、你们”；所指的是其他的人或事物叫第三人称，如“他、她、它、他们”。名词一般是第三人称。有人称范畴的语言，动词的形式跟着主语的人称变化，有的语言还跟着宾语的人称变化。"],"人类":["人的总称：～社会。造福～。"],"人选":["为一定目的挑选出来的人：适当～。决定秘书长的～。"],"什么":["1.表示疑问。a）单用，问事物：这是～?|你找～?|他说～?|～叫押韵?b）用在名词前面，问人或事物：～人?|～事儿?|～颜色?|～地方?\n2.虚指，表示不确定的事物：他们仿佛在谈论～。我饿了，想吃点儿～。\n3.任指。a）用在“也”或“都”前面，表示所说的范围之内没有例外：他～也不怕。只要认真学，～都能学会。b）两个“什么”前后照应，表示由前者决定后者：想～说～。你～时候去，我也～时候去。\n4.表示惊讶或不满：～!九点了，车还没有开!|这是～鞋!一只大一只小的!\n5.表示责难：你笑～?（不应该笑）|你说呀!装～哑巴?（不必装哑巴）\n6.表示不同意对方说的话：～晒一天?晒三天也晒不干。\n7.用在几个并列成分前面，表示列举不尽：～送个信儿啊，跑个腿儿啊，他都干得了。"],"什物":["指家庭日常应用的衣物及其他零碎用品。"],"什锦":["1.属性词。多种原料制成或多种花样的：～饼干。～糖。～锉。\n2.多种原料制成或多种花样拼成的食品：素～。"],"今后":["时间词。从今以后：～更要加倍努力。"],"今天":["1.说话时的这一天：～的事不要放到明天做。\n2.现在；目前：～的中国已经不是过去的中国了。"],"从军":["参加军队。"],"从来":["从过去到现在（多用于否定式）：他～不失信。这种事我～没听说过。"],"从此":["从这个时候起：这条铁路全线通车，～交通就更方便了。"],"从而":["连词。上文指明原因、条件、方法等，下文用“从而”引出结果、目的等：由于广泛采用了新技术，～大大提高了劳动生产率。"],"代替":["以甲换乙，起乙的作用：用国产品～进口货。他不能去，你～他去一趟吧!"],"令人神往":["令：使，让；神往：心神向往。使人非常向往。"],"令爱":["敬辞，称对方的女儿。也作令嫒。"],"以上":["1.表示位置、次序或数目等在某一点之上：半山～石级更陡。县级～干部。\n2.指前面的（话）：～所说的是总的原则，下面讲具体做法。"],"以后":["方位词。现在或所说某时之后的时期：从今～。五年～。毕业～。～我们还要进一步研究这个问题。"],"以少胜多":["用少量兵力战胜强大的敌人。"],"以身作则":["用自己的行动做出榜样。"],"任何":["指示代词。不论什么：～人都要遵纪守法。我们能够战胜～困难。"],"任劳任怨":["做事能够经受劳苦和别人的抱怨。"],"任性":["放任自己的性子，不加约束：～胡闹。他有时不免孩子气，有点儿～。"],"任意":["1.没有拘束，不加限制，爱怎么样就怎么样：～行动。～畅谈。\n2.属性词。没有任何条件的：～三角形。"],"伊人":["彼人；（意中所指的）那个人。"],"伊始":["起头；开始：下车～。"],"伊川":["1.古地名。指 伊水 所流经的 伊河 流域。《左传·僖公二十二年》：“辛有 适 伊川，见被髮而祭於野者。”杜预 注：“伊川，周 地。伊，水也。”杨伯峻 注：“伊川，伊河 所经之地，当今 河南省 嵩县 及 伊川县 境。”参见“伊水”。\n2.宋 程颐 的别号。参见“伊川先生”。"],"伊蚊":["蚊子的一种，成虫身体黑色或棕色，脚上有白色环纹，翅膀上没有斑点，停止时身体和停留的平面平行。幼虫和蛹生长在树穴或缸盆等的积水中，卵分散沉在水底。是传播流行性乙型脑炎等疾病的媒介。也叫黑斑纹。"],"会场":["开会的场所。"],"伟大":["品格崇高；才识卓越；气象雄伟；规模宏大；超出寻常，令人景仰钦佩的：～的领袖。～的祖国。～的事业。～的成就。"],"传统":["1.世代相传、具有特点的社会因素，如文化、道德、思想、制度等：发扬艰苦朴素的优良～。\n2.属性词。世代相传或相沿已久并具有特点的：～剧目。\n3.守旧；保守：老人的思想比较～。"],"传说":["1.辗转述说。\n2.流传的说法。\n3.民间流传下来的对某些事迹的叙述和评价。有的以特定历史事件为基础，有的则是虚构的。"],"传递":["由一方交给另一方；辗转递送：～消息。～信件。～火炬。"],"伤口":["皮肤、肌肉、黏膜等受伤破裂的地方。"],"伤心":["由于遭受不幸或不如意的事而心里痛苦：～事。～落泪。"],"伤痛":["1.伤心痛苦：心中万分～。\n2.身体受伤的痛苦：他忍着浑身的～站了起来。"],"伴随":["随同；跟随：～左右，不离寸步。～着生产的大发展，必将出现一个文化高潮。"],"似乎":["仿佛；好像：他～了解了这个字的意思，但是又讲不出来。"],"伽他":["见“伽陀”。"],"但愿":["只希望；只愿但愿我重新变得年轻。"],"但是":["用在后半句话里表示转折，往往与“虽然、尽管”等呼应：他想睡一会儿，～睡不着。他虽然已经七十多了，～人仍然很健旺。"],"位置":["1.所在的具体地点。2.地位。3.职位。"],"住处":["zhù chù的又音。义同“住处zhù chù”。"],"住所":["公民生活和进行民事活动的主要场所。公民以其户籍所在地的居住场所为住所，经常居住地与住所不一致的，经常居住地视为住所。法人以其主要办事机构所在地为住所。"],"住手":["停止手的动作；停止做某件事：快～，这东西禁不起摆弄。他不做完不肯～。"],"体操":["体育运动项目之一。指徒手或利用器械做的有特定要求的身体操练。分竞技性体操和非竞技性体操（如基本体操、团体操等）两类。内容丰富，形式多样，动作优美而富于艺术性。"],"作业":["1.教师给学生布置的功课；部队给士兵布置的训练性的军事活动；生产单位给工人或工作人员布置的生产活动：课外～。～计划。\n2.从事这种军事活动或生产活动：带电～。队伍开到野外去～。"],"作为":["1.所作所为；行为：评论一个人，不但要根据他的谈吐，而且更需要根据他的～。\n2.做出成绩：有所～。\n3.可以做的事：大有～。\n4.当做：～罢论。～无效。我把游泳～锻炼身体的方法。\n5.就人的某种身份或事物的某种性质来说：～一个学生，首先得把学习搞好。～一部词典，必须有明确的编写宗旨。"],"作文":["1.写文章（多指学生练习写作）：～比赛。赋诗～。\n2.学生作为练习所写的文章：写～。他的～被评为优秀。"],"作用":["1.对事物产生影响：外界的事物～于我们的感觉器官 ，在我们的头脑中形成形象。\n2.对事物产生某种影响的活动：同化～。消化～。光合～。\n3.对事物产生的影响；效果；效用：副～。起～。积极～。"],"你们":["人称代词。称不止一个人的对方或包括对方在内的若干人：～歇一会儿，让我们接着干。～几个谁年龄大?"],"你好":["用于有礼貌的打招呼或表示与人见面时的问候。"],"你追我赶":["形容竞赛激烈，大家都不甘落后。"],"使劲":["用力：～划船。我们俩使足了劲儿才把这块石头搬开。"],"使用":["使人员、器物、资金等为某种目的服务：～干部。合理～资金。"],"供求":["供给和需求（多指商品）：～关系。拓宽流通渠道，使～平衡。"],"便利":["1.使用或行动起来不感觉困难；容易达到目的：交通～。附近就有商场，买东西很～。\n2.使便利：扩大商业网，～群众。"],"便当":["方便；顺手；简单；容易：这里乘车很～。东西不多，收拾起来很～。"],"保存":["使事物、性质、意义、作风等继续存在，不受损失或不发生变化：～古迹。～实力。～自己，消灭敌人。"],"保安":["1.保卫治安：加强～工作。\n2.保护工人安全，防止在生产过程中发生人身事故：～规程。～制度。\n3.指保安员，在机关、企业、商店、宾馆、住宅区等做保卫治安工作的人。"],"保护":["尽力照顾，使不受损害：～眼睛。～妇女儿童的权益。"],"信从":["信任听从：盲目～。"],"候车":["等候乘车：～室。"],"假如":["连词。如果，表示假设：～不把基础打好，以后学习就会有许多困难。"],"做事":["1.从事某种工作或处理某项事情：他～一向认真负责。 屋里太吵了，做不了事。\n2.担任固定的职务；工作：你现在在哪儿～?"],"做寿":["（为老年人）做生日。"],"做工":["1.从事体力劳动（多指工业或手工业劳动）：她在纺纱厂～。\n2.（～儿）\n3.同“做功”。\n4.指制作的技术或质量：这件衣服～很细。"],"做梦":["1.睡眠中因大脑里的抑制过程不彻底，在意识中呈现种种幻象。\n2.比喻幻想：白日～。"],"停机坪":["机场上紧靠航站（候机楼）区或机库的有铺砌面的广场，用来装卸货物和停放飞机。"],"偶尔":["1.间或；有时候：他经常写小说，～也写诗。\n2.属性词。偶然发生的：～的事。"],"傲慢":["轻视别人，对人没有礼貌：态度～。～无礼。"],"僧伽":["1.梵语的译音。意为大众。原指出家佛教徒四人以上组成的团体，后单个和尚也称“僧伽”。简称为僧。\n2.梵语。狮子。\n3.国名。指今斯里兰卡。旧称狮子国。\n4.人名。为西域名僧，俗姓何，龙朔初入唐，於泗州建寺，后居荐福寺。世称其为观音大士化身。\n5.借指观音大士或其塑像。"],"充满":["1.填满；布满：她眼里～泪水。欢呼声～了会场。\n2.充分具有：～激情。歌声里～着信心和力量。"],"先后":["1.先和后：要办的事情很多，应该分个～缓急。\n2.前后相继：新出土的文物～在国内外多次展出。"],"先进":["1.进步快、水平高、可以作为学习榜样的：～人物。～经验。\n2.走在前面的、高水平的：～技术。"],"光亮":["1.明亮：～的窗子。这套家具油漆得挺～。\n2.亮光：山洞里一点儿～也没有。"],"光华":["明亮的光辉 2.差不多，接近。"],"几何":["1.多少：价值～。\n2.数学的分支学科。研究物体的形状、大小和位置及它们的相互关系。"],"几时":["疑问代词。什么时候：你们～走?。你～有空儿过来坐吧。"],"出世":["1.出生：那年他还没有～。\n2.产生：旧制度灭亡，新制度～。\n3.超脱人世，摆脱世事的束缚：～思想。"],"出于":["暂无解释。"],"出产":["1.天然生长或人工生产：云南～大理石。景德镇～的瓷器是世界闻名的。\n2.出产的物品：～丰富。这些瓷器是景德镇的～。"],"出入":["1.出去和进来：～随手关门。东西堆在过道，～不方便。\n2.（数目、内容等）不一致、不相符的情况：现款跟账上的数目没有～。你俩说的话有～。"],"出动":["1.（队伍）外出活动：队部命令一分队做好准备，待令～。\n2.派出（军队）：～伞兵，协同作战。\n3.（许多人为某事）行动起来：昨天大扫除，全校师生都～了。"],"出去":["1.从里面到外面去：出得去。出不去。～走走，呼吸点新鲜空气。\n2.趋向动词。用在动词后，表示动作由里向外离开说话的人：走得～。走不～。送出大门去。"],"出尔反尔":["《孟子·梁惠王下》：“出乎尔者，反乎尔者也。”原意是你怎么做，就会得到怎样的后果。今指说了又翻悔或说了不照着做，表示言行前后自相矛盾，反复无常。"],"分开":["1.人或事物不聚在一起：弟兄两人～已经三年了。这些问题是彼此～而又联系着的。\n2.使分开：老赵用手～人群，挤到台前。这两件事要～解决。"],"分离":["1.分开：理论与实践是不可～的。从空气中～出氮气来。\n2.别离：～了多年的兄弟又重逢了。"],"分类":["根据事物的特点分别归类：图书～法。把文件～存档。"],"分给":["1.分发食品、财物等作为给养。《南史·陈武帝纪》：“是时食尽，调市人餽军，皆是麦屑为饭，以荷叶裹而分给。”《北史·崔孝政传》：“坐食进退，孝芬 不命则不敢也，鸡鸣而起，且温颜色，一钱尺帛，不入私房，吉凶有须，聚对分给。”《宋史·世家传二·孟昶》：“凡克城砦，止籍其器甲芻粮，悉以钱帛分给战士。”\n2.分别给予；分出部分交予。如：分给每人一本书。"],"切口":["帮会或某些行业中的暗语。"],"切断":["1.断开电路可能切断。\n2.断绝切断敌人的退路。"],"切除":["用外科手术把身体上发生病变的部分切掉：～肿瘤。他最近做了一次外科～手术。"],"创业":["创办事业：～史。～守成。艰苦～。"],"别的":["暂未释义"],"到此为止":["以这里为界限。"],"到达":["到了（某一地点、某一阶段）：火车于下午3时～北京。"],"制作":["制造：～家具。"],"制定":["定出（法律、章程、计划等）：～宪法。～学会章程。～年度计划。"],"制度":["1.要求大家共同遵守的办事规程或行动准则：工作～。财政～。\n2.在一定历史条件下形成的政治、经济、文化等方面的体系：社会主义～。封建宗法～。"],"制服":["1.同“制伏”。\n2.军人、机关工作者、学生等穿戴的有规定式样的服装。"],"制造":["1.用人工使原材料成为可供使用的物品：～机器。～化肥。\n2.人为地造成某种气氛或局面等（含贬义）：～纠纷。～紧张气氛。"],"刻不容缓":["时间一点都不容许耽搁。形容形势紧迫，必须立即行动。"],"刻字":["用小刀在木、石等上雕刻出文字。"],"削发为尼":["把头发剪掉成为尼姑。"],"前进":["向前行动或发展。"],"前面":["1.正面所对着的某一位置；正面。2.次序靠前的部分；文章或讲话中先于正在叙述的部分。"],"剪断":["1.干脆利落。\n2.切断，打断。"],"力战":["努力奋战。"],"力气":["肌肉的效能；气力：他的～大，一个人就搬起了这块大石头。累得连说话的～也没有了。"],"劝告":["1.拿道理说服人，使人改正错误或接受意见：再三～。\n2.希望人改正错误或接受意见而说的话：你要多听听大家的～。"],"办事":["做事：～认真。我们是给群众～的。今天办了不少事。"],"办公":["办理公务；处理公事：～会议。星期天照常～。"],"办法":["处理事情或解决问题的方法：好～。他不答应，你也拿他没～。"],"功成名就":["功业建立了，名声也有了。也说功成名立、功成名遂。"],"加上":["承接上句，有进一步的意思，下文多表示结果：他不太用功，～基础也差，成绩老是上不去。"],"加入":["1.加上；掺进去：～食糖少许。\n2.参加进去：～工会。～足球队。"],"加快":["1.使变得更快：～建设进度。他～了步子，走到队伍的前面。\n2.铁路部门指持有慢车车票的旅客办理手续后改乘快车。"],"加法":["数学中的一种运算方法。最简单的是数的加法，即两个或两个以上的数合成一个数的计算方法。"],"加紧":["加快速度或加大强度：～生产。～训练。～田间管理工作。"],"加速":["1.加快速度：火车正在～运行。\n2.使速度加快：～其自身的灭亡。"],"动作":["1.全身或身体的一部分的活动：这一节操有四个～。～敏捷。\n2.活动；行动起来：弹钢琴要十个指头都～。"],"动力":["1.使机械做功的各种作用力，如水力、风力、电力、畜力等。\n2.比喻推动工作、事业等前进和发展的力量：人民是创造世界历史的～。"],"动机":["推动人从事某种行为的念头：～好，方法不对头，也会把事办坏。"],"动物":["生物界中的一 大类。多以有机物为食料，一般都有神经，有感觉，能自由行动。分无脊椎动物和脊椎动物两大类。已 知的种类有一百多万种。"],"助手":["不独立承担任务，只协助别人进行工作的人：得力～。"],"助理":["1.属性词。协助主要负责人办事的（多用于职位名称）：～人员。～编辑。～研究员。\n2.指协助主要负责人办事的人：部长～。"],"努力":["1.把力量尽量使出来：大家再努一把力。\n2.指花的精力多，下的工夫大：～工作。学习很～。"],"包子":["食品，用菜、肉或糖等做馅儿，多用发面做皮，包成后，蒸熟。"],"化学":["研究物质的组成、结构、性质以及变化规律的科学。可分为无机化学、有机化学、物理化学、分析化学、高分子化学、生物化学、放射化学、地球化学等分支学科。"],"化工":["化学工业的简称。"],"化石":["古代生物的遗体、遗物或遗迹埋藏在地下变成的跟石头一样的东西。研究化石可以了解生物的演化并能帮助确定地层的年代。"],"匹夫之勇":["指不讲求智谋，只凭个人蛮干的勇气。"],"医术":["医疗技术：～高明。"],"医生":["掌握医药知识、以治病为业的人。"],"医院":["治疗和护理病人的机构，也兼做健康检查、疾病预防等工作。"],"十一":["10月1日，中华人民共和国国庆日。1949年10月1日中华人民共和国成立。"],"十全十美":["各方面都非常完美，毫无缺陷：人都有缺点，哪能～呢?"],"十分":["很：～满意。～过意不去。"],"十拿九稳":["比喻很有把握。也说十拿九准。"],"十足":["1.成色纯：～的黄金。\n2.十分充足：～的理由。神气～。干劲～。"],"千万":["务必（表示恳切叮咛）：～不可大意。这件事你～记着。"],"千克":["质量单位。国际千克原器的质量为1千克。是国际单位制中七个基本单位之一。"],"千古":["1.长久的年代：流芳～。\n2.婉辞。哀悼死者，表示永别。多用于挽联、花圈等的上款，意为留名永久。"],"半价":["原价的一半：～出售。"],"半信半疑":["有些相信，又有些怀疑。"],"半夜三更":["深夜：～的，别再大声说话了。"],"半空":["空中：柳絮在～飘荡。"],"半路":["1.路程的一半或中间：走到～，天就黑了。\n2.比喻事情正处在进行的过程中：他听故事入了神，不愿意～走开。‖也说半道儿。"],"华丽":["美丽而有光彩：服饰～。宏伟～的宫殿。"],"华灯":["雕饰华美或光华灿烂的灯：～初上。长安街上～齐放。"],"卓尔不群":["超乎寻常，与众不同。《汉书·景十三王传》：“夫唯大雅，卓尔不群。” 卓尔：特出的样子。不群：与众人不一样。"],"单独":["不跟别的合在一起；独自：～行动。请抽空到我这里来一下，我要～跟你谈谈。他已经能够离开师傅，～操作了。"],"南部":["一个国家或一个地区靠南边的那部分土地。"],"南都":["1.地名。东汉 光武帝 的故乡在 南阳郡，郡治 宛 在京都 洛阳 之南，因称 宛 为 南都。在今 河南省 南阳市。汉 张衡 有《南都赋》，李善 注引 挚虞 曰：“南阳郡，治 宛，在京之南，故曰 南都。”唐 李白《南都行》：“南都 信佳丽，武闕 横西关。”\n2.明 人称 南京 为 南都。如 吴应箕 记 南京 召试事，书名为《南都应试记》。清 顾炎武《赠于副将元剴》诗：“乍领射声兵，南都 已沦倾。”"],"即使":["连词。表示假设的让步（以进一步证实或加强主句的意思）：～我们的工作取得了极其伟大的成绩，也没有任何值得骄傲自大的理由。"],"即刻":["立刻：～出发。"],"即席":["1.在宴会或集会上：～讲话。～赋诗。\n2.入席；就位。"],"即日":["1.当天：本条例自～起施行。\n2.最近几天；近日：本片～放映。"],"历史":["1.自然界和人类社会的发展过程，也指某种事物的发展过程和个人的经历：地球的～。人类的～。\n2.过去的事实：这件事早已成为～。\n3.过去事实的记载。\n4.指历史学。"],"历来":["从来；一向：～如此。老校长～重视学生素质教育。我国人民～就有勤劳勇敢的优良传统。"],"历险":["经历危险：山中～记。"],"原则":["1.说话或行事所依据的法则或标准：～性。～问题。坚持～。基本～。\n2.指总的方面；大体上：他～上赞成这个方案，只在细节上提了些意见。"],"去年":["时间词。今年的前一年。"],"去火":["中医指消除身体里的火气：消痰～。喝点绿豆汤，去去火。"],"及时":["1.正赶上时候；适合需要：～雨。他来得很～。\n2.不拖延；马上；立刻：有问题就～解决。"],"及格":["（考试成绩）达到规定的最低标准。"],"友人":["朋友：国际～。"],"友善":["朋友之间亲近和睦：素相～。～相处。"],"友好往来":["暂无解释。"],"双关":["修辞格的一种。利用语言上的多义和同音关系，使一句话关涉到两个意思。即表面说的是一种意义，实际指的是另一种意义。有谐音双关和意义双关两种。"],"双手":["是左右结构。"],"双方":["在某一件事情上相对的两个人或集体：男女～。缔约国～。～互不相让。"],"双管齐下":["唐张璪（zǎo）善画松，能两手拿着笔同时作画，一画生枝，一画枯干。语见宋郭若虚《图画见闻志》卷五。后以“双管齐下”比喻两件事同时进行或两种方法同时采用。管：笔。"],"发明":["1.创造出从前没有 的事物或方法：指南针、火药、造纸和印刷术是由中国首先～的。\n2.专利上指对产品、方法或其改 进所提出的新的技术方案。具有新颖性、创造性和实用性的发明可以获得专利权。\n3.说明；发挥： ～文义。"],"发现":["1.经过研究、探索等，看到或找到前人没有看到的事物或规律：～新的基本粒子。有所发明，有所～，有所创造。\n2.发觉：这两天，我～他好像有什么心事。"],"发芽":["种子的胚发育长大，突破种皮而出。"],"取得":["得到：～联系。～经验。"],"取长补短":["吸取别人的长处，弥补自己的短处。"],"变动":["1.变化（多指社会现象）：人事～。国际局势发生了很大的～。\n2.改变：任务～了。根据市场需要，～蔬菜种植计划。"],"变化":["事物在形态上或本质上产生新的状况：化学～。～多端。形势～得很快。"],"变成":["1.从以前的状态或情况转化为现在的状态或情况。\n2.呈现某种新的实质或性质而成为。"],"变迁":["情况或阶段的变化转移：陵谷～。人事～。时代～。"],"口令":["1.战斗、练兵或做体操时以简短的术语下达的口头命令：喊～。\n2.在能见度不良等情况下识别敌我的一种口头暗号，一般以单词或数字表示：问～。对～。"],"口水":["唾液的通称：流～。"],"口音":["1.说话的声音。\n2.方音。\n\n\"〈名〉发音时软腭上升，阻住鼻腔的通道，气流专从口腔出来的叫做口音（区别于鼻音和鼻化元音）。普通话语音中m，n，ng三个是鼻元音，ng尾韵儿化后前面的元音变成鼻化元音，其余都是口音，如a，o，e，b，p，f等。\"。"],"古为今用":["吸收古代的优点，扬弃缺点，以使现代更进步。"],"古书":["古代的书籍或著作。"],"古人":["1.也叫早期智人。介于猿人和 新人之间的人类，为人类发展的第三阶段。生活于距今约二十余万年至约四万年前。中国古人化石有大 荔人、丁村人、马坝人、龙骨山人等。\n2.泛指古代的人。"],"古今":["古代和现代。"],"古代":["1.过去距离现代较远的时代（区别于“近代、现代”）。在我国历史分期上多指19世纪中叶以前。\n2.特指奴隶社会时代（有时也包括原始公社时代）。"],"另加":["通过添加而存在或得到；附加，追加。"],"另外":["1.指示代词。指所说范围之外的人或事：我还要跟你谈～一件事情。\n2.表示在所说的范围之外：我～又补充了几点意见。\n3.此外：他家新买了一台拖拉机，～还买了脱粒机。"],"另当别论":["原来看法等不成立，另加以有评论。"],"另类":["1.另外的一类，指与众不同的、非常特殊的人或事物：这样的女孩可以归入～。这部片子是当代电影中的～。\n2.与众不同；特殊：～服装。她打扮得很～。"],"只有":["表示唯一的条件（下文常用“才”或“方”呼应）：～同心协力，才能把事情办好。"],"只言片语":["个别的词句；片段的话语。"],"只身":["单独一个人：～独往。～在外。"],"叫喊":["大声叫；嚷：高声～。～的声音越来越近。"],"叫好":["对于精彩的表演等大声喊“好”，以表示赞赏。"],"叫门":["在门外叫里边的人来开门。"],"可以":["1.表示可能或能够：不会的事情，用心去学，是～学会的。这片麦子已经熟了，～割了。\n2.表示许可：你～走了。\n3.好；不坏；过得去：这篇文章写得还～。\n4.厉害：你这张嘴真～。天气实在热得～。"],"可是":["1.表示转折，前面常常有“虽然”之类表示让步的连词呼应：大家虽然很累，～都很愉快。\n2.真是；实在是：她家媳妇那个贤惠，～百里挑一。"],"可爱":["令人喜爱：这孩子真～。"],"可能":["1.可以实现的；能成为事实的：～性。团结一切～团结的力量。提前完成任务是完全～的。\n2.能成为事实的属性；可能性：根据需要和～安排工作。事情的发展不外有两种～。\n3.助动词。表示估计，不很确定：他～开会去了。"],"叶片":["1.叶的组成部分之一，通常是很薄的扁平体，有叶肉和叶脉，是植物进行光合作用和蒸腾作用的主要部分。\n2.涡轮机、水泵、鼓风机等机器中形状像叶子的零件，许多叶片构成叶轮。"],"司机":["火车、汽车、电车等交通运输工具上的驾驶员。"],"司法":["公安机关、人民检察院和人民法院按照诉讼程序应用法律规范处理案件的活动。"],"司长":["概述 司长：司局级为中国干部行政级别中一个级别，正司局级干部（地市级干部）是高级干部。例如教育部社会科学研究与思想政治工作司司长是国务院部委各司正职干部。1性质司局级是我国公务员的一个级别（正职为行政五级，副职为行政六级），正司局级及其以上级别为国家高级干部司局级也就是地厅级、地市级，厅、司、局（非市局、县局）、地级市为一个级别，平级。应用司长：正厅级干部（地市级干部）：为高级干部国务院部委各司正职干部（如教育部社会科学研究与思想政治工作司司长）各省、自治区、直辖市厅局正职干部（如河北省交通厅厅长…。"],"司马":["1.西周开始设置的中央官吏名。掌管全国军政和军赋。汉武帝时改太尉为大司马。后世用作兵部尚书的别称。\n2.隋唐时州郡之官也称司马。\n3.复姓。"],"叽里呱啦":["形容大声说话的声音：～说个没完。"],"吃亏":["1.受损失：决不能让群众～。他吃了不少亏。\n2.在某方面条件不利：这场球赛，他们吃了经验不足的亏，否则不会输。"],"吃力":["1.费力：爬山很～。～不讨好。\n2.疲劳：跑了一天路，感到很～。"],"吃惊":["受惊：令人～。大吃一惊。"],"吃水":["1.吸取水分：这块地不～。和面时玉米面比白面～。\n2.取用生活用水：高山地区～困难。\n3.供食用的水（区别于洗东西用的水）。\n4.船身入水的深度。"],"吃苦":["经受艰苦：～耐劳。～在前，享乐在后。"],"各个":["1.指示代词。每个；所有的那些个：～厂矿。～方面。\n2.逐个：～击破。"],"各地":["各地指全世界所有的国家的所有地方。"],"各得其所":["《周易·系辞下》：“交易而退，各得其所。” 原指每个人都得到了满足。后指每一个人或事物都得到恰当的安置。《汉书·东方朔传》：“元元之民，各得其所。”"],"各种":["多种。"],"各自":["人称代词。各人自己；各个方面自己的一方：既要～努力，也要彼此帮助。工作中出了问题，不能只责怪对方，要～多做自我批评。"],"合力":["1.一起出力：同心～。\n2.一个力对某物体的作用和另外几个力同时对该物体的作用的效果相同，这一个力就是那几个力的合力。"],"合同":["1.同（tong）。也叫契约。双方（或数方）当事人依法订立的有关权利义务的协议。对当事人具有约束力。\n2.同（tóng）。军事上指以某一兵种为主，其他军兵种、专业兵种相互协同。"],"合并":["1.结合到一起：～机构。这三个提议～讨论。\n2.指正在患某种病的同时又发生（另一种疾病）：麻疹～肺炎。"],"合格":["符合标准：质量～。检查～。～产品。"],"合理":["合乎道理或事理：～使用。～密植。他说的话很～。"],"同学":["1.在同一个学校学习：我们自幼～。我和他同过三年学。\n2.在同一个学校学习的人：老～。这位是我的同班～。\n3.称呼学生：～，请问你到游乐场怎么走?"],"同志":["1.为共同的理想、事业而奋斗的人，特指同一个政党的成员。\n2.人们惯用的彼此之间的称呼：女～。老～。张～。～，请问您贵姓?"],"名人":["著名的人物：文化～。～墨迹。"],"名称":["事物的名字（也用于人的集体）。"],"后代":["1.某一时代以后的时代：这些远古的事，大都是～人们的推测。\n2.后代的人，也指个人的子孙：我们要为～造福。这家人没有～。"],"后天":["1.指人或动物离开母体单独生活和成长的时期：先天不足，～失调。\n2.哲学上指（知识）来自实践，来自经验，依赖于实践。与“先天”相对。\n3.明天的明天。"],"后日":["日后，今后。"],"后来居上":["《史记·汲郑列传》：“陛下用群臣，如积薪耳，后来者居上。” 原来是表示不满的话，认为帝王用臣不能像堆柴禾那样，把新进的放在旧臣之上。后用以指后起的超过了先前的。"],"后辈":["1.后代，指子孙。\n2.同行中年轻的或资历浅的人。"],"向上":["1.朝上。\n2.上进；向好的方面发展：好好学习，天天～。"],"君子之交":["贤者之间的交情，平淡如水，不尚虚华。"],"否认":["不承认：矢口～。～事实。"],"吧台":["酒吧里供应饮料等的柜台，一般旁边设有座位。"],"吧唧":["象声词，光脚在泥里走发出的声音或类似的声音。"],"吧嗒":["1.嘴唇开合作声。 2.〈方〉抽"],"听天由命":["听从天意和命运的安排。《论语·颜渊》：“死生有命，富贵在天。” 后多比喻听任事态自然发展，不作主观努力。"],"听见":["〈动〉听到。"],"听觉":["声音刺激耳朵引起的感觉。由声波振动耳鼓膜，引起耳蜗的感觉细胞兴奋，经听神经传导到大脑的听区而一§生。"],"听讲":["听人讲课或讲演：一面～，一面记笔记。"],"听说":["1.听人说：我～他到上海去了。\n2.听话"],"告知":["告诉使知道：把通信地址～在京的同学。"],"告诉":["说给人，使人知道。"],"员工":["职员和工人：铁路～。"],"呢呢":["絮絮不休貌。"],"呼啦":["形容旗帜飘动等的声音：红旗被风吹得～～地响。也作呼喇。也说呼啦啦。"],"呼朋唤友":["指招引意气相投的人。"],"命令":["1.上级对下级有所指示：连长～一排担任警戒。\n2.上级给下级的指示：司令部昨天先后来了两道～。"],"和平":["1.指没有战争的状态。与“战争”相对。\n2.温和，不猛烈：药性～。"],"品尝":["仔细地辨别；尝试（滋味）：～鲜桃。～名酒。"],"品种":["1.经过人工选择和培育、具有一定经济价值和共同遗传特点的一群生物体（通常指栽培植物、牲畜、家禽等）。\n2.泛指产品的种类：增加花色～。～齐全。"],"品鉴":["欣赏鉴定。"],"哇啦":["形容说话或吵闹声：～～地发议论。也作哇喇。"],"哈什":["哈欠。"],"哗啦":["形容撞击、水流等的声音：～一声，墙倒了。雨～～地下。也说哗啦啦。"],"商品":["用来交换的物品。人类用作商品的实际上大多数都是劳动产品，因此商品具有二重性：一方面能够用来满足人们的某种需要，具有一定的使用价值；另一方面凝结了一般人类劳动，具有一定的价值。商品是使用价值和价值的统一体。其价值量由生产它所花费的社会必要劳动时间决定。人们相互交换商品，实际上是互相交换各自的劳动。因此，商品是在物的外壳掩盖下的一种特定的生产关系。商品是一个历史范畴，社会分工和产品归不同的所有者所有是产生商品的两个历史前提。在不同社会制度下体现不同的生产关系。"],"商场":["1.聚集在一个或相连的几个建筑物内的各种商店、摊位所组成的市场。\n2.面积较大、商品比较齐全的综合商店：百货～。\n3.指商界。"],"商都":["指的是夏代商国以及商朝的都城。"],"喜庆":["1.值得喜欢和庆贺：～事。十分～的日子。\n2.值得喜欢和庆贺的事。"],"喜欢":["1.对人或事物有好感或感兴趣：他～文学，我～数学。\n2.愉快；高兴：女儿考上了大学，妈妈～得不得了。快把好消息说一说，叫大家～～。"],"喜爱":["对人或事物有好感或感兴趣：～游泳。这小孩儿惹人～。"],"嗯呢":["嗯呢；东北方言，正常语气表示“是”的意思，表示同意。轻音的时候有敷衍的意思，重音有不耐烦的意思。"],"四方":["1.东、南、西、北，泛指各处：～响应。奔走～。\n2.属性词。正方形或立方体的：～的木头匣子。四四方方的大脸。"],"四海为家":["任何一个地方都可以当作自己的家。《汉书·高祖纪》：“天子以四海为家。” 后比喻志在四方，不留恋乡土或家庭。也形容人漂泊无定所。四海：泛指天下。"],"回国":["暂未释义"],"回头":["1.把头转向后方：一～就看见了。请你回过头来。\n2.回来；返回：一去不～。\n3.悔悟；改邪归正：败子～。现在～还不算晚。\n4.少等一会儿；过一段时间以后：你先吃饭，～再谈。我先走了，～见!"],"回家":["《回家》这首乐曲作者为美国著名萨克斯演奏家肯尼.基（Kenny G）创作。其优美的旋律为全世界各地的人所熟知。也恰恰因为这首乐曲，让多数音乐爱好者了解并熟知萨克斯这一乐器。"],"回应":["回答；答应：对代表们的建议给予积极的～。叫了半天，也不见有人～。"],"回报":["1.报告（任务、使命等执行的情况）。\n2.报答；酬报：做好事不图～。\n3.报复：你这样恶意攻击人家，总有一天会遭到～的。"],"回来":["1.从别处到原来的地方来：他刚从外地～。他每天早晨出去，晚上才～。\n2.趋向动词。用在动词后，表示到原来的地方来：跑～。把借出的书要～。"],"回答":["对问题给予解释；对要求表示意见：～问题。满意的～。"],"回话":["1.回答别人的问话（旧时多用于下对上）。\n2.答复的话（多指由别人转告的）：我一定去，请你带个～给他。"],"因此":["因为这个；所以：他的话引得大家都笑了，室内的空气～轻松了很多。我和他认识多年，～很了解他的性格。"],"国内":["在特定的国家的内部。"],"国家":["1.一个国家政权所领有的区域：我国是一个土地辽阔、资源丰富的～。\n2.阶级统治的工具。是占统治地位的阶级为维护本阶级的利益、巩固其统治，对被统治阶级施用暴力的机器。由国家立法机关、国家行政机关、检察机关、军队、警察、法庭、监狱等组成。"],"国旗":["代表一个国家的旗帜。体现国家的主权和尊严。中国的国旗是五星红旗，红色象征革命，五星象征中国共产党领导的以工农联盟为基础的全国各族人民的大团结。"],"图像":["1.画成的形象。\n2.把自变量x的一个值和函数y的对应值分别作为点的横坐标和纵坐标，在直角坐标系内描出一个点，所有这些点的集合，叫做这个函数的图像。"],"在下":["谦称自己（多见于早期白话）：先生过奖，～实不敢当。"],"在乎":["1.在于：东西不～好看，而～实用。\n2.在意；介意（多用于否定式）：满不～。只要能学会，多学几天倒不～。"],"在家":["1.在家里；在工作或住宿的地方；没有出门。\n2.对僧、尼、道士等“出家”而言，一般人都算在家：～人。"],"地基":["作为建筑物基础的地层。"],"地方":["1.中央下属的各级行政区划的统称。2.军队方面指军队以外的部门、团体等。3.本地；当地。"],"地步":["1.景况；境地（多指 不好的）：没曾想落到这个～。\n2.周转回旋的余地：留～。\n3.（达到的）程度：达到了无以复 加的～。"],"地球":["人类居住的星球。太阳系九大行星之一。以距离太阳由近及远的次序计是第三颗。和太阳的平均距离为14 960万千米；赤 道半径6 378千米，极半径6 357千米。平均密度是水的5.5倍。公转周期约365.25日，自转周期约23时56 分。地球有一颗卫星，即月球。"],"场地":["空地，多指供文娱体育活动或施工、试验等用的地方：平整～。～不够大。"],"坐下":["暂未释义"],"坐井观天":["比喻眼光狭小，见识短浅。唐韩愈《原道》：“坐井而观天，曰天小者，非天小也。”"],"坐具":["供人坐的用具，如椅子、凳子等。"],"坐失良机":["不主动及时行动而失去好机会。"],"坐骑":["供人骑的马，也泛指供人骑的兽类。"],"坚持":["坚决保持、维护或进行：～原则。～己见。～不懈。～工作。"],"基地":["作为某种事业基础的地区：军事～。工业建设～。"],"基础":["1.建筑物的地基。\n2.事物发展的根本或起点：农业是国民经济的～。在现有～上提高一步。"],"士兵":["也叫战士。军队中被授予士官和兵军衔的军人。中国人民解放军士兵的衔级分士官和兵两级。"],"壮丽":["雄壮美丽：山河～。"],"声音":["声波通过听觉所产生的印象：～大。他听见了敲门的～。报纸反映了群众的～。"],"处理":["1.安排（事物）；解决（问题）：～日常事务。\n2.处治；惩办：依法～。～了几个带头闹事的人。\n3.指减价或变价出售：～品。这些积压商品全部削价～。\n4.用特定的方法对工件或产品进行加工，使工件或产品获得所需要的性能：热～。"],"处罚":["对犯错误或犯罪的人加以惩治。"],"外祖父":["母亲的父亲。"],"多久":["表疑问，要多长时间?"],"多么":["相同，“多么”用于感叹句为主，其他用法不如“多”普通。"],"多嘴":["不该说而说：～多舌。你不了解情况，别～!"],"多少":["1.指量度或数量大小。 2.或多或少;未特别指出的或未确定的东西。 3.稍微。"],"多心":["乱起疑心；用不必要的心思：你别～，他不是冲你说的。"],"多次":["【词目】多次（程度副词）他已来过多次，因而对这里的环境很熟悉。孔羽《睢县文史资料·袁氏陆园》：“袁家山（袁可立别业），……此后，山阜、八仙亭、山门、庭院等曾多次整修，作为文化馆展览文物之用。”"],"夜色":["夜晚的景色：～苍茫。～深沉。朦胧的～。"],"够了":["用于表示惊讶和规劝，常常是重叠使用，表示满足需要了。"],"大功告成":["指大的工程、事业或重要任务宣告完成。"],"大呼小叫":["高一声低一声地乱叫乱喊。"],"大夫":["大夫古代官名。 西周以后的诸侯国中，国君下有卿、大夫十三级，大夫世袭，且有封地。后来大夫成为一般任官职者的称呼孤之过也，大夫何罪。--《左传.僖公三十三年》"],"大妈":["1.伯母。\n2.尊称年长的妇女。"],"大家":["1.著名的专家：书法～。～手笔。\n2.世家望族：～闺秀。\n3.a）某人或某些人跟“大家”对举的时候，这人或这些人不在“大家”的范围之内，如：我报告～一个好消息。你讲个笑话给～听听。他们一进来，～都鼓掌表示欢迎。b）“大家”常常放在“你们、我们、他们、咱们”后面做复指成分，如：明天咱们～开个会谈谈。"],"大小":["1.指大小的程度：这双鞋我穿上～正合适。\n2.辈分的高低：不分～。没～。\n3.大人和小孩儿：全家～五口。大大小小六个人。\n4.或大或小（多偏于小），表示还能算得上：～是个干部。～也是笔生意。"],"大米":["稻的子实脱壳后叫大米。"],"大约":["1.表示估计的数目不十分精确（句子里有数字）：他～有六十开外了。\n2.表示有很大的可能性：他～是开会去了。"],"大话":["虚夸的话：说～。"],"大量":["1.属性词。数量多：～节日用品源源不断运来。～生产化肥，支援农业生产。\n2.气量大，能容忍：宽宏～。"],"天上":["〈名〉天空。"],"天使":["1.犹太教、基督教、伊斯兰教等宗教指神的使者。西方文学艺术中，天使的形象多为带翅膀的少女或小孩子，现在常用来比喻天真可爱的人（多指女子或小孩子）。\n2.皇帝的使者。"],"天才":["1.天赋的才能；超出一般人的聪明智慧：艺术～。～的创作。\n2.有天才的人。"],"天造地设":["自然形成而合乎理想：这里物产丰富，山水秀丽，四季如春，真是～的好地方。他们真是～的一对好夫妻。"],"天黑":["1.太阳落下后，天色变黑。\n2.光线不足，不明亮。"],"太平":["指社会平安；安宁：天下～。～景象。太太平平地过日子。"],"太平盛世":["安定、兴盛的时代。"],"太空":["极高的天空，特指地球大气层以外的宇宙空间：～飞行。宇宙火箭飞向～。"],"太阳":["1.银河系的恒星之一，是一炽热的气体球，体积是地球的130万倍，质量是地球的33.34万倍，表面温度约6000℃，内部温度约1500万℃，内部经常不断地进行原子核反应而产生大量的热能。太阳是太阳系的中心天体，距地球约1.496亿千米。地球和其他行星都围绕着它旋转并且从它得到光和热。（图见“太阳系”）\n2.指太阳光：今天～很好。\n3.指太阳穴。"],"夫妻":["丈夫和妻子：结发～。"],"失望":["1.感到没有希望，失去信心；希望落了空：多次抢救无效，彻底～。\n2.因为希望未实现而不愉快：孩子不争气，真令人～。"],"失重":["在加速运动的装置中，当装置的加速度方向同重力方向一致时，装置内的物体重量小于原来的重量，这种现象叫做失重。如宇宙飞船环绕地球运行时，它的加速度方向与重力方向一致，而且大小与重力加速度相等，飞船里呈现出失重现象，宇航员可以自由飘动。"],"头发":["人的前额以上、两耳以上和后颈部以上生长的毛。"],"奇妙":["稀奇巧妙（多用来形容令人感兴趣的新奇事物）：构思～。～世界。"],"奇异":["1.奇特：海底是一个～的世界。\n2.惊异：路上的人都用～的眼光看着这些来自远方的客人。"],"奇怪":["1.跟平常的不一样：海里有不少～的动植物。\n2.感到出乎意料，难以理解：我～为什么这时候他还不来。"],"奶妈":["受雇给人家奶孩子的妇女。"],"好似":["好像。"],"好像":["1.有些像；像：他们俩一见面就～多年的老朋友。\n2.似乎；仿佛：他低着头不作声，～在想什么事。"],"好学":["〈形+动〉容易学。"],"好意":["善良的心意：好心～。一番～。谢谢你对我的～。"],"如上":["如同上面所叙述或列举的：～所述。特将经过详情报告～。"],"如今":["“现在”可以指较长的一段时间，也可以指极短的时间，“如今”只能指较长的一段时间。"],"如愿以偿":["像所希望的那样得到满足。指愿望实现。"],"如果":["连词。一般用于上半句，表示假设，下半句推出结论或提出问题，常用“那么”“那”“则”“就”等词呼应：～有困难，我们自己可以克服。"],"如泣如诉":["好像在哭泣，又好像在诉说，形容声音凄切、悲苦。"],"妇人":["已婚的女子。"],"妇女":["成年女子的通称：～干部。劳动～。"],"妈妈":["1.母亲。子女对母亲的尊称。\n2.对上年纪的妇女的尊称。"],"妙不可言":["妙：美妙。形容好得难以用文字、语言表达。"],"妙计":["巧妙的计策：锦囊～。想了个～。"],"妡瑜":["大乘佛教的派别之一。"],"妻子":["妻子和儿女。"],"妻小":["妻子和儿女（多见于早期白话）。"],"妻弟":["妻子的弟弟。"],"始发":["（列车、汽车等）从行驶路线的第一站发出：～车。～站。列车正点～。"],"始终":["1.指从开始到最后的整个过程：贯彻～。\n2.表示从头到尾；一直：～不懈。～不赞成他的看法。"],"姑妈":["姑母（指已婚的）。"],"姓名":["姓和名字。"],"威尼斯":["意大利城市。位于该国东北部。是亚得里亚海沿岸重要港口。也是著名的水城和文化名城，多名胜古迹。"],"婚礼":["结婚仪式：举行～。"],"媳妇":["1.儿子的妻子。也叫儿媳妇儿。2.晚辈亲属的妻子。"],"字体":["1.同一种文字的各种不同形体，如汉字手写的楷书、行书、草书，印刷的宋体、黑体。\n2.书法的派别，如欧体、颜体。\n3.字的形体：～工整匀称。"],"字母":["1.拼音文字或注音符号的最小的书写单位：拉丁～。注音～。\n2.音韵学上指声母的代表字，如“明”代表m声母。"],"学习":["1.从阅读、听讲、研究、实践中获得知识或技能：～文化。～先进经验。\n2.效法：～他的为人。"],"学会":["由同一学科的研究者组成的学术团体。如语言学会、物理学会、工程学会等。"],"学士":["1.有学之士。旧时泛指有学问的人。\n2.六朝以后掌管编纂撰述的官名。唐置学士掌整理经籍图书、起草诏命等。宋代三馆诸阁遍设学士，南宋以后设置渐滥。\n3.学位的最低一级。"],"学校":["有计划、有组织、有领导地进行系统教育的机构。"],"学问":["1.正确反映客观事物的系统知识：这是一门深奥的～。\n2.知识；学识：有～。～很大。"],"孩子":["1.儿童：小～。男～。\n2.子女：她有两个～。"],"孩童":["儿童：三尺～。"],"它们":["人称代词。称不止一个的事物：这些衣服暂时不穿，把～收起来吧。"],"它界":["别的地区。"],"守则":["共同遵守的规则：学生～。"],"安全":["没有危险；不受威胁；不出事故：～操作。～地带。注意交通～。"],"安宁":["1.秩序正常，没有骚扰：地方～。边境～。\n2.（心情）安定；宁静：嘈杂的声音，使人不得～。"],"安定":["1.（生活、形势等）平静正常；稳定：生活～。情绪～。社会秩序～。\n2.使安定：～人心。"],"安居乐业":["生活安定，对所从事的工作感到满意。《后汉书·仲长统传》：“安居乐业，长养子孙，天下晏然。”"],"安静":["1.没有声音；没有吵闹和喧哗：病房里很～。\n2.安稳平静：孩子睡得很～。过了几年～生活。"],"完全":["1.齐全；不缺少什么：话还没说～。四肢～。\n2.全部；全然：～同意。他的病～好了。"],"完工":["工程或工作完成：该工程已于上月底～。"],"完成":["按照预期的目的结束；做成：～任务。～作业。计划完得成。"],"宏伟":["（规模、计划等）宏大雄伟：气势～。～的蓝图。"],"实事求是":["从实际情况出发，不夸大，不缩小，正确地对待和处理问题。《汉书·河间献王传》：“修学好古，实事求是。”"],"实在":["扎实；地道；不马虎。"],"实话":["真实的话：～实说。"],"宣传":["对群众说明讲解，使群众相信并跟着行动：～队。～交通法规。"],"室内":["一所建筑物的内部。"],"容易":["1.做起来不费事的：说时～做时难。这篇文章写得很通俗，～看。\n2.发生某种变化的可能性大：～生病。白衣服～脏。这种麦子不～倒伏。"],"宽容":["宽大有气量，不计较或追究：大度～。对损害群众利益的行为绝不能～。"],"寸步不让":["连寸步也不让给别人。形容丝毫不肯让步、妥协。"],"寸步难行":["形容走路、行动困难。比喻开展某项工作困难重重。也说寸步难移。"],"对待":["1.处于相对的情况：高山与平地～，不见高山，哪见平地?。工作和休息是互相～的，保证充分的休息，正是为了更好地工作。\n2.以某种态度或行为加之于人或事物：～朋友要真诚。要正确～批评。"],"对比":["1.（两种事物）相对比较：古今～。新旧～。\n2.比例：双方人数～是一对四。"],"对联":["写在纸上、布上或刻在竹子上、木头上、柱子上的对偶语句。"],"对话":["1.两个或更多的人之间的谈话（多指小说或戏剧里的人物之间的）：精彩的～。～要符合人物的性格。\n2.两方或几方之间接触或谈判：两国开始就边界问题进行～。领导和群众经常～可以加深彼此的了解。"],"寻找":["找1：～失物。～工作。"],"将士":["将领和士兵的统称：～用命（军官和士兵都服从命令）。"],"将要":["表示行为或情况不久以后就会发生：他～来北京。"],"将门虎子":["将门：世代为将的人家。比喻父辈有才能，子孙也身手不凡。也指后生子弟不辱门庭。"],"将领":["高级军官：陆军～。"],"小坐":["短时间坐下来；坐一会儿：～片刻。"],"小孩儿":["儿童；幼儿。"],"小班":["幼儿园里由三周岁至四周岁儿童所编成的班级。"],"小的":["1.旧时平民、差役对官绅自称之词。元 高文秀《遇上皇》第三折：“大人，小的是 东京 差来的。”《儒林外史》第六回：“那掌舵的道：‘想是刚才船板上几片云片糕。那是老爷剩下不要的，小的大胆就吃了。’”邓之诚《骨董三记·朱衣道人案》：“据 傅青主 供称：小的名 山，字 青主，原是 太原府 生员。”洪深《赵阎王》第六幕：“老爷别把小的当做凶手，小的没有杀人呀！”\n2.用为仆人对主人辈的自称之词。巴金《家》十八：“﹝ 高忠 ﹞等主人骂得够了，才慢慢地说：‘小的在街口上等了好久，都不见一条龙灯来。’”\n3.旧时对仆从的称呼。元 李直夫《虎头牌》第一折：“小的一壁厢刲羊宰猪，安排筵席者。”《西游记》第二八回：“小的们，都出去把那山上烧酥了的碎石头与我搬将起来堆着。”\n4.小孩子；少年。元 关汉卿《五侯宴》第二折：“兀那妇人，你抱着这箇小的丢在地下，去了可又回来，数番不止，你必是暗昧。”《水浒传》第二四回：“且説本县有个小的，年方十五六岁……取名叫做 鄆哥。”沙汀《卢家秀》：“三个小的，我早就把他们安顿睡了。”"],"小队":["队伍编制的基层单位，隶属于中队。"],"小院":["小庭院；小院落。"],"小鸟":["小鸟是由北京天寰新宇国际传媒有限公司于2010年4月30日发行在《朴文哲》专辑的歌曲。"],"少数":["较小的数量：～服从多数。"],"少见":["1.客套话，表示很少见到对方：～了，您近来好吗?\n2.难得见到；罕见：这种情景一般很～。"],"尔后":["从此以后：前年在上海见过一面，～就不知他的去向了。"],"就业":["得到职业；参加工作：劳动～。～人数逐年增加。"],"就学":["旧指学生到老师所在的地方去学习，今指进学校学习：～于北京大学。"],"尼姑":["指女子出家后受过具足戒入佛门的人。"],"尼龙":["锦纶的旧称。[英nylon]"],"尽快":["尽量加快：使新机器～投入生产。～地制订出新的年度计划。"],"尽早":["表示尽可能地提前：用完请～送回。"],"尽管":["1.表示不必考虑别的，放心去做：有意见～提，不要客气。你有什么困难～说，我们一定帮助你解决。\n2.老是；总是：有病早些治，～耽搁着也不好。\n3.表示姑且承认某种事实，下文往往有“但是、然而、还是”等表示转折的连词跟它呼应：～他不接受我的意见，我有意见还是要向他提。～以后变化难测，然而大体的趋势还是可以估计的。"],"尽量":["表示力求在一定范围内达到最大限度。"],"尾巴":["1.鸟、兽、虫、鱼等动物的身体末端突出的部分，主要作用是辅助运动、保持身体平衡等。\n2.某些物体的尾部：飞机～。彗星～。\n3.指事物的残留部分：彻底平反冤案，不要留～。\n4.指跟踪或尾随在后面的人：甩掉～。\n5.指没有主见、完全随声附和的人。"],"居住":["较长时期地住在一个地方：他家一直～在北京。"],"展现":["显现出；展示：走进大门，～在眼前的是一个宽广的庭院。"],"展示":["清楚地摆出来；明显地表现出来：～图纸。作品～了人物的内心活动。"],"岁数":["人的年龄：妈是上了～的人了。他今年多大～了?"],"岁月":["年月：漫长的～。艰苦斗争的～。"],"工作":["1.从事体力或脑力劳动，也泛指机器、工具受人操纵而发挥生产作用：积极～。开始～。铲土机正在～。\n2.职业：找～。～没有贵贱之分。\n3.业务；任务：～量。宣传～。工会～。科学研究～。"],"工整":["细致整齐；不潦草（多指写字做文章）。"],"巧妙":["（方法或技术等）灵巧高明，超过寻常的：构思～。～的计策。～地运用比喻，可以使语言生动活泼。"],"己见":["自己的意见：各抒～。固执～。"],"已经":["表示动作、变化完成或达到某种程度：任务～完成。他～来了。天～黑了，他们还没有收工。我今年～七十了。"],"巴士":["简称巴。英语音译词。公共汽车。"],"布什":["1.任总统均姓布什。其中乔治·赫伯特·沃克·布什被称为老布什；乔治·沃克·布什 被称为小布什，他们是父子关系。"],"希冀":["希望。"],"希图":["心里打算着达到某种目的（多指不好的）；企图：～暴利。～蒙混过关。"],"希望":["1.心里想着达到某种目的或出现某种情况：他从小就～做一名医生。\n2.希望达到的某种目的或出现的某种情况；愿望：这个～不难实现。\n3.希望所寄托的对象：青少年是我们的未来，是我们的～。"],"希求":["1.希望得到：～大家的帮助。\n2.希望和要求：他现在除了念书，没有别的～。"],"带头":["首先行动起来带动别人；领头儿：～人。～作用。～学科。"],"带来":["暂无解释。"],"带领":["1.在前带头使后面的人跟随着：老同学～新同学去见老师。\n2.领导或指挥（一群人进行集体活动）：老师～同学们去支援麦收。"],"帮助":["替人出力、出主意或给以物质上、精神上的支援：互相～。～灾民。"],"干活":["花费体力或脑力做事，尤指苦苦地或努力地劳动。"],"干爸":["感情就像父亲但没有血缘关系的人。"],"平安":["没有事故，没有危险；平稳安全：～无事。一路～。平平安安地到达目的地。"],"平常":["1.普通；不特别：话虽～，意义却很深刻。\n2.平时：他虽然身体不好，但～很少请假。"],"平时":["1.一般的、通常的时候（区别于特定的或特指的时候）。\n2.指平常时期（区别于非常时期，如战时、戒严时）。"],"平等":["1.指人们在社会、政治、经济、法律等方面享有相等待遇。\n2.泛指地位相等：～互利。男女～。"],"年代":["1.时代；时期；时间（多指过去较远的）：～久远。黑暗～。这件古董恐怕有～了。\n2.每一世纪中从“…十”到“…九”的十年，如1990—1999是20世纪90年代。"],"年华":["时光；年岁：虚度～。青春～。"],"年岁":["1.年纪：他虽然上了～，干起活儿来可不服老。\n2.年代；年头儿：从前遇到灾荒～，就得出外逃荒。因为～久远，大家早把这件事忘了。\n3.年成：他问了我家乡的～如何。"],"并且":["1.用于连接并列的动词或形容词等，表示几个动作同时进行或几种性质同时存在：聪明、机智～勇敢。会上热烈讨论～一致通过了这个生产计划。\n2.用在复句后一个分句里，表示更进一层的意思：她被评为先进生产者，～出席了先进生产者经验交流会。"],"并列":["并排平列，不分主次：这是～的两个分句。比赛结果两人～第三名。"],"并用":["同时使用：手脚～。多种手段～。"],"幸福":["1.使人心情舒畅的境遇和生活：为人民谋～。今天的～是先烈们流血流汗得来的。\n2.（生活、境遇）称心如意：随着经济的发展，人民越来越～。"],"应接不暇":["《世说新语·言语》：“从山阴道上行，山川自相映发，使人应接不暇。” 原形容景物繁多，来不及观赏。后多指来人或事情多，应付不过来。暇：空闲。"],"应用":["1.使用：～新技术。这种方法～得最为普遍。\n2.属性词。直接用于生活或生产的：～文。～科学。"],"应答":["回答：～如流。"],"应该":["助动词。表示理所当然：～爱护公共财产。为了大伙儿的事，我多受点累也是～的。"],"座位":["1.人可以坐下来的地方。2.也说座位儿。椅子、沙发等可供人坐的东西。"],"建立":["1.开始成立：～政权。～新的工业基地。\n2.开始产生；开始形成：～友谊。～邦交。"],"建筑":["1.修建（房屋、道路、桥梁等）：～桥梁。～铁路。这座礼堂～得非常坚固。不能把自己的幸福～在别人的痛苦上。\n2.建筑物：古老的～。园林～。上层～。"],"建议":["1.提出主张：～休会。\n2.提出的有具体办法的意见：合理化～。"],"建造":["建筑；修建：～房屋。～花园。"],"开办":["建立（工厂、学校、商店、医院等）：～幼儿园。～培训班。"],"开头":["1.（～儿）\n2.事情、行动、现象等最初发生：我们的学习刚～，你现在来参加还赶得上。\n3.使开头：请你先开个头儿。\n4.开始的时候或阶段：～我们都在一起，后来就分开了。这篇文章～就表明了作者的意向。"],"开始":["1.从头起；从某一点起：新的一年～了。今天从第五课～。\n2.动手做；着手进行：～一项新的工作。提纲已经定了，明天就可以～写。\n3.开始的阶段：一种新的工作，～总会遇到一些困难。"],"开学":["学期开始：～典礼。"],"开工":["1.（工厂）开始生产。\n2.（土木工程）开始修建。"],"开张":["1.商店等设立后开始营业：择日～。这家药店明日～。\n2.经商的人指一天中第一次成交。\n3.比喻某种事物开始。"],"开车":["1.驾驶机动车：路滑，～要注意安全。\n2.泛指开动机器。"],"开门":["1.敞开门，比喻公开做某事或广泛听取意见：～办学。～整风。\n2.指营业开始：银行九点才～。"],"张冠李戴":["明田艺蘅《留青日札》卷二二记俗谚：“张公帽掇在李公头上。” 后用“张冠李戴”比喻名实不符，弄错了对象。冠：帽子。"],"张口":["张嘴。"],"张开":["使合拢的东西分开。"],"强壮":["1.（身体）结实，有力气：～的体魄。\n2.使强壮：～剂。这药能～病人体质。"],"强大":["（力量）坚强雄厚：～的国家。阵容～。国力日益～。"],"强烈":["1.极强的；力量很大的：～的求知欲。太阳光十分～。\n2.鲜明的；程度很高的：～的对比。～的民族感情。\n3.强硬激烈：～反对。～的要求。"],"形单影只":["形容孤独，没有伴侣。也说形只影单。"],"形容":["1.形体和容貌：～憔悴。\n2.对事物的形象或性质加以描述：他高兴的心情简直无法～。"],"形式":["1.事物的形状、结构等。\n2.哲学范畴。指把构成事物的诸要素统一起来的结构方式及其表现方式。与“内容”相对。"],"形成":["通过发展变化而成为具有某种特点的事物，或者出现某种情形或局面：销售网已经～。～鲜明的对比。～难以打破的僵局。"],"形状":["物体或图形由外部的面或线条组合而呈现的外表。"],"彩带":["彩色的丝绸带子。"],"彩色":["多种颜色：～照片。"],"往事":["过去的事情：回忆～。～历历在目。"],"往后":["以后：～的日子还长着呢!"],"往年":["以往的年头；从前：今年粮食产量超过～。"],"很久":["暂未释义"],"很多":["暂未释义"],"很好":["比好还好、非常好。"],"很少":["暂未释义"],"得过且过":["过一天算一 天。形容胸无大志，苟且偷安。也指对工作敷衍了事，不负责任。明陶宗仪《辍耕录》卷一五：“寒号 虫…比至深冬严寒之际，毛羽脱落，索然如（kòu）雏，遂自鸣曰：‘得过且过。’” 且：暂 且。"],"心头":["心上；心里：记在～。"],"心愿":["愿望：美好的～。"],"心满意足":["非常满足。"],"心神不定":["定：安定。心里烦躁，精神不安。"],"心领神会":["不用对方明说，心里领悟其中的意思。也指深刻地领会。"],"必备":["必须具备；必须备有：旅游～。～软件。～工具书。"],"必定":["1.表示判断或推论的确凿或必然：他得到信儿，～会来。有全组同志的共同努力，这项任务～能完成。\n2.表示意志的坚决：你放心，后天我～来接你。"],"必然":["1.属性词。事理上确定不移：～趋势。胜利～属于意志坚强的人。\n2.哲学上指不以人们意志为转移的客观发展规律：新事物代替旧事物是历史发展的～。"],"必经之路":["经：经过。一定要经过的道路。亦作“必由之路”。"],"必须":["1.表示事理上和情理上必要；一定要：学习～刻苦钻研。\n2.“必须”的否定是“无须”、“不须”或“不必”。"],"志向":["关于将来要做什么事，要做什么样人的意愿和决心：远大的～。"],"忘却":["忘记：这些沉痛的教训，使人无法～。"],"忘记":["1.经历的事物不再存留在记忆中；不记得：我们不会～，今天的胜利是经过艰苦的斗争得来的。\n2.应该做的或原来准备做的事情因为疏忽而没有做；没有记住：～带笔记本。"],"快乐":["感到幸福或满意：～的微笑。祝您生日～。"],"快慢":["指速度：这艘轮船的～怎么样?"],"快活":["愉快；快乐：提前完成了任务，心里觉得很～。"],"快车":["中途停站较少，全程行车时间较短的火车或汽车（多用于客运）。"],"怎么":["1.询问性质、状况、方式、原因等：这是～回事?。这个问题该～解决?。他～还不回来?\n2.泛指性质、状况或方式：你愿意～办就～办。\n3.虚指性质、状况或方式：不知道～一来就滑倒了。\n4.有一定程度（多用于否定式）：这出戏他刚学，还不～会唱（=不大会唱）。"],"怎奈":["无奈（多见于早期白话）。"],"怎样":["1.询问性质、状况、方式等：那是～的一篇小说?。你们的话剧排得～了?。这两项工作～衔接?\n2.泛指性质、状况或方式：要经常进行回忆对比，想想从前～，再看看现在～。人家～说，你就～做。‖也说怎么样。"],"怎见得":["1.犹言怎么知道，怎么看得出。\n2.犹言且看如何。"],"思想":["1.客观存在反映在人的意识中经过思维活动而产生的结果。思想的内容为社会制度的性质和人们的物质生活条件所决定，在阶级社会中，思想具有明显的阶级性。\n2.念头；想法：她早有去西部地区参加经济建设的～。\n3.思量。"],"性别":["雌雄两性的区别，通常指男女两性的区别。"],"性子":["1.性情；脾气：急～。使～。这匹马的～很烈。\n2.酒、药等的刺激性：这药～平和。"],"性情":["xìng qíng的又音。义同“性情xìng qíng”。"],"性格":["在对人、对事物的态度和行为方式上所表现出来的个性特征，如刚强、懦弱、热情、孤僻等。"],"总之":["表示下文是总括性的话：政治、文化、科学、艺术，～，一切上层建筑都是跟社会的经济基础分不开的。你爱唱歌，我爱下棋，他爱打乒乓球，～，都有个人的爱好。"],"总共":["一共：他家～三口人。我们场里～养了两千多头奶牛。"],"总是":["永远地；无例外地。"],"总纲":["1.总的纲领。\n2.法规、章程中说明总的原则和要点的部分。"],"总结":["1.把一阶段内的工作、学习或思想中的各种经验或情况分析研究，做出有指导性的结论：～工作。～经验。\n2.指总结后概括出来的结论：年终～。工作～。"],"恁的":["见“恁地”。"],"悠久":["年代久远：历史～。～的文化传统。"],"您好":["问候语，与“你好”同义，比“你好”更尊敬，一般用于句首。"],"您家":["“你”的敬称。"],"您老":["对年长或尊贵者的敬称。鲁迅《故事新编·起死》：“咱们的局长这几天就常常提起您老，说您老要上 楚国 发财去了。”"],"悲欢离合":["指人生中经常遇到的悲伤、欢乐、离别、团聚四种境遇。"],"惊人":["使人吃惊：～的消息。～的成就。数字大得～。"],"惊喜":["又惊又喜：～不已。这件事让人感到十分～。"],"惊奇":["觉得很奇怪：～的目光。这里的变化之大，令人～。"],"惊扰":["惊动扰乱：自相～。"],"想入非非":["思想进入虚幻境界，完全脱离实际；胡思乱想。"],"想念":["对景仰的人、离别的人或环境不能忘怀，希望见到：～亲人。他们在国外，时时～着祖国。"],"想法":["〈名〉思考的结果；意见。"],"想着":["1.想起来。后蜀 毛熙震《木兰花》词：“对斜暉，临小閤；前事岂堪重想着。”《二十年目睹之怪现状》第二十回：“我自从前几天受了他那无理取闹吓唬我的话，一向胸中没有好气，想着了就着恼。”\n2.想想，考虑。《儿女英雄传》第三十回：“你我两个，不但我信得及你，我料你也一定信得及我，所以我才合你商量。你想着怎么样？”"],"愁眉苦脸":["形容愁苦的神情。"],"意思":["1.语言文字等的意义；思想内容：“节约”就是不浪费的～。要正确地了解这篇文章的中心～。你这句话是什么～?\n2.意见；愿望：大家的～是一起去。我想跟你合写一篇文章，你是不是也有这个～?\n3.指礼品所代表的心意：这不过是我的一点～，你就收下吧!\n4.指表示一点心意：大家受累了，得买些东西～一下。\n5.某种趋势或苗头：天有点要下雨的～。天气渐渐暖了，树木有点儿发绿的～了。\n6.情趣；趣味：这棵松树长得像座宝塔，真有～。那种聚会～不大，我不想去参加。"],"感人":["感动人：～至深。情节生动～。"],"感动":["1.思想感情受外界事物的影响而激动，引起同情或向慕：看到战士舍身救人的英勇行为，群众深受～。\n2.使感动：他的话～了在座的人。"],"感受":["1.受到（影响）；接受：～风寒。～到集体的温暖。\n2.接触外界事物得到的影响；体会：生活～。看到经济特区全面迅速的发展，～很深。"],"感觉":["1.客观事物的个别特性作用于人的感觉器官时在人脑中的直接反映。包括视觉、听觉、嗅觉、味觉、触觉等。是认识的起点。但它只能反映事物表面的个别的特性，是最简单、最低级的反映形式。\n2.觉得：他～工作还顺利。"],"愿意":["1.认为符合自己心愿而同意。2.希望。"],"愿望":["希望将来能达到某种目的的想法：主观～。他终于实现了上大学的～。"],"戏院":["剧场。"],"成为":["变成：～先进工作者。"],"成员":["集体或家庭的组成人员：家庭～。协会～。"],"成就":["1.事业上的成绩：辉煌～。\n2.完成（某项事业）：～革命大业。"],"我们":["人称代词。称包括自己在内的若干人。见〖咱们〗。"],"或则":["（大多叠用）：天晴的日子，老人家～到城外散步，～到河边钓鱼。"],"或然":["属性词。有可能而不一定：～性。"],"或者":["1.或许：你快走，～还赶得上车。\n2.用在叙述句里，表示选择关系：这本书～你先看，～我先看。\n3.表示等同关系：世界观～宇宙观是人们对整个世界的总的看法。"],"或许":["1.副词。\n2.表示猜测或不能肯定的语气：你听了～会大吃一惊。～他没收到我的信？\n3.委婉地表示肯定：我再重复一下这个问题，对你们来说，～不是无益的。"],"战争":["敌对双方为了一定的政治、经济目的而进行的具有一定规模的武装斗争。是阶级和阶级、民族和民族、国家和国家、政治集团和政治集团之间相互斗争的最高形式，是政治的继续。分正义战争和非正义战争两类。与“和平”相对。"],"战士":["1.军队最基层的成员：解放军～。新入伍的～。\n2.泛指从事某种正义事业或参加某种正义斗争的人：白衣～。无产阶级～。"],"战斗":["1.敌对双方所进行的武装冲突，是达到战争目的的主要手段：一场激烈的～。\n2.同敌方作战：～力。～英雄。同敌人～到底。\n3.泛指斗争：～性。～在抗洪救灾的第一线。"],"战术":["1.进行战斗的原则和方法。\n2.比喻解决局部问题的方法。"],"房檐":["房顶伸出墙外的部分。"],"所以":["1.表示因果关系。a）用在下半句表示结果：我和他在一起工作过，～对他比较熟悉。b）用在上半句主语和谓语之间，提出需要说明原因的事情，下半句说明原因：我～对他比较熟悉，是因为我和他在一起工作过。也说之所以。c）上半句先说明原因，下半句用“是…所以…的原因（缘故）”：我和他在一起工作过，这就是我～对他比较熟悉的原因。d）“所以”单独成句，表示“原因就在这里”：～呀，要不然我怎么这么说呢!\n2.实在的情由或适宜的举动（限用于固定词组中做宾语）：忘其～。不知～。"],"所剩无几":["剩：余留下来的。剩下的没有多少了。"],"所有":["1.领有：矿产资源归国家～。\n2.领有的东西：尽其～。\n3.属性词。一切；全部：把～的力量都贡献给祖国。"],"手下留情":["下手的时候留点情面。比喻处理事情不要太苛刻。"],"手书":["1.亲笔书写：横幅上“天下为公”四个字为孙中山先生～。\n2.亲笔写的信：今天接到了家父的～。"],"手册":["1.汇集常用的基本资料，供手头查考的工具书。有综合性的手册，如《人民手册》；也有专科性的手册，如《医疗卫生手册》。\n2.经常在手头用于记事的本子：工作～。"],"手工":["1.靠手的技能做出的工作：做～。\n2.用手操作的方式：～劳动。这件衣服完全是用～缝制出来的。\n3.给予手工劳动的报酬：～很贵。做这件衣服要多少～?"],"手心":["1.手掌的中心部分。\n2.（～儿）比喻所控制的范围：跳不出他的～。"],"手指":["人手前端的五个分支。"],"手表":["戴在手腕上的表。"],"才干":["办事的能力：增长～。他既年轻，又有～。"],"才能":["知识和能力：施展～。"],"才高八斗":["形容文才非常高。见〖八斗才〗。"],"打扫":["扫除；清理：～院子。～战场。"],"打更":["1.旧时把一夜分做五更，每到一更，巡夜的人打梆子或敲锣报时，叫打更。\n2.巡夜。"],"打球":["1.泛指现今各种用手打的球类运动。通常指篮球、排球、乒乓球、羽毛球等。\n2.打毬：1.我国古代军中用以练武的一种马上打球游戏。亦有徒步打球的。\n3.即蹴鞠。古代的一种踢球游戏。"],"打破":["突破原有的限制、拘束等：～常规。～纪录。～情面。～沉默。"],"打结":["1.在条状物上打疙瘩。\n2.同“打劫”。"],"打鼓":["比喻没有把握，心神不定：能不能完成任务，我心里直～。"],"找出":["暂未释义"],"找寻":["寻找。"],"技工":["有专门技术的工人。"],"技术":["1.人类在认识自然和利用自然的过程中积累起来并在生产劳动中体现出来的经验和知识，也泛指其他操作方面的技巧：钻研～。～先进。\n2.指技术装备：～改造。"],"把盏":["端着酒杯（多用于斟酒敬客）：轮流～，向客人敬酒。"],"把门":["1.把守门户：这里门卫～很严，不能随便进去。这个人说话嘴上缺个～的。\n2.把守球门。"],"把风":["望风。"],"投诉":["公民或单位认为其合法权益遭受侵犯，向有关部门请求依法处理。"],"折断":["因受力过大或过分弯曲而断裂。"],"护士":["医疗机构中担任护理工作的人员。"],"报告":["1.把事情或意见正式告诉上级或群众：你应当把事情的经过向领导～。大会主席～了开会宗旨。\n2.用口头或书面的形式向上级或群众所做的正式陈述：总结～。动员～。"],"报纸":["1.以国内外社会、政治、经济、文化等新闻为主要内容的散页的定期出版物，如日报、晚报等。\n2.纸张的一种，用来印报或一般书刊。也叫白报纸或新闻纸。"],"拉力":["1.拉拽的力量。\n2.物体所承受的拉拽的力。"],"拉它":["方言。闲谈。"],"拉开":["1.用力使双方离开；拖开。2.拖长；拉长。3.用手掀开。4.解开。5.牵引乐器的某一部分使乐器发出声音。6.开始排泄。7.开始闲谈。"],"拉手":["〈名〉安装在门窗或抽屉上便于用手开关的木条或金属物等。"],"拉面":["抻面。"],"拼命":["1.把性命豁出去；以性命相拼：跟歹徒～。\n2.尽最大的力量；极度地：～地工作。～往山顶爬。"],"拿手":["1.（对某种技艺）擅长：～好戏。～节目。画山水画儿他很～。\n2.成功的信心；把握：有～。没～。"],"拿起":["暂未释义"],"持久":["保持长久：肥效～。争取～和平。"],"持家":["操持家务：勤俭～。"],"持笔":["执笔，执笔为文。"],"挂落":["1.〈方〉牵连；连累。\n2.也作挂络。"],"指向":["所对的方位。"],"指手画脚":["形容一边说话一边比画。也形容乱加批评或随意发号施令。"],"指点":["1.指出来使人知道；点明：他～给我看，哪是织女星，哪是牵牛星。大家都朝他～的方向看。老师～我怎样使用电脑。\n2.在旁边挑剔毛病；在背后说人不是：自己不干，还在那里指指点点。"],"指路":["1.犹望尘。\n2.指引道路。"],"挣断":["挣，用力支撑或摆脱。断，长形的东西从中间分开。挣断，使劲将连系的东西分开。"],"捉拿":["捉（犯人）：～凶手。～逃犯。"],"接下来":["《接下来》是孙燕姿新专辑《未完成》中的歌曲，词部分由廖莹如完成，曲部分由李偲菘完成。"],"接受":["1.收取（给予的东西）：～礼品。～捐款。\n2.对事物容纳而不拒绝：～任务。～考验。～教训。虚心～批评。"],"接着":["连着（上面的话）；紧跟着（前面的动作）：我～这个话题讲几句。这本书，你看完了我～看。"],"提供":["供给（意见、资料、物资、条件等）：～经验。～援助。为旅客～方便。"],"提升":["1.提高（职位、等级等）：由副厂长～为厂长。\n2.用卷扬机等向高处运送（矿物、材料等）：～设备。"],"提问":["提出问题来问（多指教师对学生）。"],"提高":["使位置、程度、水平、数量、质量等方面比原来高：～水位。～警惕。～技术。～工作效率。"],"操作":["按照一定的程序和技术要求进行活动或工作：～方法。～规程。"],"操场":["供体育锻炼或军事操练用的场地。"],"收到":["1.接收已经到达的东西。（被动）\n2.搜索到，往往用于电子设备。（主动）\n3.香港电影中的台词，通过对讲机接到指令后的回复。"],"收取":["收下（交来或取来的款项）：～手续费。"],"收回":["1.把发出去或借出去的东西、借出去或用出去的钱取回来：～贷款。～成本。借出的书，应该～了。\n2.撤销；取消（意见、命令等）：～原议。～成命。"],"收留":["把生活困难或有特殊要求的人接收下来并给予帮助：父母死后，一位远房叔叔～了他。"],"放下":["1.放在一边或放弃。\n2.从较高位置降到较低位置。"],"放声":["放开喉咙出声：～痛哭。～大笑。"],"放学":["1.学校里一天或半天课业完毕，学生回家。\n2.指学校里放假。"],"故乡":["出生或长期居住过的地方；家乡；老家。"],"故事":["旧日的制度；例行的事。"],"故人":["1.旧友；老朋友。《礼记·檀 弓下》：“孔子之故人曰原壤。” 唐王维《送元二使安西》诗：“西出阳关无故人。”\n2.旧妻。南朝陈 徐陵《玉台新咏·古诗八首》：“新人工织缣，故人工织素。”\n3.死去的人。\n4.前夫。《玉台新咏·无 名氏〈古诗为焦仲卿妻作〉》：“怅然遥相望，知是故人来。”"],"故土":["故乡：怀念～。～难离。"],"故里":["故乡；老家：荣归～。"],"救命":["援助有生命危险的人：～恩人。治病～。"],"救死扶伤":["抢救生命垂危的人，照顾受伤的人。现泛指医务人员的职责：～，实行革命的人道主义。"],"教室":["学校里进行课堂教学的屋子。"],"教师":["担任教学工作的专业人员：人民～。"],"教材":["根据教学要求而编写或选定的教科书、讲义、讲授提纲等的统称。"],"教育":["1.按一定要求培养人的工作，主要指学校培养人的工作：初等～。高等～。成人～。～方针。\n2.按一定要求培养：教师的责任是～下一代成为德、智、体全面发展的有用人才。\n3.用道理说服人使照着（规则、指示或要求等）做：说服～。～干部要清正廉洁。"],"散步":["随便走走（作为一种休息方式）：休息时，到河边散散步。"],"整个":["属性词。全部：～上午。～会场。～社会。"],"整数":["1.正整数（1，2，3，4，5…）、负整数（-1，-2，-3，-4，-5…）和零的统称。\n2.没有零头的数目，如十、二百、三千、四万。"],"整点":["1.整理和清点：～人马。家具用品都已～清楚。\n2.以小时为单位表示整数的钟点：～报时。～新闻。"],"整理":["使有条理有秩序：～行装。～房间。～账目。～文化遗产。"],"文具":["指笔、墨、纸、砚等用品。"],"文化":["1.人类在社会历史发展过程中所创造的物质财富和精神财富的总和，特指精神财富，如文学、艺术、教育、科学等。\n2.考古学用语，指同一个历史时期的不依分布地点为转移的遗迹、遗物的综合体。同样的工具、用具，同样的制造技术等，是同一种文化的特征，如仰韶文化、龙山文化。\n3.指运用文字的能力及一般知识：学习～。～水平。"],"文学":["社会意识形态之一。是运用虚构和想象，使用语言塑造形象，反映社会生活，表达思想感情的艺术。文学体裁可分为诗歌、小说、散文、戏剧等。"],"文科":["指高等学校所设语言文学、历史、哲学、政治、经济、法律、教育等哲学社会科学方面的系、科、专业。也指中学的政治、语文、历史等科目。"],"斯事体大":["斯：此；体：体制，规模。这件事性质重要，关系重大。"],"斯人":["1.此人。\n2.犹斯民。指人民，百姓。"],"斯文":["指文化或文人。"],"新婚":["刚结婚：～夫妇。"],"新年":["元旦和元旦以后的几天。"],"方便":["1.便利：大开～之门。北京市的交通很～。把～让给别人，把困难留给自己。\n2.使便利；给予便利：～群众。\n3.适宜：这儿说话不～。～的时候，你给我回个电话。\n4.婉辞，跟“手头儿”连用，表示有富裕的钱：手头儿不～。\n5.婉辞，指排泄大小便：车停一会儿，大家可以～～。"],"方向":["1.指东、南、西、北等 2.正对的位置自一点向外引伸的路线 。"],"方式":["说话做事所采取的方法和形式：工作～。批评人要注意～。"],"方面":["相对的或并列的几个人或事物中的一部分叫一个方面：优势是在我们～，不是在敌人～。必须不断提高农业生产～的机械化水平。"],"施与":["以财物周济人；给予（恩惠）。"],"日期":["发生某一事情的确定的年、月、日或时期：发信的～。开会的～是6月21日到27日。"],"日照":["一天中太阳光照射的时间。日照长短随纬度高低和季节而变化，并和云量、云的厚度以及地形有关。夏季我国北方日照长，南方日照短，冬季相反。"],"日记":["每天所遇到的和所做的事情的记录，有的兼记对这些事情的感受：～本。工作～。记～。"],"早上":["时间词。早晨。"],"早已":["1.很早已经；早就：你要的东西，我～给你准备好了。\n2.早先；以前：现在大家用钢笔写字，～都用毛笔。"],"早晚":["1.早晨和晚上：他每天～都练太极拳。\n2.或早或晚：这事瞒不了人，～大家都会知道的。\n3.时候：多～（多咱）。他一清早就走了，这～多半已经到家了。\n4.指将来某个时候：你～上城里来，请到我家里来玩。"],"早饭":["早晨吃的饭。"],"时候":["1.某事发生的时间。\n2.事情、过程或情况经过的时间。\n3.季节；节候。\n4.天气，气候。"],"时常":["常常；经常：～发生。～受到表扬。"],"时间":["1.哲学范畴。物质运动的存在形式。是物质运动过程的持续性和接续的秩序。具有客观性和无限性。是一维的，总是朝着一个方向流逝，一去不复返，用一个量即可完全量度。它和运动着的物质不可分离，和空间也不可分离。\n2.有起点和终点的一段持续过程或这个持续过程中的某一点：地球自转一周的～是二十四小时。现在的～是八点整。"],"昂首":["仰着头：～望天。战马～长鸣。"],"昂首阔步":["仰起头，迈着大步向前。形容精神振奋，意气昂扬。"],"明亮":["1.光线充足：灯光～。打开窗户，屋子就会～些。\n2.发亮的：小姑娘有一双～的眼睛。\n3.明白；清楚：听了这番解释，老张心里～了。"],"明信片":["专供写信用的硬纸片，邮寄时不用信封。也指用明信片写成的信。"],"明天":["1.今天的下一天。\n2.不远的将来：展望美好的～。"],"明年":["时间词。今年的下一年。"],"明月":["1.明亮的月亮。\n2.指夜明珠。"],"星期":["1.我国古代历法把二十八宿按日、月、火、水、木、金、土的次序排列，七日一周，周而复始，称为“七曜”；西洋历法中也有“七日为一周”的说法，跟我国的“七曜”暗合。后来根据国际习惯，把这样连续排列的七天作为工作学习等作息日期的计算单位，叫做星期。\n2.跟“日、一、二、三、四、五、六、几”连用，表示一个星期中的某一天：～日。～三。今天～几?\n3.星期日的简称：～休息。"],"春装":["春季穿的服装。"],"是非":["1.正确的和错误的：明辨～。\n2.口舌；争端：招惹～。搬弄～。"],"暗无天日":["形容社会极端黑暗。"],"暗红":["不太鲜艳的红色。"],"更新":["〈副+形〉性质更好的。"],"更正":["改正已发表的谈话或文章中有关内容或字句上的错误：～启事。那篇讲话要～几个字。"],"曾孙":["孙子的儿子。"],"曾泉":["指多水之地。"],"曾祖父":["祖父的父亲。"],"曾闳":["高大。曾，通“层”。"],"最后":["在时间上或次序上在所有别的之后：～胜利一定属于我们。这是全书的～一章。"],"最多":["暂无解释。"],"最好":["最为适当：你～早点儿出发。这件事你～事先通知他一声。"],"最棒":["最好。"],"朅伽":["犀牛。"],"月光":["月亮的光线，是由太阳光照到月亮上反射出来的。"],"有人":["1.谓有杰出的人物。\n2.谓有靠山。如：朝中有人好做官。\n3.泛指有某人。"],"有关":["1.有关系：～方面。～部门。这些问题都跟哲学～。\n2.涉及到：他研究了历代～水利问题的著作。"],"有力":["有力量；分量重：领导～。～的回击。这篇文章写得简短～。"],"有始有终":["指人做事能坚持到底。"],"有时":["有时候：那里的天气，～冷，～热。"],"有识之士":["有见识的人；有眼光的人。"],"朋友":["1.彼此有交情的人。\n2.指恋爱的对象：姑娘多大了，有～了没有?"],"服从":["遵照；听从：～命令。少数～多数。个人利益～集体利益。"],"朗读":["清晰响亮地把文章念出来：～课文。"],"望而却步":["一看就往后退缩。形容十分害怕困难和危险。"],"朝代":["封建社会一姓帝王世代相传的整个统治时期为一个朝代。如汉朝、唐朝。"],"朝夕相处":["从早到晚都在一起。形容常生活在一起，关系密切。"],"期待":["期望；等待：～着你早日学成归来。"],"木工":["1.制造或修理木器、制造和安装房屋的木制构件的工作：～活。\n2.做这种工作的技术工人：请～来修理。"],"未婚":["还没有结婚。"],"未必":["不一定：他～知道。这消息～可靠。"],"未来":["1.属性词。就要到来的（指时间）：～二十四小时内将有暴雨。\n2.时间词。现在以后的时间；将来的光景：展望～。"],"未果":["没有实现；未成事实。"],"未然":["还没有成为事实：防患于～。"],"本领":["技能；能力：有～。～高强。"],"机不可失":["机：机会；时：时机。好的时机不可放过，失掉了不会再来。"],"杂志":["1.刊物：报章～。\n2.零碎的笔记（多用于书名）。"],"条件":["1.影响事物发生、存在或发展的因素：自然～。创造有利～。\n2.为某事而提出的要求或定出的标准：讲～。他的～太高，我无法答应。\n3.状况：他身体～很好。这个工厂～好，工人素质高，设备也先进。"],"条纹":["条状的花纹：斑马身上有～。"],"来不及":["因时间短促，无法顾到或赶上：还有一个钟头就开车，～看他去了。"],"来去":["1.往返：～共用了两天时间。\n2.到来或离去：～自由。"],"来往":["〈动〉交际往来。"],"极光":["在高纬度地区，高空中出现的一种光的现象。由太阳发出的高速带电粒子进入两极附近，激发高空大气中的原子和分子而引起。通常呈弧状、带状、幕状或放射状，微弱时白色，明亮时黄绿色，有时还有红、灰、紫、蓝等颜色。"],"极力":["用尽一切力量；想尽一切办法：～抢救伤员。～克服困难。"],"极小":["1.可能达到最小的。\n2.极小值。"],"极端":["1.事物顺着某个发展方向达到的顶点：看问题要全面，不要走～。\n2.表示程度极深：～苦恼。～困难。\n3.绝对；偏激：这种观点太～。"],"林木":["1.树林。\n2.生长在森林中的树木。"],"林立":["像树林一样密集地竖立着，形容很多：高楼～。帆樯～。郊区工厂～。"],"果子":["同“馃子”。"],"果实":["1.植物体的一部分，花受精后，子房逐渐长大，成为果实。可分为真果、假果，也可分为单果、复果、聚合果。有些果实可供食用。\n2.比喻经过斗争或劳动得到的胜利品或收获：劳动～。"],"枝条":["枝子。"],"查找":["查；寻找：～资料。～失主。～原因。"],"标志":["1.表明特征的记号：地图上有各种形式的～。这篇作品是作者在创作上日趋成熟的～。\n2.表明某种特征：这条生产线的建成投产，～着工厂的生产能力提高到了一个新的水平。"],"树干":["树木的主体部分。"],"树林":["成片生长的许多树木，比森林小。"],"样品":["作为同类物品的标准或代表的物品（多用于商品推销或材料试验）：服装～。～测试。"],"样子":["1.形状：这件衣服～很好看。\n2.人的模样或神情：小姑娘的～真爱人儿。高高兴兴的～。\n3.作为标准或代表，供人看或模仿的事物：鞋～。就照这个～做。\n4.形势；情势：天要下雨的～。看～今天观众要超过三千人。"],"样式":["式样；形式：～美观。别墅～新颖。"],"格外":["1.表示超过寻常：久别重逢，大家～亲热。国庆节的天安门，显得～庄严而美丽。\n2.额外；另外：卡车装不下，～找了一辆大车。"],"格斗":["紧张激烈地搏斗：白刃～。"],"楼房":["两层或两层以上的房子。"],"模式":["某种事物的标准形式或使人可以照着做的标准样式：～图。～化。"],"次第":["1.排列的顺序。\n2.挨个；依次：～入场。"],"欢乐":["快乐（多指集体的）：广场上～的歌声此起彼伏。"],"欢呼":["欢乐地呼喊：热烈～。～ 材。～餐盒。"],"现在":["时间词。这个时候，指说话的时候，有时包括说话前后或长或短的一段时间（区别于“过去、将来”）：他～的情况怎么样?。～他当了厂长了。"],"现金":["1.现款，有时也包括可以提取现款的支票等：～交易。\n2.银行库存的货币。"],"理发":["剪短并修整头发：～师。我去理个发。"],"理由":["事情为什么这样做或那样做的道理：～充足。毫无～。"],"理科":["指高等学校所设自然科学中有关基础理论的系、科、专业。也指中学的数学、物理、化学等科目。"],"瑜伽":["印度教徒实现解脱的修习方法。认为瑜伽是个人灵魂（小我）与宇宙灵魂（大我）结合化一的手段。其根本经典为《瑜伽经》，主要有八种修持方法。"],"瑜珈":["同“瑜伽”。"],"生产":["1.指劳动者与生产资料相结合创造物质产品：发展～。\n2.生孩子：她快要～了，赶紧送医院。"],"生命":["由核酸和蛋白质等物质组成的生物体呈现的生理过程。新陈代谢和自我复制是最基本的生命现象。随着生物的进化，生命现象愈加复杂，主要包括应激性、璀长、发育、遗传、变异、运动、调节等。"],"生活":["1.人或生物为了生存和发展而进行的各种活动：政治～。日常～。观察蜜蜂和蚂蚁的～。\n2.进行各种活动：老人一直和儿孙们～在一起。\n3.生存：一个人脱离了社会就不能～下去。\n4.衣、食、住、行等方面的情况：人民的～不断提高。\n5.活儿（主要指工业、农业、手工业方面的）：做～。～忙。"],"用茶":["饮茶，喝茶。如：请先生用茶。"],"田间":["田地里，有时借指农村：～劳动。来自～。"],"由于":["1.表示原因或理由：～老师傅的耐心教导，他很快就掌握了这门技术。\n2.表示原因，多与“所以”、“因此”等配合：～他工作成绩显著，因此受到了领导的表扬。"],"由来":["1.从发生到现在的一段时间：～已久。\n2.事物发生的原因；来源：查清这次火警的～。"],"申请":["向上级或有关部门说明理由，提出请求：～书。～助学贷款。"],"男儿":["男子汉：好～志在四方。"],"男孩":["从出生到青春期的男性。"],"男生":["1.男学生。\n2.男青年；小伙子。"],"画像":["1.画人像：给他画个像。\n2.画成的人像：一幅鲁迅先生的～。"],"界面":["1.不同物体之间的接触面。\n2.用户界面的简称。"],"留下":["1.谓把东西搁下。宋 无名氏《张协状元》戏文第八出：“你要好时，留下金珠买路，我便饶你去。”《水浒传》第四三回：“你留下买路钱并包裹，便饶了你性命。”\n2.留住下来。《儿女英雄传》第一回：“﹝这房子﹞原备 安老爷、太太、公子有事进城住的，平日自有留下的人家看守。”\n3.收受下来。《二十年目睹之怪现状》第二四回：“﹝ 何小宋 ﹞又逼着他把满城文武所送的礼都一一退了，不许留下一份。”老舍《骆驼祥子》七：“他们找出些破旧的东西，教他去换洋火……而他也就自己留下。”\n4.指付钱买下。老舍《骆驼祥子》三：“留下吧，给多少是多少；我把它们出了手，好到城里去谋生！”\n5.停留而攻下。《史记·吴王濞列传》：“即大王徐行，留下城邑，汉 军车骑至，驰入 梁 楚 之郊，事败矣。”"],"留学":["留居外国学习或研究：～生。～美国。早年他到欧洲留过学。"],"百万":["一百万，泛指数目巨大：雄兵～。～富翁。"],"百倍":["数量词。形容数量多或程度深（多用于抽象事物）：～努力。精神～。"],"百发百中":["射箭、打枪、打炮等每次都能打中目标。《史记·周本纪》：“楚有养由基者，善射者也。去柳叶百步而射之，百发而百中之。” 后也用来形容料事有充分把握。中（zhòng）。"],"百年":["1.指很多年或很长时期：～大业。～不遇。\n2.人的一生；终身：～好合（新婚颂词）。～之后（婉辞，指死亡）。"],"百战百胜":["每战必胜。形容所向无敌。《孙子兵法·谋攻》：“百战百胜，非善之善者也；不战而屈人之兵，善之善者也。”"],"百科":["各种学科的总称：～知识。～全书。"],"百花齐放":["1.比喻不同形式和风格的各种艺术作品自由发展。\n2.形容艺术界的繁荣景象。"],"的颡":["白额。"],"盐巴":["食盐。"],"盛情难却":["浓厚的情意难以推辞。"],"目光":["1.指视线：大家都把～集中在他身上。\n2.眼睛的神态：～炯炯（明亮）。\n3.眼光；见识：～敏锐。"],"直到":["一直到（多指时间）：这事～今天我才知道。"],"直尺":["一种画直线用的尺。"],"直立":["笔直地站着或竖着。"],"相与":["1.彼此往来；相处：这人是很难～的。\n2.相互：～议论。\n3.旧时指相好的人。"],"相互":["1.互相：～作用。～促进。\n2.属性词。两相对待的：～关系。"],"相交":["1.同一平面内的两条直线如果不重合，只有一个公共点，就说它们相交。\n2.相互交往；做朋友：～多年。"],"相似":["相像：这两个人年貌～。"],"相信":["认为正确或确实而不怀疑：我～他们的试验一定会成功。"],"相像":["彼此有相同点或共同点：面貌～。"],"相关":["彼此关联：休戚～。体育事业和人民健康密切～。"],"相处":["彼此生活在一起；彼此接触来往，互相对待：友好～。难以～。"],"相近":["1.近似；差不多：年岁～。情况～。\n2.彼此距离近：住所～。"],"相遇":["遇见，遇到。"],"眉目":["事情的头绪：把事情弄出点～再走。"],"看你":["一种地方性语言，有埋怨的意思。"],"看着":["1.眼看着。谓转瞬间。唐 张籍《惜别》诗：“看着春又晚，莫轻少年时。”\n2.酌情；看情形。严恭《开演之前》：“那么 老王 你看着办吧，能马虎就马虎吧。”《新华文摘》1981年第12期：“你大哥不在家，我拉着孩子下三辈，你看着处治吧！我没法过啦！”"],"看见":["〈动〉看到。"],"真实":["跟客观事实相符合；不假：～情况。～的感情。"],"真正":["1.属性词。实质跟名义完全相符：群众是～的英雄。～的吉林人参。\n2.的的确确；确实：这东西～好吃。"],"真的":["确实；可靠。"],"真知":["正确的认识：～灼见。一切～都是从直接经验发源的。"],"眼目":["1.指眼睛：强烈的灯光炫人～。\n2.为人暗中察看情况并通风报信的人：安插～。"],"知名度":["指某人或某事物被社会、公众知道熟悉的程度：他是个～很高的人。"],"知己":["1.彼此相互了解而情谊深切：～话。～的朋友。\n2.彼此相互了解而情谊深切的人：海内存～，天涯若比邻。"],"知心":["彼此相互了解、情谊深切的：～朋友。～话。"],"知识":["1.人们通过阶级斗争、生产斗争和科学实验的实践活动获得的对客观事物的认识。\n2.指有关学术文化的：～分子。"],"知道":["〈动〉对事情或道理已经了解、认识；懂得。"],"示意":["用表情、动作、含蓄的话或图形表示意思：以目～。老师指了指门，～他把门关上。"],"礼让":["礼貌地谦让：互相～。在人行横道处，机动车应～行人。"],"祖国":["称自己的国家。"],"祝福":["1.原指祈求上帝赐福，后来指祝人平安和幸福：～你一路平安。请接受我诚恳的～。\n2.我国某些地区的旧俗，除夕祭祀天地，祈求赐福。"],"神仙":["1.神话传说中的有超人的能力，可以超脱尘世，长生不老的人物。2.比喻能预料或猜透事情的人。3.比喻逍遥自在、毫无拘束牵挂的人。"],"神奇":["非常奇妙的。"],"神色":["神情：～匆忙。～自若。"],"神话":["1.古代先民用拟人化的超自然的形象和虚幻的表达方式反映对自然现象和社会现象认识的一种文学样式。一定程度上表达出古代先民对自然力的斗争和对理想的追求。\n2.虚妄离奇、毫无根据的话。"],"福分":["福气：有～。～不浅。"],"福气":["指享受幸福生活的命运：有～。～大。"],"离开":["跟人、物或地方分开：离得开。离不开。鱼～了水就不能活。他已经～北京了。"],"秀丽":["清秀美丽：容貌～。～的桂林山水。"],"私下":["1.背地里；不公开的场合：～商议。这种事只能在～谈，不能在会上讲。\n2.自己进行，不通过有关部门或公众：～调解。‖也说私下里。"],"私有":["私人所有：财产～。"],"秋千":["运动和游戏用具，在木架或铁架上系两根长绳，下面拴上一块板子。人在板上利用脚蹬板的力量在空中前后摆动。"],"种子":["1.显花植物所特有的器官，是由完成了受精过程的胚珠发育而成的，通常包括种皮、胚和胚乳三部分。种子在一定条件下能萌发成新的植物体。革命的～。\n2.比赛中，进行分组淘汰赛时，被安排在各组里的实力较强的运动员叫做种子。同样，以队为单位参加比赛时，被安排在各组的实力较强的队，叫做种子队。"],"种类":["根据事物本身的性质或特点而分成的门类：花的～很多。"],"科学":["1.关于自然界、社会和思维发展规律的知识体系。是在人们社会实践的基础上产生和发展的，是实践经验的总结。分自然科学和社会科学两大类，哲学是二者的概括和总结。\n2.合乎科学的：这种方法很～。"],"科文":["法令条文。"],"称赞":["用言语表达对人或事物的优点的喜爱：他做了好事，受到老师的～。"],"称重":["1.称许看重。宋 许顗《彦周诗话》：“先伯父 治平 四年举进士第一，少从 丁寳臣，以文字为 欧阳文忠公、王岐公 所称重。”明 沉榜《宛署杂记·人物》：“尝荐用里人 霍原 及 申理、张华，为时所称重。”\n2.指受到称许看重。《新唐书·张巡传》：“﹝ 巡 ﹞ 开元 末，擢进士第，时兄 晓 已位监察御史，皆以名称重一时。”"],"稻米":["稻谷的米粒。"],"空中":["1.天空中：～飘着白云。\n2.属性词。指通过无线电信号传播而形成的：～信箱。～书场。"],"空格":["指文中缺字的空白处。或因表敬而空格书写。清 平步青《霞外攟屑·论文下·跳出》：“唐 开元 二十九年，石壁寺《铁弥勒像颂》‘我皇’，‘我’字空格。”"],"空空如也":["空空的什么也没有（语出《论语·子罕》）：有些人喜欢夸夸其谈，其实肚子里却是～。"],"空间":["哲学范畴。物质运动的存在形式。是物质存在的广延性和并存的秩序。具有客观性和无限性。是三维的，任何物体都有长、宽、高，同其他物体的位置关系只能是上下、左右、前后，用三个量可完全量度。它和运动着的物质不可分离，和时间也不可分离。"],"窃窃私语":["暗地里小声说话。唐白居易《琵琶行》：“小弦切切（同“窃窃”）如私语”。"],"立刻":["表示紧接着某个时候；马上：请大家～到会议室去。同学们听到这句话，～鼓起掌来。"],"立时":["立刻：他～醒悟过来。剧团一到，～就来了许多的人。"],"立正":["军事或体操口令，命令队伍（也可以是一个人）在原地站好。"],"站住":["1.（人马车辆等）停止行动：听到有人喊他，他连忙～了。\n2.站稳（多就能不能说，下同）：他病刚好，腿很软，站不住。\n3.在某个地方待下去。\n4.（理由等）成立：这个论点实在站不住。\n5.（颜色、油漆等）附着而不掉：墙面太光，抹的灰站不住。"],"站岗":["站在岗位上，执行守卫、警戒任务。"],"站立":["站1：他默默地～在烈士墓前。中国人民～起来了。"],"竹林":["竹子林。"],"笑容":["含笑的神情：满面～。"],"笑脸":["含笑的面容：赔～。～相迎。"],"第一":["1.排在最前面的：他考了～名。\n2.比喻最重要：百年大计，质量～。"],"第二":[""],"等会儿":["见“等忽儿”。"],"等候":["等待（多用于具体的对象）：～命令。～远方归来的亲人。"],"等待":["不采取行动，直到所期望的人、事物或情况出现：～时机。"],"答对":["回答别人的问话：～得体。我叫他问得没法～。"],"答谢":["受了别人的好处或招待，表示谢意：～宴会。我们简直不知道怎样～你们的热情招待。"],"管制":["1.强制管理：～灯火。\n2.对犯罪分子不实行关押，但限制其一定的自由，受公安机关管束和人民群众监督，在原单位或居住地进行改造的刑罚。是中国特有的刑种。期限为3个月以上2年以下。"],"管家":["1.旧时称呼为地主、官僚等管理家产和日常事务的地位较高的仆人：女～。\n2.现在指为集体管理财物或日常生活的人：大家都说食堂管理员是群众的好～。"],"管理":["1.指一定组织中的管理者，通过实施计划、组织、人员配备、指导与领导、控制等职能来协调他人的活动，使别人与自己一起实现既定目标的活动过程。\n2.照管并约束：～罪犯。"],"管账":["见“管帐”。"],"篮球":["1.球类运动项目之一。在长方形场地（长28米、宽15米）上进行，每队上场5人，以投球入对方篮筐为得分。\n2.篮球运动使用的球。空心，多用牛皮做壳，橡胶做胆。"],"米饭":["用大米或小米做成的饭。特指用大米做成的饭。"],"类别":["不同的种类；按种类的不同而做出的区别：这一章讨论土壤的～。～一栏中填写商品种类的名称。"],"精准":["非常准确；精确：8号选手的远投～。"],"精品":["精良的物品；上乘的作品：艺术～。"],"精彩":["1.（表演、展览、言论、文章等）优美；出色：晚会的节目很～。在大会上，很多代表做了～的发言。\n2.神采；精神。"],"精忠报国":["为国家竭尽忠诚，牺牲一切。"],"精神":["1.指意识、思维、神志等 2.指内容的实质所在;主要的意义"],"精英":["1.精华\n2.出类拔萃的人：象棋～。当代青年的～。"],"糯米":["糯稻碾出的米，可以做糕点，也可以酿酒。也叫江米。"],"系列":["指相互关联的成组成套的事物或现象：一～的问题。"],"系统":["1.生物体内由多种器官联合组成的结构。这些器官在组织形态上有相似的特征，在机能上完成一种连续性的生理作用。如心脏、动脉、静脉、毛细血管等器官构成循环系统，共同完成血液循环的生理机能。\n2.同类事物按一定的关系联合起来，成为一个有组织的整体：组织～。灌溉～。\n3.有条理地；连贯地：～学习马克思主义理论。"],"紧紧":["1.密切注意。\n2.牢固地。"],"紧邻":["紧挨着的邻居。"],"紧锣密鼓":["锣鼓点敲得很密，比喻正式或公开活动前的紧张的舆论准备。"],"红军":["1.第二次国内革命战争时期中国共产党领导下的革命军队，全称中国工农红军。见〖中国工农红军〗。\n2.指1946年以前的苏联军队。"],"红包":["包着钱的红纸包儿，用于馈赠或奖励等：送～。发～。"],"红色":["1.红的颜色。\n2.属性词。象征革命或政治觉悟高：～政权。～根据地。"],"红领巾":["1.中国少年先锋队队员佩带的标志。它以三角形的红色领巾象征革命红旗的一角，意味着这是用革命烈士的鲜血染成的。\n2.指少先队员。"],"约定":["经过商量而确定：大家～明天在公园会面。"],"约数":["1.大约的数目。\n2.一个数能够整除另一数，这个数就是另一数的约数。如2，3，4，6都能整除12，因此2，3，4，6都是12的约数。也叫因数。"],"纪事":["1.记录事实：～诗。\n2.记载某些事迹、史实的文字（多用于书名）：《唐诗～》。"],"纪念":["1.用事物或行动对人或事表示怀念：用实际行动～先烈。\n2.纪念品：这张照片给你做个～吧。"],"纪念碑":["为纪念某种重大事件和功绩或纪念烈士而修建的石碑：人民英雄～。"],"细流":["小溪，小水流。"],"终于":["表示经过种种变化或等待之后出现的情况：试验～成功了。身体～强壮起来。她多次想说，但～没说出口。"],"终点":["1.一段路程结束的地方：～站。\n2.特指径赛中终止的地点：马拉松赛跑的～设在工人体育场。"],"终生":["一生：奋斗～。～难忘。"],"经常":["1.属性词。平常；日常：～费用。积肥是农业生产中的～工作。\n2.常常；时常：他俩～保持联系。要～注意环境卫生。"],"结发夫妻":["指男女成年后第一次结婚的原配夫妻。汉苏武《诗四首》之三：“结发为夫妻，恩爱两不疑。” 结发：束发，指初成年。"],"结婚":["男女双方按照法律规定的条件和程序，确立夫妻关系的法律行为。必须完全自愿，禁止任何人强迫和干涉。"],"结尾":["1.结束事情的最后一段；收尾：文章该～了。\n2.结束的阶段：～工程。文章的～写得很精彩。"],"结束":["1.发展或进行到最后阶段，不再继续：秋收快要～了。代表团～了对北京的访问。\n2.装束；打扮（多见于早期白话）。"],"给力":["1.给予力量；给予支持。\n2.出力；尽力。\n3.带劲儿。\n4.作为感叹词，类似于“牛”、“很带劲”、“酷”。"],"绝句":["近体诗的一种。全首四句。每句五言的叫五言绝句，七言的叫七言绝句。字的平仄和句末押韵都有一定的规则。"],"绝妙":["极美妙；极巧妙：～的音乐。～的讽刺。"],"绝对":["1.没有任何条件的；不受任何限制的（跟“相对”相对）：～真理。～服从。反对～平均主义。\n2.属性词。只以某一条件为根据，不管其他条件的：～值。～温度。～高度。\n3.完全；一定：～正确。这些我都检查过，～没有错儿。\n4.最；极：我们的同志～大多数都是好同志。"],"统一":["1.部分联成整体；分歧归于一致：～体。～祖国。大家的意见逐渐～了。\n2.一致的；整体的；单一的：～的意见。～调配。～领导。"],"统称":["1.总起来叫：枪弹、炮弹等～为弹药。\n2.总的名称：粮食是供食用的谷物、豆类和薯类的～。"],"统统":["通通：那些事情～由你负责。"],"统计":["1.指对某一现象有关的数据的搜集、整理、计算和分析等。也指获得的统计资料。\n2.总括地计算：把人数～一下。"],"维修":["保护和修理：～房屋。机器～得好，使用年限就能延长。"],"维护":["保全、保护，使免于遭到破坏：～革命纪律。～集体利益。"],"维持":["1.使继续存在下去；保持：～秩序。～生活。～现状。\n2.保护；维护支持：亏他暗中～，才得以平安无事。"],"维系":["维持并联系，使不涣散：～人心。"],"缓慢":["不迅速；慢：行动～。"],"罪该万死":["尤死：处一万次死刑。形容罪恶极大。"],"美丽":["使人看了产生快感的；好看：～的花朵。祖国的山河是多么庄严～!"],"美化":["加以装饰或点缀，使显得美观或美好：～环境。不能～帝国主义的侵略行径。"],"美好":["好（多用于生活、前途、愿望等抽象事物）：～的愿望。～的未来。"],"美妙":["美好，奇妙：～的歌喉。～的诗句。"],"美容":["使容貌美丽：～院。～手术。"],"美术":["也叫造型艺术、视觉艺术。艺术门类之一。用一定的物质材料塑造可视的平面或立体空间形象，主要包括绘画、雕塑、工艺美术、建筑艺术等。"],"美言":["1.在第三者面前有意说某人好话：请你～几句。\n2.美好的言辞。"],"老人":["1.恒星名，即老人星。2.用于“月下老人”。传说中的专管人间婚姻的神仙。"],"老妇人":["暂未释义"],"老师":["对教师的尊称，泛指传授文化、技术的人或在某方面值得学习的人。"],"老年":["六七十岁以上的年纪。"],"老弟":["称比自己年纪小的男性朋友。"],"老板":["1.私营工商业的财产所有者；掌柜的。\n2.旧时对著名戏曲演员或组织戏班的戏曲演员的尊称。"],"老爸":["⒈对父亲的昵称，常用于子女撒娇时对父亲的称呼；⒉对老年父亲的敬称；⒊同“老父”；⒋孩子叫爸爸的同义词。"],"者番":["这番；这次。宋 晏几道《少年游》词之三：“细想从来，断肠多处，不与者番同。”《儿女英雄传》第十五回：“何用《汉书》来下酒？者番清话也消愁。”姚光《饯春》诗：“者番花事匆匆甚，回首天涯又緑阴。”"],"而且":["表示进一步，前面往往有“不但、不仅”等跟它呼应：性情温顺～心地善良。他不仅会开汽车，～还会修理。不但战胜了各种灾害，～获得了丰收。"],"而已":["罢了：如此～，岂有他哉。我只不过是说说～，你不必过于认真。"],"而是":["连词，通常与“不是”连用，构成“不是……而是”的关联词，表示并列关系。"],"耳目":["1.耳朵和眼睛：掩人～（比喻以假象蒙骗别人）。\n2.指见闻：～所及。～一新。～不广。\n3.指替人刺探消息的人：～众多。"],"联系":["1.联络；接上关系。\n2.也叫普遍联系。哲学范畴。指事物或现象之间的相互依赖、相互制约、相互渗透、相互转化的关系。联系是有条件的、客观的、普遍的，又是多样的、复杂的。"],"胆大":["暂未释义"],"能力":["能胜任某项任务的主观条件：～强。他经验丰富，有～担当这项工作。"],"能够":["1.表示具备某种能力，或达到某种程度：人类～创造工具。他～独立工作了。\n2.表示有条件或情理上许可：下游～行驶轮船。明天的晚会家属也～参加。"],"能说会道":["指善于用言辞表达，很会说话。"],"脸庞":["脸盘儿：鸭蛋形～。"],"自动":["1.自己主动：～参加。～帮忙。\n2.不凭借人为的力量：～燃烧。水～地往下流。\n3.属性词。不用人力而用机械装置直接操作的：～化。～控制。～装置。"],"自大":["自以为了不起：自高～。骄傲～。"],"自始至终":["从开始到结束：大会～充满着团结欢乐的气氛。"],"自己":["1.复指前头的名词或代词（多强调不由于外力）：～动手，丰衣足食。鞋我～去买吧。瓶子不会～倒下来，准是有人碰了它。这种新型客机是我国～制造的。\n2.指说话者本人这方面（用在名词前面，表示关系密切）：～人。～弟兄。"],"自由":["1.不受拘束；不受限制：～发言。\n2.政治上指在法律规定的范围内进行政治、经济、文化等活动的权利。\n3.哲学范畴。指人们在认识客观规律的基础上，自觉地支配自己和改造世界，不再处于盲目地受客观规律支配的地位。"],"自私":["只顾自己的利益，不顾别人。"],"自立":["不依赖别人，靠自己的劳动而生活：～谋生。孩子小，在经济上还不能～。"],"自觉":["1.自己感觉到：肺结核的初期，病症不很显著，病人常常不～。\n2.自己有所认识而觉悟：～自愿。～地遵守纪律。"],"船只":["船（总称）：捕捞队有大小～二十艘。"],"节日":["纪念日，如五一国际劳动节等。\n传统的庆祝或祭祀的日子，如清明节、中秋节等。"],"节气":["（名）根据太阳的位置，在一年的时间中定出二十四个点，每一点叫一个节气，如立春、夏至、秋分、大雪等。通常也指每一点所在的那一天。"],"节目":["文艺演出或广播电台、电视台播送的项目：～单。文艺～。今天晚会的～很精彩。"],"节约":["节省（多用于较大的范围）：增产～。～时间。"],"花样":["1.花纹的式样，泛指各种式样或种类：～繁多。～翻新。\n2.绣花用的底样，多用纸剪成或刻成。\n3.花招：玩～。这又是他闹的什么新～。"],"英雄":["1.有抱负、不畏艰险强暴，为民族或先进阶级的利益作出重大贡献的杰出人物：民族～。人民～永垂不朽。劳动～。\n2.旧指勇武过人的人：～好汉。\n3.具有英雄品质的：～的人民。"],"苹果":["〔苹果〕落叶乔木。叶互生，叶片有齿。是中国北方重要果树之一。也指这种植物的果实。品种很多，如国光、红玉、富士等。"],"草房":["用茅草、稻草或其他干草盖的房子。"],"药品":["药物和化学试剂的统称。"],"落下":["1.掉下；下降。2.落实；停留下。3.遗留下。"],"落花流水":["形容暮春衰败的景色。宋赵长卿《鹧鸪天·送春》词：“落花流水一春休。” 后常用“落花流水”来比喻被打得大败：敌人被打得～。"],"落英":["1.落下的花：～缤纷。\n2.初开的花。"],"蒲公英":["1.多年生草本植物，全株含白色乳状汁液，叶子倒披针形，羽状分裂，花黄色，结瘦果，褐色，有白色软毛。根状茎入药。\n2.这种植物的花。"],"虚位以待":["留着位置等候。也说虚席以待。"],"虚实":["虚和实，泛指实际情况或内部情况：探听～。～莫测。不了解～。"],"虽则":["连词。虽然：我们～多费了几天工夫，但是学了不少东西。"],"虽然":["连词。用在上半句，表示让步，下半句说出正面意思，常用“可是”“但是”“却是”等词呼应：这次试验～没有成功，可是得到了不少经验教训。"],"虽说":["虽然：～是开玩笑，也该有个分寸。"],"虽败犹荣":["虽然失败了，但还是非常光荣的意思。"],"蜂房":["蜜蜂用分泌的蜂蜡造成的六角形的巢，是蜜蜂产卵和储藏蜂蜜的地方。"],"行为":["受思想支配而表现出来的活动：～不端。揭露不法～。"],"行走":["1.行路；走动。\n2.清代把不设专官的机构或非专任的官职称为行走（如章京上行走，军机处上行走），北洋军阀统治时期，把额外派遣的官职称为行走，不属正式编制。"],"衣服":["穿在身上遮蔽身体和御寒的东西。"],"衣装":["1.衣服装束。\n2.衣服和行李。"],"表演":["1.戏剧、电影、音乐、舞蹈、曲艺、杂技等演员把情节、人物或技艺表现出来。\n2.各种技术、技巧的显示。"],"表示":["1.用言语行为显出某种思想、感情、态度等：～关怀。大家鼓掌～欢迎。\n2.事物本身显出某种意义或者凭借某种事物显出某种意义：海上红色的灯光～那儿有浅滩或礁石。\n3.显出思想感情的言语、动作或神情：老师很喜欢他的直爽，但脸上并没露出赞许的～。"],"表达":["表示（思想、感情）：感激之情，难以～。提高学生的口头～能力。"],"表里如一":["说话、行动和心里所想的完全一致。"],"表面":["1.物体跟外界接触的部分：地球～。桌子～的油漆锃亮。\n2.外在的现象或非本质的部分：他～上很镇静，内心却十分紧张。"],"装模作样":["故作姿态，故意装作了不起的样子。"],"要好":["1.指感情融洽；也指对人表示好感，愿意亲近：她们两人从小就很～。\n2.努力求好；要求上进：这孩子很～，从来不肯无故耽误功课。"],"要点":["1.讲话或文章等的主要内容：摘录～。抓住～。\n2.重要的据点：战略～。"],"见地":["对事物的认识和主张：很有～。"],"见面":["彼此对面相见：跟这位老战友多年没～了。思想～。"],"观光":["参观外国或外地的景物、建设等：～客。有不少外宾前来桂林～。他陪同我们在上海各处～了一番。"],"观看":["特意地看；参观；观察：～景物。～动静。～足球比赛。"],"视察":["1.上级人员到下级机构检查工作。\n2.察看：～地形。"],"视死如归":["把死看得好像回家一样。形容为了正义的事业，不怕死。《吕氏春秋·勿躬》：“三军之士，视死如归。” 归：回家。"],"觉得":["1.产生某种感觉：游兴很浓，一点也不～疲倦。\n2.认为（语气较不肯定）：我～应该先跟他商量一下。"],"解冻":["1.冰冻的江河、土地融化：一到春天，江河都～了。拖拉机翻耕～的土地。两国关系开始～。\n2.解除对资金等的冻结。"],"解开":["〈动〉懂得；明白。"],"解渴":["消除渴的感觉：热天喝酸梅汤最～。喝杯茶解解渴。张老师的辅导课，分析问题鞭辟入里，很～。"],"解闷":["排除烦闷：闲着没事，看小说解解闷儿。"],"计划":["1.工作或行动以前预先拟定的具体内容和步骤：科研～。五年～。\n2.做计划：先～一下再动手。"],"计算":["1.根据已知数通过数学方法求得未知数：～人数。～产值。\n2.考虑；筹划：做事要先～一下，不能干到哪儿算哪儿。\n3.暗中谋划损害别人：当心被小人～。"],"计谋":["计策；策略：有～。"],"认真":["1.信以为真；当真：人家说着玩儿，你怎么就认起真来了?\n2.严肃对待，不马虎：～学习。工作～。认认真真去做。"],"认识":["1.能够确定某一人或事物是这个人或事物而不是别的：我～他。他不～这种草药。\n2.指人的头脑对客观世界的反映：感性～。理性～。"],"让开":["让出进入或穿过的径道。"],"让路":["给对方让开道路。各项工作都要为中心工作～。"],"记住":["留在记忆中。"],"记者":["报社、通讯社、广播电台、电视台等新闻机构中担任采访、新闻写作、摄影的专业人员。"],"讲故事":["故事的述讲。"],"讲理":["1.评是非曲直：咱们跟他～去。\n2.遵从道理：蛮不～。他是个～的人。"],"讲解":["解释；解说：～员。他指着模型给大家～。"],"讲课":["讲授功课：他在我们学校～。上午讲了三堂课。"],"识别":["辨别；辨认：～真伪。"],"识字":["认识文字：读书～。注音～。～课本。"],"识相":["会看别人的神色行事；知趣：我劝你～点，别自讨没趣。"],"诉说":["带感情地陈述：他在信里～着对地质工作的热爱。"],"话语":["言语；说的话：天真的～。他～不多，可句句中听。"],"该当":["应当：大伙儿的事，我～出力。"],"语文":["1.语言和文字：国家～政策。\n2.语言和文学：～课本。\n3.口语和书面语的理解和表达：～水平。～能力。"],"说大话":["1.夸口说话或言过其实地说话。\n2.见吹牛。"],"请安":["1.问安。\n2.打千儿。"],"请求":["1.说明要求，希望得到满足：～援助。他～上级给他最艰巨的任务。\n2.所提出的要求：领导上接受了他的～。"],"请示":["（向上级）请求指示：这件事须～上级后才能决定。"],"请问":["敬辞，用于请求对方回答问题：～这个字怎么读?"],"读书":["1.看着书本，出声地或不出声地读：～声。～笔记。读了一遍书。\n2.指学习功课：他～很用功。\n3.指上学：妈妈去世那年，我还在～。他在那个中学读过一年书。"],"谈天":["闲谈。"],"谈话":["1.两个人或许多人在一起说话：他们正在屋里～。\n2.用谈话的形式发表的意见（多为政治性的）。"],"质量":["1.表示物体惯性大小的物理量。数值上等于物体所受外力和它获得的加速度的比值。有时也指物体中所含物质的量。质量是常量，不因高度或纬度变化而改变。\n2.产品或工作的优劣程度：工程～。教学～。这布～好，又好看，又耐穿。"],"购买":["买：～年货。"],"赞美":["称赞；颂扬：～金色的秋景。助人为乐的精神受到人们的～。"],"走动":["1.行走而使身体活动：坐的时间久了，应该～～。\n2.指亲戚朋友之间彼此来往：两家常～，感情很好。"],"走路":["1.（人）在地上走：孩子会～了。走了两天的路，累坏了。\n2.指离开；走开：不好好儿干，让他卷铺盖～。"],"走马观花":["比喻粗略地观察事物。也说走马看花。"],"赶早":["趁早；赶紧：～把货脱手。还是～儿走吧，要不就来不及了。"],"足球":["1.球类运动项目之一。在长方形场地上进行，正规场地长100—110米，宽64—75米。每队场上11人，主要用脚踢球、头顶球，除守门员外，其他人不得用手和臂触球（掷界外球除外）。以把球射入对方球门为得分。\n2.足球运动使用的球。空心，外壳由熟皮等质料制成，比篮球稍小。"],"距离":["1.在空间或时间上相隔：天津～北京约有一百二十公里。现在～唐代已经有一千多年。\n2.相隔的长度：等～。拉开一定的～。他的看法和你有～。"],"跟着":["1.跟\n2.紧接着：听完报告～就讨论。"],"跟随":["1.常作为一个侍从或随从跟在后面。\n2.旧指跟随人员。"],"路基":["铁路或公路的基础。在天然地面上开挖成的称为路堑，填筑成的称为路堤。"],"路边":["靠近大路的长条土地。"],"身不由己":["由：听从。身体不由自己作主。"],"身体":["一个人或一个动物的生理组织的整体，有时专指躯干和四肢。"],"车站":["陆路交通运输线上设置的停车地点，是上下乘客或装卸货物的场所。"],"转学":["学生从一个学校转到另一个学校学习。"],"转弯":["1.拐弯儿：～抹角。这儿离学校很近，一～儿就到了。\n2.比喻改变认识或想法：他感到太突然了，一时转不过弯儿来。"],"转移":["1.改换位置，从一方移到另一方：～阵地。～方向。～目标。～视线。\n2.改变：客观规律不以人们的意志为～。"],"转身":["1.转过身。\n2.比喻时间很短：刚说好了的，一～就不认账。"],"轻便":["1.重量较小，建造较易，或使用方便：小巧～。～铁路。～摩托车。\n2.轻松；容易：贪图～，反而误事。"],"轻松":["不感到有负担；不紧张：～活儿。～愉快。"],"轻视":["不重视；不认真对待：～劳动。受人～。"],"轻轻":["1.用很少力量或压力地。\n2.温和地；温柔地。"],"轻重":["1.重量的大小；用力的大小。\n2.程度的深浅；事情的主次：大夫根据病情～来决定病人要不要住院。工作要分～缓急，不能一把抓。\n3.（说话做事的）适当限度：小孩子说话不知～。"],"边界":["地区和地区之间的界线（多指国界，有时也指省界、县界）：～线。越过～。"],"边角":["1.亦作“邉角”。边地的画角或画角声。\n2.边地。\n3.指物体边沿和两个边沿相接的部分。\n4.制作物品时，原材料经切割、裁剪下来的多余部分。\n5.围棋术语。棋盘的边和角部分。"],"达到":["到（多指抽象事物或程度）：达得到。达不到。目的没有～。～国际水平。"],"达成":["达到；得到（多指商谈后得到结果）：～协议。"],"过去":["1.时间词。现在以前的时期（区别于“现在、将来”）：～的工作只不过像万里长征走完了第一步。\n2.离开或经过说话人（或叙述的对象）所在地向另一个地点去：你在这里等着，我～看看。门口刚～一辆汽车。\n3.婉辞，死亡（后面要加“了”）：他祖父昨天夜里～了。\n4.用在动词后，表示离开或经过自己所在的地方：我对准了球门一脚把球踢～。老乡又送～几床被子给战士们盖。\n5.用在动词后，表示反面对着自己：我把信封翻～，细看邮戳上的日子。\n6.用在动词后，表示失去原来的、正常的状态：病人晕～了。\n7.用在动词后，表示通过：蒙混不～了。\n8.用在形容词后，表示超过（多跟“得”或“不”连用）：鸡蛋还能硬得过石头去?。天气再热，也热不过乡亲们的心去。"],"过时":["1.过了规定的时间：～不候。\n2.过去流行现在已经不流行；陈旧不合时宜：他戴着一顶～的毡帽。"],"过来":["1.从另一个地点向说话人（或叙述的对象）所在地来：车来了，赶快～吧!。那边有只小船～了。\n2.用在动词后，表示时间、能力、数量充分（多跟“得”或“不”连用）：活儿不多，我一个人干得～。这几天我忙不～。\n3.用在动词后，表示来到自己所在的地方：捷报从四面八方飞～。敌人几次三番想冲过桥来，都叫我们给打退了。\n4.用在动词后，表示正面对着自己：他转过脸来，我才认出是位老同学。\n5.用在动词后，表示回到原来的、正常的状态：醒～了。觉悟～了。他真固执，简直劝不～。爬到山顶，大家都累得喘不过气来。"],"过目不忘":["看过就不忘记。形容记忆力非常强。"],"过节":["1.在节日进行庆祝等活动。"],"运动会":["多项体育运动的竞赛会。"],"运笔":["运用笔（写或画）；动笔：时而搁笔沉思，时而～如飞。"],"运行":["周而复始地运转（多指星球、车船等）：人造卫星的～轨道。列车～示意图。缩短列车的～时间。"],"运送":["把人员或物资运到别处：～返乡民工。～救灾物资。"],"近乎":["接近于。"],"近似":["相近或相像但不相同：这两个地区的方音有些～。他说话的腔调～唐山话。"],"近处":["附近的地方。"],"近郊":["城市附近的郊区：北京～。"],"这个":["1.指示代词。\n2.这一个：～孩子真懂事。～比那个沉，我们两个人抬。\n3.这东西；这事情：你问～吗?这叫哈密瓜。他为了～忙了好几天。\n4.用在动词、形容词之前，表示夸张：大家～乐啊!"],"这么":["〈代〉指示性质、状态、方式、程度等。"],"这些":["指示代词。指示较近的两个以上的人或事物：～就是我们的意见。～日子老下雨。也说这些个。"],"这样":["“这（么）样”可以用作定语或状语，也可以用作补语或谓语。“这么”只能用作定语或状语。"],"这边":["在这里。"],"这里":["zhè li的又音。义同“这里zhè li”。"],"进入":["进到某个范围或某个时期里：～学校。～新阶段。～角色。"],"进退两难":["进退都不好，形容处境困难。"],"进门":["1.走进门：他个儿高，～要低头。\n2.入门；摸门儿：我做学问还没～，请多指教。\n3.指女子出嫁到男家：她是刚～的儿媳妇。"],"远朋":["远方的友人。"],"连忙":["赶紧；急忙：老大娘一上车，乘客就～让座。"],"连接":["1.（事物）互相衔接：山岭～。\n2.使连接：～线路。"],"迟到":["到得比规定的时间晚。"],"送报":["1.投递电报。\n2.指投递报纸。如：他每天送报一千多份，从未出过差错。"],"送给":["1.作为无偿物给予。\n2.作为礼物而给予。"],"选举":["用投票或举手等表决方式选出代表或负责人：～工会主席。"],"选手":["被选上参加比赛的人：乒乓球～。"],"选择":["挑选：～对象。～地点。"],"通宵达旦":["整夜；从天黑到天亮。"],"通知":["1.把事项告诉人知道：你回去～大家，明天就动工。你走以前～我一声。\n2.通知事项的文书或口信：把～发出去。口头～。"],"通车":["1.铁路或公路修通，开始行车：～典礼。\n2.有车来往：我老家在山区，那儿不～。"],"通过":["1.从一端或一侧到另一端或另一侧；穿过：电流～导线。队伍～了沙漠。路太窄，汽车不能～。\n2.议案等经过法定人数的同意而成立：～决议。该提案以四分之三的多数票获得～。\n3.以人或事物为媒介或手段而达到某种目的：～老艺人收集民间故事。～座谈会征询意见。\n4.征求有关的人或组织的同意或核准：～组织。～领导。这问题要～群众，才能做出决定。"],"造诣":["学问、技艺等所达到的水平：～很高。颇有～。诣（yì）。"],"道听途说":["路上听到的 传闻，随后就在路上传播出去。指没有根据的传闻。《论语 阳货》：“道听而塗（途）说，德之弃也。”"],"避免":["设法不使某种情形发生；防止：～冲突。看问题要客观、全面，～主观、片面。"],"那么":["1.指示代词。指示性质、状态、方式、程度等：我不好意思～说。像油菜花～黄。来了～多的人。\n2.指示代词。指示数量：借～二三十个麻袋就够了。我只见过他～一两次。\n3.表示顺着上文的语意，申说应有的结果或作出判断（上文可以是对方的话，也可以是自己提出的问题或假设）：这样做既然不行，～你打算怎么办呢?。如果你认为可以这么办，～咱们就赶紧去办吧!"],"那些":["指示代词。指示两个以上的人或事物：奶奶爱把早年间的～事儿讲给孩子们听。"],"部位":["位置（多用于人的身体）：发音～。消化道～。"],"部分":["整体中的局部；整体里的一些个体：检验机器各～的性能。我校～师生参加了夏令营活动。"],"都来":["1.统统，完全。\n2.总共；共有。\n3.算来。\n4.总是，老是。"],"采取":["1.选择施行（某种方针、政策、措施、手段、形式、态度等）：～守势。～紧急措施。\n2.取：～指纹。"],"里面":["〈名〉也说里面儿。里边。"],"重点":["1.杠杆中承受重量的一点。2.〈名〉同类事物中的重要的或主要的部分。3.〈名〉重要的或主要的；有重点的。"],"重视":["认为人的德才优良或事物的作用重要而认真对待；看重：～学习。～群众的发明创造。"],"重量":["1.物体受到的重力的大小。重量随高度或纬度变化而有微小差别。在高处比在低处小一些，在两极比在赤道大一些。\n2.习惯上用来指质量。"],"量入为出":["根据收入的多少来定支出。《礼记·王制》：“冢宰制国用，必于岁之杪，五谷皆入，然后制国用…量入以为出。”"],"锅巴":["1.焖饭时紧贴着锅的焦了的一层饭。\n2.米粟加作料等烘制成的一种食品：三鲜～。"],"长命百岁":["寿命很长，能活到一百岁。常用作祝福长寿之词。"],"长男":["1.长子，排行最大的儿子。《易·说卦》：“震一索而得男，故谓之长男。”《史记·李斯列传》：“斯 长男 由 为 三川 守。”《水浒传》第二二回：“他有两个孩儿：长男叫做 毛头星 孔明，次子叫做 独火星 孔亮。”\n2.成年的男子。汉 焦赣《易林·坤之同人》：“长男少女，相向共语，析薪在尅，福禄欢喜。”\n3.《神异经·中荒经》：“东方有宫，青石为墻，门有银牓，以青石碧鏤，曰 天地 长男 之宫。”后以“长男”指代寺观。明 袁宏道《法华庵同诸开士限韵》：“竹路编龙子，花时过长男。”"],"门口":["门跟前：学校～。"],"问候":["问好。"],"问号":["1.标点符号（?），表示疑问句末尾的停顿。\n2.疑问：他今天晚上能不能赶到还是个～。"],"问好":["询问安好，表示关切：请向伯母～。问同志们好!"],"问答":["发问和回答：环保知识～。"],"闲谈":["没有一定中心地谈无关紧要的话。"],"闻名":["1.听到名声：～已久。～不如见面。\n2.有名：～全国。二万五千里长征～世界。西湖是～的风景区。"],"阅读":["看（书报等）并领会其内容：～报刊。～文件。"],"队伍":["1.军队：从～上转业回来。\n2.有组织的集体：干部～。知识分子～。\n3.有组织的群众行列：游行～。排好～。"],"队员":["1.团队的成员。\n2.特指中国少年先锋队队员。"],"队旗":["一个队的旗帜。"],"队长":["1.对一群人或一个单位有行使权力和负有责任的人。\n2.一队的主要负责人。"],"阳光":["1.日光：～灿烂。～充足。\n2.属性词。积极开朗、充满青春活力的：～女孩。～少年。\n3.属性词。（事物、现象等）公开透明：～采购。～操作。"],"阳历":["也叫太阳历。历法的一种。年的长度以地球绕太阳公转周期（365日5时48分46秒）为依据，月的长短则是人为决定，与月亮圆缺无关。现代各国通用的公历就是由阳历改编而成的，通称阳历。"],"阴暗":["暗；阴沉：地下室里～而潮湿。天色～。～心理。～的脸色。"],"阴雨连绵":["形容一直下雨的状态。"],"阿公":["1.丈夫的父亲。\n2.祖父。\n3.尊称老年男子。"],"阿姐":["姐姐。"],"阿姨":["1.称呼跟母亲辈分相同、年纪差不多的无亲属关系的妇女：王～。售票员～。\n2.对保育员或保姆的称呼。"],"阿婆":["1.丈夫的母亲。\n2.祖母。\n3.尊称老年妇女。"],"阿爸":["爸爸。"],"院墙":["1.见“ 院墙 ”。\n2.亦作“ 院墻 ”。\n3.围绕宅舍的墙。《旧唐书·高宗纪上》：“有司奏请造排车七百乘，拟行幸载排城；上以为劳民，乃於旧顿置院墙焉。” 刘坚 《“强盗”的女儿》：“ 杨团总 话刚落尾，爹的声音隔着院墙传进来，他讲话的声音好宏亮哟！”"],"除了":["1.表示所说的不计算在内：那条山路，～他，谁也不熟悉。\n2.跟“还、也、只”连用，表示在什么之外，还有别的：他～教课，还负责学校里工会的工作。他～写小说，有时候也写写诗。\n3.跟“就是”连用，表示不这样就那样：刚生下来的孩子，～吃就是睡。"],"随和":["和气而不固执己见：他脾气～，跟谁都合得来。"],"随风":["1.卦象名。\n2.任凭风吹而不由自主。\n3.比喻随俗从众。"],"难免":["不容易避免：没有经验，就～要走弯路。搞新工作，困难是～的。"],"难关":["难通过的关口，比喻不易克服的困难：突破～。攻克一道道～。"],"难受":["1.身体不舒服：浑身疼得～。\n2.伤心；不痛快：他知道事情做错了，心里很～。"],"难过":["1.不容易过活：那时家里人口多，收入少，日子真～。\n2.难受：肚子里～得很。他听到老师逝世的消息，心里非常～。"],"雄伟":["1.雄壮而伟大：气魄～。～的天安门。\n2.魁梧；魁伟：身材～。"],"雕刻":["1.在木、石、玉、金属、象牙等材料上雕琢或刻画出形象或图案。\n2.雕刻而成的艺术品。\n3.指雕塑。"],"雨点":["形成雨的小水滴。"],"雷达":["英语音译词。意为无线电探测和定位。一般指利用发射和接收反射电磁波发现目标并测定其位置的电子设备。主要组成部分有发射机、天线、接收机和显示器等。按工作状态分脉冲雷达和连续波雷达两类。广泛应用于侦察、警戒、导航、跟踪、瞄准、制导和地形测量、气象探测等方面。"],"需求":["1.由需要而产生的要求。\n2.经济学上指消费者购买商品或劳务的欲望和能力。在市场经济中，人的欲望和需求能力，都是通过货币来实现和体现的。"],"青草":["绿色的草（区别于“干草”）。"],"青蛙":["两栖动物，头部扁而宽，口阔，眼大，皮肤光滑，颜色因环境而不同，通常为绿色，有灰色斑纹，趾间有蹼。生活在水中或近水的地方，善跳跃，会游泳，多在夜间活动，雄的叫声响亮。吃田间的害虫，对农业有益。通称田鸡。"],"青鸟":["古典文学中借指传信的信使。"],"非但":["不但：他～能完成自己的任务，还肯帮助别人。～我不知道，连他也不知道。"],"非凡":["超过一般；不寻常：～的组织才能。市场上热闹～。"],"非同小可":["不是寻常的。形容事情重要或情况严重。小可：轻微，寻常。"],"非常":["1.属性词。异乎寻常的；特殊的：～时期。～会议。\n2.十分；极：～光荣。～高兴。～努力。他～会说话。"],"面对":["1.指面对面或仿佛面对面，含有决心和坚毅或对一个人处境的真实评价。\n2.面临，遭遇到。"],"面条":["用面粉做的细条状的食品。"],"面谈":["当面商谈；当面交谈：改日～。～招考问题。"],"韬瑜":["谓藏匿玉般的光彩。"],"音乐":["用有组织的乐音来塑造形象，反映现实生活，表达思想感情的一种艺术。基本表现手段是旋律和节奏。分声乐和器乐两大部门。"],"音节":["由一个或几个音素组成的语音单位。其中包含一个比较响亮的中心。一句话里头，有几个响亮的中心就是有几个音节。在汉语里，一般地讲，一个汉字是一个音节，一个音节写成一个汉字（儿化韵一个音节写成两个字，儿不自成音节，是例外）。"],"领先":["1.共同前进时走在最前面：他迈开大步，～登上了山顶。\n2.比喻水平、成绩等处于最前列：这个县的粮食产量处于全国～地位。上半场二比一，北京足球队～。"],"飞将":["1.“ 飞将军 ”的省称。 唐 王昌龄 《出塞》诗：“但使 龙城 飞将 在，不教胡马度 阴山 。”\n2.泛称敏捷善战的将领。 唐 李涉 《寄河阳从事杨潜》诗：“吾友从军在 河 上，腰佩吴鉤佐飞将。”"],"飞快":["1.非常迅速：渔船鼓着白帆，～地向远处驶去。日子过得～，转眼又是一年。\n2.非常锋利：镰刀磨得～。"],"飞机":["有动力装置，主 要靠机翼产生气动升力升空的航空器。通常由机身、机翼、尾翼、起落装置和动力装置等组成。按用途，分军用飞机和民用飞机；按动力，分喷气式飞机、螺旋桨式飞机；按起落场所，分陆上飞机、水上飞机、水陆两用飞机、舰载飞机等。"],"飞来飞去":["来回地冲、跳或飞。"],"飞虫":["1.指飞鸟。\n2.能飞的虫。"],"飞行":["航空器、航天器以及导弹、火箭等在空中以一定的高度和速度航行。"],"飞鸟":["1.会飞的鸟类。亦泛指鸟类。\n2.指古代藏钩游戏中不固定属于哪一方的人。"],"食物":["可以充饥的东西。"],"首先":["1.最先；最早：～报名。\n2.第一（用于列举事项）：～，是大会主席报告；其次，是代表发言。"],"首车":["首班车"],"首长":["政府各部门中的高级领导人或部队中较高级的领导人：部～。团～。"],"骑呢":["个粤语形容词，有时用来形容别人衣着打扮突兀，有时指人举止笨拙失礼，有时指人性格古怪。"],"骨干":["1.长骨的中央部分，两端跟骨骺相连，里面是髓腔。（图见“骨头”）\n2.比喻在总体中起主要作用的人或事物：～分子。～企业。业务～。"],"高度":["1.高低的程度；从地面或基准面向上到某处的距离；从物体的底部到顶端的距离：飞行的～。这座山的～是四千二百米。\n2.属性词。程度很高的：～的劳动热情。～评价他的业绩。这个问题应该受到～重视。"],"鬼脸":["1.用厚纸做成的假面具，是一种玩具，多按照戏曲中的脸谱制作。\n2.故意做出来的滑稽的面部表情：扮～。他把舌头一伸，做了个～儿。"],"黄色":["1.黄颜色。\n2.属性词。象征腐化堕落，特指色情的：～小说。～录像。"],"黑暗":["1.没有光：山洞里一片～。\n2.比喻（社会状况）落后；（统治势力）腐败：～势力。～统治。"],"黑板":["用木头或玻璃等制成的可以在上面用粉笔写字的平板，一般为黑色。"],"黑色":["1.亮度最低的非彩色的或消色差的物体的颜色最暗的灰色与白色截然不同的消色差的颜色。\n2.被认为特别属于那些既不能反射、又不能透过能使人感觉到的微小入射光的物体，是心理学的六种基色之一。\n3.任何亮度和浓度都很低的物体颜色。"],"默读":["不出声地读书，是语文教学上训练阅读能力的一种方法：～课文。"]};

// 获取组词：优先缓存（手动+搜狗在线），其次搜狗词库，再其次内置表
function getWords(ch) {
  if (wordCache[ch] && wordCache[ch].length >= 2) return wordCache[ch];
  if (SOGOU_WORDS[ch] && SOGOU_WORDS[ch].length >= 2) return SOGOU_WORDS[ch];
  return wordsMap[ch] || [];
}

// 获取组词来源标记
function getWordSource(ch) {
  if (wordCache[ch] && wordCache[ch].length >= 2) {
    return wordCache[ch]._source || '缓存';
  }
  if (SOGOU_WORDS[ch] && SOGOU_WORDS[ch].length >= 2) return '搜狗';
  if (wordsMap[ch]) return '内置';
  return '无';
}

// 手动添加组词：格式 "字:词1,词2"
function addManualWord() {
  const input = document.getElementById('manualWordInput');
  const val = input.value.trim();
  if (!val) { alert('请输入，格式如：睿:睿智,睿哲'); return; }
  const parts = val.split(':');
  if (parts.length < 2) { alert('格式错误，请用 字:词1,词2 格式'); return; }
  const ch = parts[0].trim()[0];
  const words = parts[1].split(/[,，]/).map(w => w.trim()).filter(w => w.length >= 2);
  if (!ch || words.length < 1) { alert('请至少输入一个2字词'); return; }
  if (!wordCache[ch]) wordCache[ch] = [];
  for (const w of words) {
    if (!wordCache[ch].includes(w)) wordCache[ch].push(w);
  }
  wordCache[ch]._source = '手动';
  saveWordCache();
  input.value = '';
  updateWordStatus();
  alert(`已为「${ch}」添加组词：${wordCache[ch].join('、')}`);
}

// 搜狗汉语在线获取组词：优先本地代理，回退CORS代理
const LOCAL_PROXY = 'http://127.0.0.1:8899/proxy?url=';
const CORS_PROXIES = [
  url => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url),
  url => 'https://corsproxy.io/?url=' + encodeURIComponent(url),
  url => 'https://cors.eu.org/' + url
];

// 检测本地代理是否可用
let localProxyAvailable = false;
(async function checkLocalProxy() {
  try {
    const resp = await fetch('http://127.0.0.1:8899/health', { signal: AbortSignal.timeout(2000) });
    if (resp.ok) {
      localProxyAvailable = true;
      console.log('本地组词代理已连接');
    }
  } catch(e) {
    console.log('本地代理未启动，将使用在线CORS代理');
  }
  updateProxyStatus();
})();

// 更新本地代理状态显示
function updateProxyStatus() {
  const el = document.getElementById('proxyStatus');
  if (!el) return;
  if (localProxyAvailable) {
    el.innerHTML = '<span style="color:#27ae60">● 本地代理已连接</span>';
  } else {
    el.innerHTML = '<span style="color:#e67e22">○ 本地代理未启动（在线获取可能不稳定）</span>';
  }
}

function parseSogouHtml(html) {
  const m = html.match(/window\.__INITIAL_STATE__\s*=\s*(\{[\s\S]*?\});\s*\(function/);
  if (!m) return null;
  const state = JSON.parse(m[1]);
  const detail = state.detail;
  if (!detail || typeof detail !== 'object') return null;
  const resultData = detail.resultData;
  if (!resultData || typeof resultData !== 'object') return null;
  // 提取拼音
  const pinyinList = resultData.pinyin;
  const pinyin = (pinyinList && pinyinList.length) ? pinyinList[0] : '';
  const zuciData = resultData.zuci;
  if (!zuciData || !zuciData.length) return {pinyin: pinyin, words: []};

  let allWords = [];
  for (const group of zuciData) {
    if (!group || typeof group !== 'object') continue;
    const zuci_list = group.zuci;
    if (!zuci_list || !zuci_list.length) continue;
    for (const w of zuci_list) {
      if (w && typeof w === 'object' && w.text && w.text.length === 2) {
        allWords.push(w);
      } else if (typeof w === 'string' && w.length === 2) {
        allWords.push({text: w, hot: 0, shiyi: ''});
      }
    }
  }
  allWords.sort((a, b) => (b.hot || 0) - (a.hot || 0));
  const seen = new Set();
  const unique = [];
  for (const w of allWords) {
    if (!seen.has(w.text)) {
      seen.add(w.text);
      unique.push(w);
    }
  }
  if (unique.length >= 2) return {pinyin: pinyin, words: unique.slice(0, 4)};
  return {pinyin: pinyin, words: []};
}

async function fetchSogouWords(ch) {
  const targetUrl = 'https://hanyu.sogou.com/result?query=' + encodeURIComponent(ch);

  // 1. 优先使用本地代理
  if (localProxyAvailable) {
    try {
      const resp = await fetch(LOCAL_PROXY + encodeURIComponent(targetUrl), { signal: AbortSignal.timeout(15000) });
      if (resp.ok) {
        const html = await resp.text();
        const result = parseSogouHtml(html);
        if (result && result.words && result.words.length >= 2) return result;
      }
    } catch(e) {
      console.log('本地代理失败:', e.message);
      localProxyAvailable = false;
      updateProxyStatus();
    }
  }

  // 2. 回退到CORS代理
  for (const proxy of CORS_PROXIES) {
    try {
      const resp = await fetch(proxy(targetUrl), { signal: AbortSignal.timeout(15000) });
      if (!resp.ok) continue;
      const html = await resp.text();
      const result = parseSogouHtml(html);
      if (result && result.words && result.words.length >= 2) return result;
    } catch(e) {
      console.log('CORS代理失败:', e.message);
    }
  }
  return null;
}
